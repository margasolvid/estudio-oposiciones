<style>
/* Layout: cabecera fija con temas en fichas; debajo, tarjetas de artículo en una columna legible (cuaderno de repaso con rotulador) */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#14201d; --muted:#5b6b66; --line:#d5ddda;
  --accent:#0d6b5c; --accent-soft:#dcefe9; --hot:#c2253c; --hot-soft:#fbe1e5;
  --marker:#fff06a; --marker-ink:#3d3500;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --paper:#16211e; --ink:#e4ece9; --muted:#9aaba5; --line:#2a3834;
  --accent:#4fc2a9; --accent-soft:#163a33; --hot:#ff7b8c; --hot-soft:#3a1a20; --marker:#5c5413; --marker-ink:#fff6b0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --paper:#16211e; --ink:#e4ece9; --muted:#9aaba5; --line:#2a3834;
  --accent:#4fc2a9; --accent-soft:#163a33; --hot:#ff7b8c; --hot-soft:#3a1a20; --marker:#5c5413; --marker-ink:#fff6b0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 10px;display:grid;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.count b{color:var(--hot)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 200px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tg{font:inherit;font-size:.85rem;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.tg[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;font-family:var(--f-mono);font-size:.78rem;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.done{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 40px;display:grid;gap:26px}
.tema{display:grid;gap:10px}
.tema h2{font-family:var(--f-display);font-weight:700;font-size:1.08rem;margin:0;display:flex;gap:10px;align-items:baseline;text-wrap:balance}
.tema h2 .id{font-family:var(--f-mono);font-size:.8rem;color:var(--paper);background:var(--accent);padding:2px 7px;border-radius:5px;flex:none}
.por{margin:0;font-size:.88rem;color:var(--muted);border-left:3px solid var(--hot);padding-left:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.card.known{opacity:.55}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.art{font-family:var(--f-mono);font-weight:500}
.tit{color:var(--muted);font-size:.88rem;flex:1 1 200px;min-width:0}
.badge{font-family:var(--f-mono);font-size:.74rem;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.badge.hot{background:var(--hot-soft);color:var(--hot)}
.badge.new{background:var(--marker);color:var(--marker-ink)}
.cl{margin:0}
.memo{margin:0;font-weight:600}
.memo mark{background:var(--marker);color:var(--marker-ink);padding:1px 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.82rem}
.foot a{color:var(--accent)}
.know{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.know[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.hide-ans .ans{filter:blur(6px);cursor:pointer;user-select:none}
.hide-ans .ans.show{filter:none}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (prefers-reduced-motion:no-preference){.ans{transition:filter .2s}}
</style>

<script>
const DATA = {"temas": [{"id": "PG1", "parte": "General", "n": 1, "tit": "CE: Título Preliminar, Título I (derechos y deberes) y Título VIII (organización territorial)", "preg": 964, "por": "", "arts": [{"ley": "CE", "art": "1", "tit": "TÍTULO PRELIMINAR", "n": 78, "cl": "4 valores: libertad, justicia, igualdad, pluralismo político. Soberanía en el pueblo. Monarquía parlamentaria.", "memo": "Valores superiores «LIJUIGPO»: LIbertad, JUsticia, IGualdad, Pluralismo pOlítico. Soberanía en el pueblo español. Monarquía parlamentaria.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "9", "tit": "TÍTULO PRELIMINAR", "n": 54, "cl": "7 principios: legalidad, jerarquía, publicidad, irretroactividad, seguridad jurídica, responsabilidad, interdicción de la arbitrariedad.", "memo": "9.3 = «LE-JE-PU-IRRE-SE-RE-IN» (7 principios): LEgalidad, JErarquía normativa, PUblicidad de las normas, IRREtroactividad de las sancionadoras no favorables o restrictivas, SEguridad jurídica, REsponsabilidad e INterdicción de la arbitrariedad de los poderes públicos. Ojo: la «eficacia» NO está (es del art. 103).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "149", "tit": "CAPÍTULO TERCERO De las Comunidades Autónomas", "n": 47, "cl": "Lista exclusiva; cláusula residual; prevalencia y supletoriedad (149.3).", "memo": "Competencias exclusivas del Estado: 32 materias. Trucos: lo «básico» y la «legislación» suelen ser del Estado (legislación laboral, mercantil, penal, procesal, civil con matices) y la «ejecución» de la CA. Las cláusulas residuales del 149.3 favorecen al Estado.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "141", "tit": "CAPÍTULO SEGUNDO De la Administración Local", "n": 45, "cl": "Personalidad jurídica propia; agrupación de municipios; alteración por ley orgánica.", "memo": "Provincia: entidad local con personalidad jurídica propia; agrupación de municipios y división territorial del Estado; cambio de límites por LEY ORGÁNICA; gobierno: Diputaciones; islas: Cabildos o Consejos.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "53", "tit": "CAPÍTULO CUARTO De las garantías de las libertades y derecho", "n": 41, "cl": "53.2: preferencia y sumariedad + amparo para art. 14, Sección 1.ª y objeción de conciencia (art. 30).", "memo": "Garantías «53.1 ley-contenido esencial; 53.2 preferente, sumario y amparo (art. 14, Sección 1.ª y objeción del art. 30); 53.3 principios rectores que informan la legislación y solo se alegan conforme a sus leyes».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "140", "tit": "CAPÍTULO SEGUNDO De la Administración Local", "n": 38, "cl": "Autonomía; personalidad jurídica plena; concejales por sufragio; concejo abierto.", "memo": "Municipio: autonomía garantizada y personalidad jurídica PLENA (la provincia, PROPIA: art. 141). Concejales elegidos por sufragio universal, igual, libre, directo y secreto; el Alcalde, por los concejales o por los vecinos. La ley regula el concejo abierto.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "137", "tit": "CAPÍTULO PRIMERO Principios generales", "n": 38, "cl": "Municipios, provincias y CCAA; autonomía para sus intereses.", "memo": "Estado territorial «MPCA»: Municipios, Provincias y Comunidades Autónomas, todas con autonomía para la gestión de SUS intereses.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "17", "tit": "Sección 1.ª De los derechos fundamentales y de las libertade", "n": 28, "cl": "Detención preventiva: máximo 72 horas. Habeas corpus.", "memo": "Detención preventiva «72 horas máximo» (no más de lo estrictamente necesario). Derechos del detenido: informado de forma inmediata y comprensible, no declarar, abogado. Habeas corpus = puesta inmediata a disposición judicial. Prisión provisional: plazo máximo por ley.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "148", "tit": "CAPÍTULO TERCERO De las Comunidades Autónomas", "n": 28, "cl": "Lista del art. 148 (autogobierno, urbanismo, agricultura, turismo, deporte, asistencia social…); el 149 son las exclusivas del Estado.", "memo": "«148 = lo que PUEDEN coger las CCAA; 149 = lo que el Estado se QUEDA». Truco: 148 empieza por «organización de sus instituciones de autogobierno». Pasados 5 años pueden ampliar competencias reformando el Estatuto (148.2).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "54", "tit": "CAPÍTULO CUARTO De las garantías de las libertades y derecho", "n": 27, "cl": "Alto comisionado de las Cortes; designado por ellas; ley orgánica.", "memo": "Defensor del Pueblo: «Alto comisionado de las CORTES», designado por ellas, para defender el Título I; supervisa la actividad de la Administración; regulado por LO (LO 3/1981). Mandato de 5 años.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}]}, {"id": "PG2", "parte": "General", "n": 2, "tit": "CE: Título II (Corona) y Título III, caps. I y II (Cortes: cámaras y elaboración de las leyes)", "preg": 338, "por": "", "arts": [{"ley": "CE", "art": "68", "tit": "CAPÍTULO PRIMERO De las Cámaras", "n": 28, "cl": "300–400 diputados; provincia como circunscripción; 4 años.", "memo": "Congreso «300-400 / 4 años / provincia»: mínimo 300 y máximo 400 diputados (la LOREG fija 350); circunscripción = provincia; Ceuta y Melilla 1 diputado cada una; representación proporcional; mandato de 4 años.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "86", "tit": "CAPÍTULO SEGUNDO De la elaboración de las leyes", "n": 25, "cl": "Extraordinaria y urgente necesidad; convalidación en 30 días.", "memo": "Decreto-ley: «extraordinaria y urgente necesidad»; límites «IN-DE-CA-E» (INstituciones básicas, DErechos del Título I, CCAA, Electoral general). Convalidación por el Congreso en 30 días; puede tramitarse como proyecto de ley urgente.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "82", "tit": "CAPÍTULO SEGUNDO De la elaboración de las leyes", "n": 24, "cl": "Delegación legislativa: Cortes al Gobierno mediante ley de bases (textos articulados) o ley ordinaria (textos refundidos). Expresa, para materia concreta y con plazo. Prohibida la subdelegación. Resultado: Decretos Legislativos.", "memo": "«Bases → Articulado; Ordinaria → Refundido». Nunca materias orgánicas, nunca subdelegar, siempre con plazo.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "57", "tit": "TÍTULO II De la Corona", "n": 19, "cl": "Varón a mujer (en el mismo grado); Príncipe de Asturias; abdicaciones por ley orgánica.", "memo": "Sucesión: «Juan Carlos I, primogenitura y representación; línea anterior a posterior; grado más próximo; VARÓN a mujer; mayor a menor». Heredero = Príncipe de Asturias. Extinguidas las líneas → Cortes. Abdicaciones y dudas → LEY ORGÁNICA.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "59", "tit": "TÍTULO II De la Corona", "n": 18, "cl": "Padre, madre o pariente mayor de edad más próximo; las Cortes en su defecto.", "memo": "Regencia: si el Rey es menor, el padre o la madre y si no, el pariente mayor de edad más próximo. Si se inhabilita (reconocido por las Cortes): el Príncipe heredero mayor de edad. Si no hay nadie: la nombran las Cortes con 1, 3 o 5 personas. Requisitos: ser español y mayor de edad.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "66", "tit": "CAPÍTULO PRIMERO De las Cámaras", "n": 17, "cl": "Las Cortes Generales representan al pueblo español: Congreso y Senado. Ejercen la potestad legislativa, aprueban Presupuestos, controlan al Gobierno. Son inviolables.", "memo": "Funciones «LPC»: Legislar, Presupuestar, Controlar. Inviolables: «a las Cortes no se las toca».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "62", "tit": "TÍTULO II De la Corona", "n": 17, "cl": "Sancionar, convocar y disolver, mando supremo de las FF. AA., Alto Patronazgo.", "memo": "Funciones del Rey (art. 62): SANCIONA y promulga, CONVOCA y disuelve, convoca REFERÉNDUM, PROPONE e inviste Presidente, NOMBRA y separa ministros, EXPIDE decretos, CONFIERE empleos y honores, informado y PRESIDE el Consejo de Ministros a petición, MANDO SUPREMO de las FF. AA., GRACIA (sin indultos generales) y ALTO PATRONAZGO de las Reales Academias. «Dirigir la política» NO: es del Gobierno (97).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "87", "tit": "CAPÍTULO SEGUNDO De la elaboración de las leyes", "n": 16, "cl": "Gobierno, Congreso, Senado; Asambleas CCAA (máx. 3 miembros); popular: 500.000 firmas.", "memo": "Iniciativa legislativa «GO-CON-SEN + CCAA + 500.000»: Gobierno, Congreso y Senado. Las Asambleas autonómicas piden un proyecto al Gobierno o remiten una proposición (con un máximo de 3 defensores). La iniciativa popular exige 500.000 firmas y NO cabe en «OTIG»: Orgánica, Tributaria, Internacional y Gracia.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "81", "tit": "CAPÍTULO SEGUNDO De la elaboración de las leyes", "n": 16, "cl": "Mayoría absoluta del Congreso en votación final.", "memo": "Leyes orgánicas: «DE-ES-RE + las que diga la CE»: Derechos fundamentales, EStatutos, Régimen electoral general. Aprobación: MAYORÍA ABSOLUTA del Congreso en votación final sobre el conjunto. No admiten delegación legislativa, decreto-ley ni ILP.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "90", "tit": "CAPÍTULO SEGUNDO De la elaboración de las leyes", "n": 15, "cl": "2 meses para veto/enmiendas; 20 días naturales si es urgente; veto: mayoría absoluta.", "memo": "Senado: «2 meses / 20 días si urge». Veto por mayoría absoluta; el Congreso lo levanta por mayoría absoluta o, a los 2 meses, por simple. Enmiendas: el Congreso las acepta o no por mayoría simple.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}]}, {"id": "PG3", "parte": "General", "n": 3, "tit": "CE: Títulos IV (Gobierno y Administración), V (Gobierno–Cortes) y VI (Poder Judicial)", "preg": 255, "por": "", "arts": [{"ley": "CE", "art": "103", "tit": "TÍTULO IV Del Gobierno y de la Administración", "n": 46, "cl": "Eficacia, jerarquía, descentralización, desconcentración, coordinación. Mérito y capacidad.", "memo": "Principios de la Administración «EJE-DesDes-Co»: Eficacia, Jerarquía, Descentralización, Desconcentración, Coordinación. Acceso según mérito y capacidad (el 23.2 añade igualdad).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "117", "tit": "TÍTULO VI Del Poder Judicial", "n": 25, "cl": "Emana del pueblo; independientes, inamovibles, responsables, sometidos a la ley.", "memo": "Justicia «emana del pueblo», se administra en nombre del Rey. Jueces «IIRS»: Independientes, Inamovibles, Responsables y Sometidos únicamente al imperio de la ley. Unidad jurisdiccional; prohibidos los tribunales de excepción.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "99", "tit": "TÍTULO IV Del Gobierno y de la Administración", "n": 21, "cl": "Mayoría absoluta; a las 48 h simple; 2 meses y disolución.", "memo": "Investidura «absoluta, 48 h simple, 2 meses y fuera»: 1.ª votación mayoría absoluta; 48 horas después mayoría simple; si en 2 meses desde la 1.ª votación nadie la obtiene → disolución de ambas Cámaras con refrendo del Presidente del Congreso.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "124", "tit": "TÍTULO VI Del Poder Judicial", "n": 16, "cl": "Ministerio Fiscal: promueve la acción de la justicia en defensa de la legalidad, los derechos y el interés público; principios de unidad de actuación y dependencia jerárquica, legalidad e imparcialidad. Fiscal General del Estado nombrado por el Rey a propuesta del Gobierno, oído el CGPJ.", "memo": "Principios «U-D-L-I»: Unidad, Dependencia jerárquica, Legalidad, Imparcialidad. FGE: «Rey, a propuesta del Gobierno, oído el CGPJ».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "108", "tit": "TÍTULO V De las relaciones entre el Gobierno y las Cortes Ge", "n": 15, "cl": "El Gobierno responde solidariamente en su gestión política ante el Congreso de los Diputados.", "memo": "«108 = Gobierno ante el CONGRESO»: el Senado no hace caer al Gobierno.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "113", "tit": "TÍTULO V De las relaciones entre el Gobierno y las Cortes Ge", "n": 14, "cl": "1/10 de diputados, candidato, mayoría absoluta, 5 días, 2 días para alternativas.", "memo": "Moción de censura «1/10-MA-5-2-mismo periodo»: la propone 1/10 de los Diputados con un candidato; se aprueba por MAYORÍA ABSOLUTA del Congreso; no se vota hasta pasados 5 días, y en los 2 primeros caben mociones alternativas; si fracasa, sus firmantes no pueden presentar otra en el mismo período de sesiones.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "116", "tit": "TÍTULO V De las relaciones entre el Gobierno y las Cortes Ge", "n": 12, "cl": "Alarma 15 días; excepción 30 + 30; sitio: mayoría absoluta del Congreso.", "memo": "Estados: «ALARMA 15 – EXCEPCIÓN 30+30 – SITIO absoluta»: alarma por el Gobierno por 15 días, dando cuenta al Congreso (prórroga con autorización); excepción por el Gobierno con autorización previa del Congreso, 30 días + 30; sitio: mayoría absoluta del Congreso a propuesta exclusiva del Gobierno. El Congreso no puede disolverse.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "102", "tit": "TÍTULO IV Del Gobierno y de la Administración", "n": 10, "cl": "Sala de lo Penal del TS; traición: iniciativa de 1/4 del Congreso y mayoría absoluta.", "memo": "Responsabilidad criminal del Gobierno → Sala de lo Penal del TS. Traición o delito contra la seguridad del Estado: iniciativa de 1/4 del Congreso + aprobación por mayoría absoluta. Truco «1/4 acusa, la absoluta confirma». Prerrogativa de gracia: NO aplicable.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "122", "tit": "TÍTULO VI Del Poder Judicial", "n": 10, "cl": "Presidente del TS + 20 miembros; 5 años.", "memo": "CGPJ «1 + 20, 5 años»: Presidente del TS + 20 vocales nombrados por el Rey por 5 años: 12 jueces y magistrados + 8 juristas de más de 15 años (4 Congreso y 4 Senado por 3/5).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ley": "CE", "art": "98", "tit": "TÍTULO IV Del Gobierno y de la Administración", "n": 10, "cl": "El Gobierno: Presidente, Vicepresidentes (en su caso), Ministros y demás miembros que establezca la ley. El Presidente dirige y coordina. Incompatibilidades: no pueden ejercer otras funciones representativas (salvo el mandato parlamentario), públicas ni actividades profesionales o mercantiles.", "memo": "«P-V-M»: Presidente, Vice (si hay), Ministros. Pueden ser diputados, pero nada más.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}]}, {"id": "PG4", "parte": "General", "n": 4, "tit": "Estatuto de Autonomía CV: Títulos I a IV (Comunitat, derechos, Generalitat, competencias)", "preg": 312, "por": "", "arts": [{"ley": "EACV", "art": "20", "tit": "CAPÍTULO I Se modifica por el art. 24 de la Ley Orgánica 1/2", "n": 25, "cl": "Corts, President, Consell + Sindicatura, Síndic, CVC, AVL, CJC, CES.", "memo": "Generalitat = «CORTS-PRESIDENT-CONSELL». Otras instituciones «SiSiCuAcaJuCES»: Sindicatura de Comptes, Síndic de Greuges, Consell Valencià de Cultura, Acadèmia Valenciana de la Llengua, Consell Jurídic Consultiu y Comité Econòmic i Social.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "49", "tit": "TÍTULO IV Las Competencias Se modifica por el art. 55 de la ", "n": 24, "cl": "Competencias EXCLUSIVAS de la Generalitat (organización de sus instituciones, Derecho civil foral valenciano, normas procesales y procedimiento derivados del Derecho propio, régimen local, urbanismo, turismo, cultura, deporte, asistencia social...).", "memo": "Art. 49 = «el gran listado EXCLUSIVO». Truco: 49 es el número de las exclusivas; 50 = desarrollo legislativo y ejecución; 51 = ejecución.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "1", "tit": "TÍTULO I La Comunitat Valenciana Se modifica por el art. 1 d", "n": 18, "cl": "Nacionalidad histórica; autogobierno; reforzar la democracia y garantizar la participación.", "memo": "«Nacionalidad HISTÓRICA». Objetivo: autogobierno, reforzar la DEMOCRACIA y garantizar la PARTICIPACIÓN.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "3", "tit": "TÍTULO I La Comunitat Valenciana Se modifica por el art. 1 d", "n": 17, "cl": "Vecindad administrativa en un municipio de la CV.", "memo": "Condición política de valenciano: españoles con VECINDAD ADMINISTRATIVA en cualquier municipio de la Comunitat. Los residentes en el extranjero, si su última vecindad fue aquí y lo acreditan en el Consulado (también sus descendientes, si lo solicitan).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "23", "tit": "CAPÍTULO V La Administración de Justicia", "n": 17, "cl": "No menos de 99 diputados.", "memo": "Les Corts: «99 = mínimo». Las integran no menos de 99 diputados y diputadas, elegidos por sufragio universal, igual, libre, directo y secreto.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "22", "tit": "CAPÍTULO V La Administración de Justicia", "n": 16, "cl": "Potestad legislativa, presupuestos, control del Consell, elección del President, designación de senadores…", "memo": "Les Corts «LEGISLAN, PRESUPUESTAN, CONTROLAN y ELIGEN» (al President y a los senadores autonómicos).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "25", "tit": "CAPÍTULO VII Consejo de Cultura", "n": 16, "cl": "Reglamento por mayoría absoluta; leyes de bases y presupuestos no delegables; 2 periodos, mín. 8 meses.", "memo": "Les Corts: Reglamento por MAYORÍA ABSOLUTA; eligen Presidente, Mesa y Diputación Permanente; funcionan en Pleno y Comisiones; NO delegables en Comisión: reforma del Estatuto, leyes de bases, presupuestos e instituciones (las de mayoría cualificada).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "6", "tit": "TÍTULO I La Comunitat Valenciana Se modifica por el art. 1 d", "n": 15, "cl": "Lengua propia: valenciano; cooficial con el castellano; AVL como institución normativa (6.8).", "memo": "Lenguas: valenciano = lengua PROPIA; cooficial con el castellano; nadie puede ser discriminado por su lengua; especial protección a la recuperación del valenciano; AVL = institución normativa (6.8).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "27", "tit": "CAPÍTULO III El President de la Generalitat Se modifica por ", "n": 14, "cl": "Elegido por Les Corts de entre sus miembros y nombrado por el Rey; mayoría absoluta en 1.ª votación.", "memo": "President: elegido por Les Corts de ENTRE SUS MIEMBROS y nombrado por el Rey. Los candidatos los presentan los Grupos Parlamentarios y el Presidente de Les Corts propone uno tras consultar. El candidato expone su programa y pide la confianza.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ley": "EACV", "art": "29", "tit": "CAPÍTULO IV El Consell Se modifica por el art. 33 de la Ley ", "n": 14, "cl": "Órgano colegiado; potestad ejecutiva y reglamentaria; sede en Valencia.", "memo": "Consell: órgano colegiado de gobierno con potestad EJECUTIVA y REGLAMENTARIA; consellers nombrados por el President; sede en Valencia, pero sus servicios pueden descentralizarse por todo el territorio.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}]}, {"id": "PG5", "parte": "General", "n": 5, "tit": "Ley 5/1983 del Consell: Títulos I (President) y II (Consell)", "preg": 32, "por": "", "arts": [{"ley": "Ley 5/1983 CV", "art": "28", "tit": "Art. 28.", "n": 5, "cl": "Funciones de los consellers: asistir al Consell, proponer altos cargos, preparar anteproyectos de ley y proyectos de decreto y refrendarlos, formular el anteproyecto de presupuesto de su conselleria, potestad reglamentaria en su materia…", "memo": "«El conseller PROPONE, PREPARA y REFRENDA».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "8", "tit": "Art. 8.", "n": 5, "cl": "Cese del President: renovación de Les Corts tras elecciones, moción de censura, denegación de cuestión de confianza, dimisión, pérdida de la condición de diputado, incompatibilidad no subsanada en 10 días, incapacidad permanente declarada por Les Corts y fallecimiento.", "memo": "«ERMES-DIPIF»: Elecciones, Renuncia, Moción, cuEStión de confianza, Diputado perdido, Incompatibilidad (10 días), Permanente incapacidad, Fallecimiento.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "12", "tit": "Art. 12.", "n": 3, "cl": "El President dirige y coordina el Consell: directrices generales, crea, modifica y suprime consellerias y secretarías autonómicas, nombra y separa a vicepresidentes y consellers, convoca y preside el Consell…", "memo": "«El President CREA consellerias y NOMBRA consellers»; los altos cargos los nombra el CONSELL (art. 17).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "17", "tit": "Art. 17.", "n": 2, "cl": "Funciones ejecutivas del Consell: nombrar y separar altos cargos a propuesta del conseller, designar representantes en empresas públicas estatales, etc.", "memo": "«Altos cargos = CONSELL a propuesta del conseller».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "4", "tit": "Art. 4.", "n": 2, "cl": "El President electo comienza a ejercer sus funciones desde la publicación en el BOE de su nombramiento por el Rey.", "memo": "«Elige Les Corts, nombra el Rey, empieza al salir en el BOE».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "33", "tit": "Art. 33.", "n": 2, "cl": "Adoptan forma de Decreto del Consell las disposiciones generales del Consell y los actos singulares cuando lo exija una norma; los firma el President y los refrenda el conseller correspondiente.", "memo": "«Decreto = firma President + refrendo conseller».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "11", "tit": "Art. 11.", "n": 2, "cl": "El President, como representante ordinario del Estado, promulga en nombre del Rey las leyes de la Generalitat y ordena su publicación en el DOGV en el plazo de 15 días desde su aprobación, y en el BOE.", "memo": "«Ley valenciana: 15 días al DOGV, y luego al BOE».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "10", "tit": "Art. 10.", "n": 2, "cl": "Al President de la Generalitat, como más alto representante de la Comunitat Valenciana, le corresponden las siguientes funciones:\na) La representación legal de la Comunitat Valenciana, sin perjuicio de las facultades conferidas por las normas a otros órganos d…", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "15", "tit": "Art. 15.", "n": 2, "cl": "Vicepresidentes: los nombra y cesa el President; apoyo y asesoramiento; pueden tener departamento (entonces son también consellers) o no tenerlo (sin funciones ejecutivas propias).", "memo": "«Vice con cartera = conseller; vice sin cartera = asesor».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "29", "tit": "Art. 29.", "n": 1, "cl": "1. Los Consellers son nombrados y separados por el President de la Generalitat.\n2. Los Consellers cesan en sus funciones:\na) Por cese del President de la Generalitat, si bien continuarán en sus funciones hasta la toma de posesión del nuevo Consell.\nb) Por dimi…", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}]}, {"id": "PG6", "parte": "General", "n": 6, "tit": "Ley 5/1983 del Consell: Títulos III, IV y V (Corts, Administración, responsabilidad)", "preg": 31, "por": "", "arts": [{"ley": "Ley 5/1983 CV", "art": "67", "tit": "Art. 67.", "n": 6, "cl": "Órganos superiores del departamento: conseller y secretarios autonómicos. Nivel directivo: subsecretarios, directores generales y asimilados.", "memo": "«Superiores = Conseller + Secretario autonómico; directivos = Subsecretario + DG».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "83", "tit": "Art. 83.", "n": 3, "cl": "Responsabilidad penal y civil del President y de los miembros del Consell: ante el TSJ de la Comunitat Valenciana o, en su caso, el Tribunal Supremo.", "memo": "«TSJ-CV primero, Supremo si sale de la Comunitat».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "80", "tit": "Art. 80.", "n": 2, "cl": "Territorialmente, la organización de las Consejerías se estructura en servicios centrales, regulados en el capítulo anterior, y en servicios periféricos.\nLos servicios periféricos serán la expresión organizativa del principio de desconcentración que ha de regi…", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "70", "tit": "Art. 70.", "n": 2, "cl": "Directores generales: régimen interno de los servicios de su dirección, resolver expedientes que no sean del conseller, secretario autonómico o subsecretario; vigilar y supervisar sus dependencias.", "memo": "«El DG gestiona y resuelve lo de su dirección».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "63", "tit": "Art. 63.", "n": 2, "cl": "Delegación: en el órgano jerárquico inmediato inferior; no cabe delegar lo delegado; las competencias del Consell siempre son delegables en sus Comisiones Delegadas; no son delegables, entre otras, las atribuidas expresamente por el Estatut.", "memo": "«No se delega lo DELEGADO ni lo que da el ESTATUT».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "69", "tit": "Art. 69.", "n": 2, "cl": "Subsecretaría: bajo la dependencia directa del President y de cada conseller; inspección de los servicios y jefatura de todo el personal; servicios comunes.", "memo": "«Subsecretario = JEFE DE PERSONAL y servicios comunes».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "74", "tit": "Art. 74.", "n": 2, "cl": "Organización territorial de las consellerias: servicios centrales y periféricos; los periféricos expresan el principio de DESCONCENTRACIÓN.", "memo": "«Periféricos = DESconcentración» (no descentralización).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "59", "tit": "Art. 59.", "n": 2, "cl": "Disolución de Les Corts y convocatoria de elecciones por el President (art. 23 Estatut): el decreto fija diputados por circunscripción (total 99 o el que fije la Ley Electoral), campaña, día de votación y constitución.", "memo": "«99 diputados» en Les Corts (350 Congreso).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "68", "tit": "Art. 68.", "n": 2, "cl": "1. Bajo la dependencia del President, Vicepresidentes y Consellers, se podrán crear Secretarías Autonómicas.\n2. Los Secretarios autonómicos dirigen y coordinan los Centros Directivos que se adscriben bajo su dependencia y responden, ante el titular del que dep…", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}, {"ley": "Ley 5/1983 CV", "art": "49 bis", "tit": "Art. 49 bis.", "n": 1, "cl": "1. En la elaboración de los Reglamentos se seguirán los trámites siguientes:\na) El órgano competente formulará el proyecto de disposición, debiéndose incorporar al expediente un informe sobre la necesidad y oportunidad del proyecto, así como una memoria económ…", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1984-3460"}]}, {"id": "PG7", "parte": "General", "n": 7, "tit": "Unión Europea: TUE (disposiciones comunes) y TFUE (actos jurídicos y procedimientos)", "preg": 14, "por": "Tema nuevo en el programa: el tribunal suele ir a lo literal del art. 288 TFUE (tipos de actos) y del art. 5 TUE (principios).", "arts": [{"ley": "TUE", "art": "5", "tit": "TÍTULO I DISPOSICIONES COMUNES", "n": 0, "cl": "Delimitación de competencias: principio de ATRIBUCIÓN. Ejercicio: SUBSIDIARIEDAD y PROPORCIONALIDAD.", "memo": "«Atribuir para TENER; subsidiar y proporcionar para USAR».", "url": "https://www.boe.es/doue/2016/202/Z00001-00388.pdf"}, {"ley": "TUE", "art": "7", "tit": "TÍTULO I DISPOSICIONES COMUNES", "n": 0, "cl": "Riesgo claro de violación grave de los valores: el Consejo por 4/5, previa aprobación del PE. Violación grave y persistente: el Consejo Europeo por unanimidad. Suspensión de derechos: el Consejo por mayoría cualificada.", "memo": "«4/5 – unanimidad – cualificada»: riesgo, violación, sanción.", "url": "https://www.boe.es/doue/2016/202/Z00001-00388.pdf"}, {"ley": "TFUE", "art": "288", "tit": "SECCIÓN PRIMERA ACTOS JURÍDICOS DE LA UNIÓN", "n": 0, "cl": "Reglamento: alcance general, obligatorio en todos sus elementos y directamente aplicable. Directiva: obliga en cuanto al resultado. Decisión: obligatoria en todos sus elementos (solo para sus destinatarios, si los designa). Recomendaciones y dictámenes: no vinculantes.", "memo": "«RE-DI-DE-RE-DI»: REglamento (todo y directo), DIrectiva (resultado), DEcisión (todo, a sus destinatarios), REcomendación y DIctamen (nada).", "url": "https://www.boe.es/doue/2016/202/Z00001-00388.pdf"}, {"ley": "TFUE", "art": "294", "tit": "SECCIÓN SEGUNDA PROCEDIMIENTOS DE ADOPCIÓN DE LOS ACTOS Y OT", "n": 0, "cl": "Procedimiento legislativo ordinario: propuesta de la Comisión; 1.ª lectura del PE y del Consejo; 2.ª lectura en 3 meses (+1); comité de conciliación en 6 semanas (+2); tercera lectura en 6 semanas.", "memo": "«3 meses, 6 semanas, 6 semanas» (ampliables 1 mes y 2 semanas).", "url": "https://www.boe.es/doue/2016/202/Z00001-00388.pdf"}, {"ley": "TFUE", "art": "297", "tit": "SECCIÓN SEGUNDA PROCEDIMIENTOS DE ADOPCIÓN DE LOS ACTOS Y OT", "n": 0, "cl": "Publicación en el DOUE; entrada en vigor en la fecha fijada o, en su defecto, a los VEINTE días de su publicación.", "memo": "«20 días», igual que la vacatio del Código Civil.", "url": "https://www.boe.es/doue/2016/202/Z00001-00388.pdf"}]}, {"id": "PG8", "parte": "General", "n": 8, "tit": "Igualdad: LO 3/2007 (T. Prel. y I), Ley 9/2003 GVA, Ley 4/2023 (trans y LGTBI) y LO 1/2004 (T. Prel.)", "preg": 152, "por": "", "arts": [{"ley": "LO 3/2007", "art": "6", "tit": "Discriminación directa e indirecta.", "n": 28, "cl": "Definiciones casi literales en examen.", "memo": "DIRECTA = «te tratan peor POR ser mujer/hombre» (en situación comparable). INDIRECTA = «norma aparentemente neutra que pone en desventaja particular a un sexo», salvo que se justifique objetivamente con un fin legítimo y medios necesarios y adecuados.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "3", "tit": "El principio de igualdad de trato entre mujeres y hombres.", "n": 23, "cl": "Ausencia de discriminación directa o indirecta.", "memo": "Igualdad de trato = AUSENCIA de toda discriminación directa o indirecta por razón de sexo, especialmente por «MA-FA-CI»: MAternidad, obligaciones FAmiliares y estado CIvil.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "7", "tit": "Acoso sexual y acoso por razón de sexo.", "n": 19, "cl": "Distinguir: «de naturaleza sexual» / «en función del sexo».", "memo": "Acoso SEXUAL = comportamiento «de naturaleza sexual». Acoso POR RAZÓN DE SEXO = comportamiento «en función del sexo». Ambos: atentan contra la dignidad, entorno intimidatorio, degradante u ofensivo. Ambos son discriminatorios.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "1", "tit": "Objeto de la Ley.", "n": 19, "cl": "Iguales en dignidad, derechos y deberes.", "memo": "Objeto de la LO 3/2007: igualdad de trato y de oportunidades, en desarrollo de los arts. 9.2 y 14 CE, en las esferas «PoCiLaEcoSoCu» (política, civil, laboral, económica, social y cultural), para una sociedad más democrática, justa y solidaria. Se aplica a toda persona física o jurídica que se encuentre o actúe en territorio español.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "2", "tit": "Ámbito de aplicación.", "n": 11, "cl": "Ámbito: todas las personas físicas y jurídicas, públicas o privadas, que se encuentren o actúen en territorio español, cualquiera que sea su nacionalidad, domicilio o residencia.", "memo": "«Todo el que PISE España», sea quien sea.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "10", "tit": "Consecuencias jurídicas de las conductas discriminatorias.", "n": 9, "cl": "Nulos y sin efecto; reparaciones reales, efectivas y proporcionadas.", "memo": "Consecuencias: «NULO + REPARO + DISUADO»: el acto discriminatorio es nulo y sin efecto; reparaciones reales, efectivas y proporcionadas; sanciones eficaces y disuasorias.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "4", "tit": "Integración del principio de igualdad en la interpretación y aplicación de las normas.", "n": 8, "cl": "Integración del principio de igualdad en la interpretación y aplicación de las normas: la igualdad de trato y oportunidades es un principio informador del ordenamiento.", "memo": "«4 = la igualdad INFORMA todas las normas».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "12", "tit": "Tutela judicial efectiva.", "n": 5, "cl": "Tutela judicial: cualquier persona podrá recabar de los tribunales la tutela del derecho a la igualdad conforme al art. 53.2 CE; la legitimación para el acoso sexual y por razón de sexo corresponde solo a la persona acosada.", "memo": "«53.2, no 51.2» (trampa del examen de Benicàssim). Acoso: solo denuncia la VÍCTIMA.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 3/2007", "art": "11", "tit": "Acciones positivas.", "n": 5, "cl": "Razonables y proporcionadas.", "memo": "Acciones positivas: medidas específicas a favor de las mujeres para corregir desigualdades patentes; TEMPORALES («mientras subsistan»), RAZONABLES y PROPORCIONADAS; también pueden adoptarlas los particulares.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ley": "LO 1/2004", "art": "2", "tit": "Principios rectores.", "n": 4, "cl": "Principios rectores: sensibilización, prevención, detección, derechos de las mujeres víctimas, coordinación de recursos, tutela institucional, formación especializada, transversalidad…", "memo": "Lee los principios «SPD»: Sensibilizar, Prevenir, Detectar; y luego Derechos y Tutela.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-21760"}]}, {"id": "PG9", "parte": "General", "n": 9, "tit": "Ley 19/2013 (derecho de acceso) y LO 3/2018 de protección de datos (Títulos I a III)", "preg": 189, "por": "", "arts": [{"ley": "Ley 19/2013", "art": "24", "tit": "Reclamación ante el Consejo de Transparencia y Buen Gobierno.", "n": 25, "cl": "Reclamación potestativa ante el Consejo de Transparencia y Buen Gobierno en UN MES desde la notificación o desde el silencio; se resuelve en tres meses (silencio desestimatorio). Sustituye a los recursos administrativos.", "memo": "«Reclamación 1-3»: un mes para reclamar, tres para resolver.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887"}, {"ley": "Ley 19/2013", "art": "14", "tit": "Límites al derecho de acceso.", "n": 23, "cl": "Doce límites al acceso: seguridad nacional, defensa, relaciones exteriores, seguridad pública, ilícitos penales/administrativos/disciplinarios, igualdad de partes en procesos judiciales, funciones de vigilancia/inspección/control, intereses económicos y comerciales, política económica y monetaria, secreto profesional y propiedad intelectual/industrial, confidencialidad en la toma de decisiones, medio ambiente. Aplicación justificada y proporcionada (test del daño).", "memo": "«Los 12 apóstoles del secreto»: empiezan por las 4 de seguridad (Nacional, Defensa, Exteriores, Pública) y acaban en el medio ambiente. Siempre justificado y proporcionado.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887"}, {"ley": "LOPDGDD", "art": "7", "tit": "Consentimiento de los menores de edad.", "n": 20, "cl": "Consentimiento de menores: a partir de los 14 años pueden consentir el tratamiento de sus datos; por debajo, titular de la patria potestad o tutela.", "memo": "«14 = puedo decir SÍ a mis datos». (En el RGPD el margen es 13–16.)", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"}, {"ley": "Ley 19/2013", "art": "20", "tit": "Resolución.", "n": 17, "cl": "Resolución: plazo máximo de UN MES desde la recepción por el órgano competente, ampliable otro mes por volumen o complejidad. Silencio: DESESTIMATORIO.", "memo": "«Un mes + un mes, y si callan, NO». (En la Ley 1/2022 valenciana el silencio es estimatorio.)", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887"}, {"ley": "Ley 19/2013", "art": "17", "tit": "Solicitud de acceso a la información.", "n": 15, "cl": "Solicitud de acceso: dirigida al titular del órgano que posea la información, por cualquier medio que permita constancia de identidad, información solicitada, dirección de contacto y modalidad de acceso. No es obligatorio motivarla.", "memo": "«No hace falta decir por qué»: identidad, qué pido, dónde me contestáis y cómo lo quiero.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887"}, {"ley": "LOPDGDD", "art": "1", "tit": "Objeto de la ley.", "n": 12, "cl": "Objeto: adaptar el ordenamiento al RGPD y garantizar los derechos digitales de la ciudadanía (art. 18.4 CE).", "memo": "Doble objeto: «adaptar al RGPD + derechos digitales». El derecho fundamental viene del 18.4 CE.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"}, {"ley": "Ley 19/2013", "art": "18", "tit": "Causas de inadmisión.", "n": 11, "cl": "Causas de inadmisión: información en elaboración, auxiliar o de apoyo (notas, borradores, informes internos), que requiera reelaboración, dirigida a órgano que no la tenga sin conocerse el competente, solicitudes manifiestamente repetitivas o abusivas.", "memo": "«E-A-R-Ó-R»: Elaboración, Auxiliar, Reelaboración, Órgano desconocido, Repetitiva/abusiva.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887"}, {"ley": "LOPDGDD", "art": "5", "tit": "Deber de confidencialidad.", "n": 10, "cl": "Deber de confidencialidad de responsables, encargados y quienes intervengan; se mantiene aunque haya finalizado la relación.", "memo": "«Secreto que NO caduca»: sigue tras terminar la relación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"}, {"ley": "Ley 19/2013", "art": "15", "tit": "Protección de datos personales.", "n": 8, "cl": "Protección de datos en el acceso: datos especialmente protegidos (ideología, afiliación sindical, religión, creencias) solo con consentimiento expreso y por escrito si se hubieran hecho públicos por el afectado; los demás (salud, origen racial, vida sexual, infracciones) con consentimiento expreso o habilitación legal.", "memo": "«Ideas y fe: consentimiento POR ESCRITO»; salud y origen: consentimiento expreso o ley.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887"}, {"ley": "LOPDGDD", "art": "12", "tit": "Disposiciones generales sobre ejercicio de los derechos.", "n": 7, "cl": "Ejercicio de derechos: la prueba de haber respondido a la solicitud corresponde al responsable.", "memo": "«La CARGA de la prueba es del responsable».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"}]}, {"id": "PG10", "parte": "General", "n": 10, "tit": "Ley 31/1995 de Prevención de Riesgos Laborales: caps. I y III", "preg": 197, "por": "", "arts": [{"ley": "LPRL", "art": "4", "tit": "Definiciones.", "n": 42, "cl": "Prevención, riesgo laboral, daños, riesgo grave e inminente.", "memo": "Definiciones «PRE-RIE-DA-GRI»: PREvención (actividades en todas las fases); RIEsgo laboral (posibilidad de daño; gravedad = probabilidad + severidad); DAños (enfermedades, patologías, lesiones); riesgo Grave e Inminente (probable en un futuro inmediato con daño grave).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "15", "tit": "Principios de la acción preventiva.", "n": 24, "cl": "Evitar, evaluar, combatir en origen, adaptar, sustituir, planificar, protección colectiva.", "memo": "Principios de la acción preventiva: «EVITAR, EVALUAR, COMBATIR EN EL ORIGEN, ADAPTAR AL HOMBRE, TÉCNICA, SUSTITUIR, PLANIFICAR, COLECTIVO > INDIVIDUAL, INSTRUCCIONES». Regla de oro: primero se evita; lo que no se puede evitar, se evalúa; la protección colectiva va antes que la individual.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "14", "tit": "Derecho a la protección frente a los riesgos laborales.", "n": 23, "cl": "Protección eficaz; deber del empresario y de las AA. PP.", "memo": "Derecho a la protección eficaz = deber del empresario (y de las Administraciones con su personal). Comprende «IN-CON-PAR-FOR-PARALIZ-VIGIL»: INformación, CONsulta, PARticipación, FORmación, PARALIZación ante riesgo grave e inminente y VIGILancia de la salud. Su coste no recae nunca en los trabajadores.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "29", "tit": "Obligaciones de los trabajadores en materia de prevención de riesgos.", "n": 14, "cl": "Uso adecuado, informar, cooperar.", "memo": "Obligaciones del trabajador «U-U-NO-I-C-C»: Usar bien las máquinas, Usar los EPI, NO desactivar los dispositivos de seguridad, Informar de los riesgos, Contribuir al cumplimiento, Cooperar con el empresario. Incumplir = incumplimiento laboral (o falta disciplinaria si es funcionario).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "3", "tit": "Ambito de aplicación.", "n": 14, "cl": "Ámbito: relaciones laborales y relaciones administrativas o estatutarias del personal de las AAPP. Excluidas (con su normativa específica): policía, seguridad y resguardo aduanero, peritaje forense en catástrofes, Fuerzas Armadas, servicio del hogar familiar...", "memo": "Se aplica «a laborales y funcionarios». Fuera los de «uniforme de riesgo» (policías, militares) y el hogar familiar.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "17", "tit": "Equipos de trabajo y medios de protección.", "n": 11, "cl": "Equipos de trabajo y medios de protección: el empresario los proporciona adecuados y velará por su uso; equipos de protección individual cuando los riesgos no se puedan evitar con medidas colectivas.", "memo": "«Primero lo COLECTIVO, luego el EPI».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "19", "tit": "Formación de los trabajadores.", "n": 10, "cl": "Teórica y práctica, suficiente y adecuada, en la contratación y al cambiar de funciones o equipos; dentro de la jornada y sin coste.", "memo": "«Formación: al ENTRAR y al CAMBIAR; DENTRO de la jornada; GRATIS para el trabajador».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "16", "tit": "Plan de prevención de riesgos laborales, evaluación de los riesgos y planificación de la actividad preventiva", "n": 10, "cl": "Plan de prevención, evaluación de riesgos y planificación de la actividad preventiva: el plan se integra en el sistema de gestión de la empresa; la evaluación inicial la hace el EMPRESARIO.", "memo": "«El empresario EVALÚA, PLANIFICA y PREVIENE»: evaluar riesgos no es obligación del trabajador (pregunta trampa de Benicàssim).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "20", "tit": "Medidas de emergencia.", "n": 9, "cl": "El empresario analiza las situaciones de emergencia y adopta medidas de primeros auxilios, lucha contra incendios y evacuación, designando personal.", "memo": "Emergencias «PIE»: Primeros auxilios, Incendios, Evacuación. El personal designado debe ser suficiente, formado y con material adecuado.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}, {"ley": "LPRL", "art": "22", "tit": "Vigilancia de la salud.", "n": 9, "cl": "Voluntaria, con excepciones tasadas; consentimiento.", "memo": "Vigilancia de la salud: «Voluntaria, salvo 3 excepciones»: cuando sea imprescindible evaluar los efectos de las condiciones de trabajo, verificar si el estado del trabajador es un peligro para él o para otros, o lo disponga una ley. Datos confidenciales: el empresario solo recibe las conclusiones de aptitud.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292"}]}, {"id": "PE1", "parte": "Especial", "n": 1, "tit": "Ley 39/2015 (I): Título Preliminar, interesados, actividad de las AAPP y actos administrativos", "preg": 1381, "por": "", "arts": [{"ley": "LPAC", "art": "21", "tit": "Obligación de resolver.", "n": 83, "cl": "Obligación de dictar resolución expresa y notificarla. Plazo máximo el de la norma; no puede exceder de 6 meses salvo ley o Derecho UE; si no lo fija, 3 meses. Exentos: pacto o convenio y derechos sujetos solo a declaración responsable o comunicación.", "memo": "Obligación de resolver: «6-3». Máximo 6 meses salvo ley o Derecho UE; si la norma no fija plazo, 3 meses. Exentos: pacto o convenio y declaración responsable o comunicación. Se cuenta desde el acuerdo de iniciación (de oficio) o desde la entrada en el registro del órgano competente (a solicitud).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "30", "tit": "Cómputo de plazos.", "n": 78, "cl": "Horas: hábiles (todas salvo sábados, domingos y festivos), máximo 24 h. Días: hábiles salvo que se diga naturales; desde el día siguiente. Meses/años: de fecha a fecha. Último día inhábil: primer hábil siguiente. Hábil en un sitio e inhábil en otro: inhábil.", "memo": "Plazos: horas hábiles (máximo 24 h; si es más, se expresan en días). Días = HÁBILES, sin sábados, domingos ni festivos. Se cuentan desde el día SIGUIENTE. Meses y años, de fecha a fecha; si no hay día equivalente, el último del mes. Si el último día es inhábil, se prorroga al primer hábil siguiente. Si un día es hábil donde reside el interesado e inhábil en la sede del órgano (o al revés), es INHÁBIL en todo caso.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "24", "tit": "Silencio administrativo en procedimientos iniciados a solicitud del interesado.", "n": 73, "cl": "Regla: estimatorio. Desestimatorio: derecho de petición, transferencia de facultades de dominio o servicio público, medio ambiente, responsabilidad patrimonial, impugnación de actos y revisión de oficio. Estimatorio en alzada contra silencio. El estimatorio es acto finalizador; el desestimatorio solo permite recurrir.", "memo": "Silencio en procedimientos a solicitud: ESTIMATORIO por regla. Desestimatorio en «PeDoMaReReRe»: PEtición, DOminio y servicio público, Medio Ambiente, REsponsabilidad patrimonial, REcursos (impugnación) y REvisión de oficio. Excepción doble: en el recurso de alzada contra un silencio previo, el silencio es estimatorio.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "47", "tit": "Nulidad de pleno derecho.", "n": 66, "cl": "Lesionen derechos susceptibles de amparo; órgano manifiestamente incompetente por materia o territorio; contenido imposible; constitutivos de infracción penal; prescindiendo total y absolutamente del procedimiento o de las normas de órganos colegiados; facultades sin requisitos esenciales; otros por ley. Disposiciones nulas (47.2).", "memo": "Nulidad = «DOCE PEO»: Derechos de amparo · Órgano manifiestamente incompetente por MATERIA o TERRITORIO (¡jerarquía NO, eso es anulable!) · Contenido imposible · Delito · Prescindir TOTAL y absolutamente del procedimiento · Facultades sin requisitos Esenciales · Otros por Ley. Las disposiciones (47.2) también son nulas si vulneran la CE, leyes o normas superiores, regulan materias reservadas a ley o establecen retroactividad sancionadora desfavorable.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "14", "tit": "Derecho y obligación de relacionarse electrónicamente con las Administraciones Públicas.", "n": 66, "cl": "Personas físicas eligen (y pueden cambiar). Obligados: personas jurídicas, entidades sin personalidad, profesionales colegiados en su actividad, representantes de obligados y empleados públicos por razón de su condición.", "memo": "Obligados (14.2) «PEPRE-RE-EM»: Personas jurídicas, Entidades sin personalidad, PRofesionales COLEGIADOS (notarios y registradores incluidos), REpresentantes de un obligado, EMpleados públicos (por su condición). Las personas físicas ELIGEN y pueden cambiar en cualquier momento.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "39", "tit": "Efectos.", "n": 64, "cl": "Válidos y eficaces desde la fecha en que se dicten salvo otra cosa. Eficacia demorada (notificación, publicación, aprobación superior). Retroactividad excepcional: sustitución de actos anulados y efectos favorables sin lesionar a terceros.", "memo": "Efectos: desde que se DICTAN (salvo que se disponga otra cosa). Eficacia demorada por notificación, publicación o aprobación superior. Retroactividad EXCEPCIONAL: en sustitución de actos ANULADOS o con efectos FAVORABLES, si los hechos ya existían y no se lesiona a terceros.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "41", "tit": "Condiciones generales para la práctica de las notificaciones.", "n": 62, "cl": "Preferentemente electrónicas. En papel: comparecencia espontánea en oficina de asistencia o entrega directa por empleado público. Medios de pago nunca electrónicos. Rechazo: se tiene por efectuado el trámite. Varios cauces: vale la primera.", "memo": "Notificaciones: preferentemente electrónicas. En papel solo con comparecencia espontánea en la oficina de asistencia o con entrega directa por un empleado público. Medios de pago (cheques) NUNCA por vía electrónica. Rechazo = se tiene por efectuada. Si se notifica por varios cauces vale la PRIMERA.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "35", "tit": "Motivación.", "n": 61, "cl": "Con sucinta referencia de hechos y fundamentos: actos que limiten derechos; resuelvan revisión de oficio, recursos, reclamaciones y arbitraje; se separen del criterio seguido o del dictamen; suspensión y medidas provisionales; urgencia, ampliación y actuaciones complementarias; rechazo de pruebas; terminación por imposibilidad y desistimiento de oficio; propuestas sancionadoras y de responsabilidad; discrecionales. Selectivos y concurrencia: según las bases.", "memo": "Motivación: «LiReSeSuUrPruTerPro…» → Limiten derechos · Resuelvan revisión de oficio, recursos y arbitraje · Se Separen del criterio precedente · Suspensión y medidas provisionales · Urgencia, ampliación y actuaciones complementarias · Rechacen Pruebas · Terminación por imposibilidad y desistimiento de la Administración · Propuestas en procedimientos sancionadores y de responsabilidad · potestades discrecionales.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "40", "tit": "Notificación.", "n": 61, "cl": "Se notifican las resoluciones y actos que afecten a derechos e intereses, en 10 días desde que se dictan, con texto íntegro, si pone fin a la vía administrativa, recursos, órgano y plazo. Notificación defectuosa: efectos desde que el interesado se da por enterado. Basta el intento con texto íntegro para cumplir el plazo máximo.", "memo": "Notificación «10 días»: se cursa dentro de los 10 días desde que se dicta el acto. Contiene el texto íntegro, si pone fin a la vía administrativa, los recursos, el órgano y el plazo. Notificación defectuosa = efectos desde que el interesado se da por enterado. Para cumplir el plazo de resolver basta el INTENTO de notificación debidamente acreditado.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "43", "tit": "Práctica de las notificaciones a través de medios electrónicos.", "n": 59, "cl": "Por comparecencia en la sede o en la dirección electrónica habilitada única. Practicada al acceder a su contenido. Rechazada a los 10 días NATURALES sin acceder. El aviso no es requisito de validez.", "memo": "Notificación electrónica: se practica por comparecencia en la sede o en la DEHú. Se entiende practicada al ACCEDER. Rechazada a los 10 días NATURALES sin acceso. El aviso al correo es informativo: su falta NO invalida la notificación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}]}, {"id": "PE2", "parte": "Especial", "n": 2, "tit": "Ley 39/2015 (II): procedimiento administrativo común y recursos administrativos", "preg": 1058, "por": "", "arts": [{"ley": "LPAC", "art": "68", "tit": "Subsanación y mejora de la solicitud.", "n": 54, "cl": "10 días para subsanar; si no, desistido previa resolución. Ampliable hasta 5 días más (no en selectivos ni concurrencia competitiva). Presentación presencial de obligados: subsanar por vía electrónica.", "memo": "Subsanación: «10 + 5» días (los 5 de ampliación NO en selectivos ni concurrencia competitiva). Si no se subsana = DESISTIDO, previa resolución. Si un obligado presenta en papel: se le requiere subsanar electrónicamente y la fecha válida es la de la subsanación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "112", "tit": "Objeto y clases.", "n": 51, "cl": "Contra resoluciones y actos de trámite cualificados (deciden el fondo, imposibilitan continuar, producen indefensión o perjuicio irreparable): alzada y reposición potestativo. Fundados en nulidad o anulabilidad. Contra disposiciones generales no cabe recurso administrativo. Procedimientos sustitutivos por ley.", "memo": "Recursos: alzada o reposición contra resoluciones y actos de trámite cualificados («DIIP»: Deciden el fondo, Imposibilitan continuar, Indefensión, Perjuicio irreparable). Contra disposiciones generales NO cabe recurso administrativo.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "53", "tit": "Derechos del interesado en el procedimiento administrativo.", "n": 47, "cl": "Conocer el estado de tramitación, sentido del silencio, órgano y actos; identificar autoridades; no presentar documentos no exigidos o ya aportados; alegar y aportar documentos en cualquier momento anterior a la audiencia; obtener información; asistencia de asesor; cumplir obligaciones de pago por medios electrónicos. Sancionadores: notificación de hechos e infracciones y presunción de no existencia de responsabilidad.", "memo": "Interesado «CO-ID-NO-AL-AS-PA»: COnocer el estado · IDentificar autoridades · NO aportar lo ya entregado · ALegar antes de la audiencia · ASesor · PAgar electrónicamente. En sancionadores, además: saber de qué le acusan y PRESUNCIÓN de inocencia («no existencia de responsabilidad»).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "125", "tit": "Objeto y plazos.", "n": 44, "cl": "Contra actos firmes, ante el mismo órgano: error de hecho que resulte de documentos del expediente (4 años desde la notificación); documentos de valor esencial; documentos o testimonios declarados falsos por sentencia firme; prevaricación, cohecho, violencia u otra conducta punible por sentencia firme (3 meses).", "memo": "Recurso extraordinario de revisión «E-D-F-P»: Error de hecho (4 años), Documentos esenciales nuevos, Falsedad declarada en sentencia, Prevaricación o cohecho declarados en sentencia (en estos tres, 3 meses desde el conocimiento o la firmeza). Solo contra actos FIRMES y ante el mismo órgano.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "122", "tit": "Plazos.", "n": 39, "cl": "Acto expreso: 1 mes. Si no es expreso: en cualquier momento desde el día siguiente al silencio. Resolución y notificación: 3 meses; silencio desestimatorio (salvo 24.1). Contra su resolución no cabe otro recurso administrativo salvo el extraordinario de revisión.", "memo": "Alzada «1-3»: 1 MES para interponer (sin plazo si no hay acto expreso), 3 MESES para resolver. Tras la alzada, solo el EXTRAORDINARIO de revisión.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "124", "tit": "Plazos.", "n": 37, "cl": "Acto expreso: 1 mes; si no es expreso, en cualquier momento desde el día siguiente al silencio. Resolver y notificar: 1 mes. No cabe nuevo recurso de reposición contra su resolución.", "memo": "Reposición «1-1»: 1 MES para interponer, 1 MES para resolver. Nada de reposición sobre reposición.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "95", "tit": "Requisitos y efectos.", "n": 35, "cl": "A solicitud, paralizado por causa del interesado: aviso y a los 3 meses caducidad y archivo. No caduca si es trámite no indispensable. No produce por sí sola la prescripción, pero los procedimientos caducados no la interrumpen. Se pueden conservar actos en el nuevo procedimiento.", "memo": "Caducidad por culpa del interesado: «AVISO + 3 MESES» → archivo. La caducidad no extingue la acción, pero el procedimiento caducado NO interrumpe la prescripción. No cabe si se trata de un trámite NO indispensable.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "96", "tit": "Tramitación simplificada del procedimiento administrativo común.", "n": 34, "cl": "De oficio o a solicitud, por interés público o falta de complejidad. Si un interesado se opone expresamente: ordinaria. Resolución en 30 días. Trámites limitados. Sancionador: infracción leve.", "memo": "Tramitación simplificada: se resuelve en 30 DÍAS. Oposición expresa de un interesado = ordinaria. Solicitud desestimable en 5 días sin recurso. En sanciones, cuando la infracción es LEVE.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "80", "tit": "Emisión de informes.", "n": 32, "cl": "Facultativos y no vinculantes salvo disposición. Electrónicos. Plazo de 10 días. Si no se emite: se pueden proseguir las actuaciones salvo informe preceptivo, en cuyo caso se puede suspender (22.1.d).", "memo": "Informes «F-NV-10»: Facultativos, No Vinculantes, 10 días. Si no llega un informe PRECEPTIVO, se puede suspender el plazo de resolver (máximo 3 meses, art. 22).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ley": "LPAC", "art": "82", "tit": "Trámite de audiencia.", "n": 31, "cl": "Instruido el procedimiento e inmediatamente antes de la propuesta de resolución; plazo no inferior a 10 días ni superior a 15. Se puede prescindir si no figuran ni se tienen en cuenta otros hechos, alegaciones o pruebas que las del interesado.", "memo": "Audiencia «10-15»: entre 10 y 15 días, inmediatamente ANTES de la propuesta de resolución y antes del informe jurídico o del dictamen. Se puede prescindir si solo constan los hechos y alegaciones del propio interesado.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}]}, {"id": "PE3", "parte": "Especial", "n": 3, "tit": "Ley 40/2015: disposiciones generales, órganos (salvo arts. 19-22) y relaciones interadministrativas", "preg": 238, "por": "", "arts": [{"ley": "LRJSP", "art": "3", "tit": "Principios generales.", "n": 40, "cl": "Objetividad; eficacia, jerarquía, descentralización, desconcentración y coordinación; servicio efectivo, simplicidad, participación, racionalización, buena fe, confianza legítima, lealtad institucional, responsabilidad, planificación, eficacia, economía, eficiencia, cooperación. Relación electrónica entre Administraciones. Personalidad jurídica única.", "memo": "Art. 103 CE + 3.1 LRJSP «E-JE-DES-DES-CO»: Eficacia, JErarquía, DEScentralización, DESconcentración, COordinación. Las Administraciones se relacionan ENTRE SÍ siempre por medios electrónicos. Cada Administración: personalidad jurídica ÚNICA.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "8", "tit": "Competencia.", "n": 25, "cl": "Irrenunciable; la ejercen los órganos que la tienen atribuida como propia salvo delegación o avocación. Delegación, encomienda, delegación de firma y suplencia no alteran la titularidad. Desconcentración. Si no se especifica el órgano: el inferior competente por materia y territorio; si hay varios, el superior jerárquico común.", "memo": "Competencia IRRENUNCIABLE. «DEL-EN-FIR-SU» (delegación, encomienda, firma y suplencia) no cambian el TITULAR. La DESCONCENTRACIÓN sí traslada la titularidad. Norma que no dice el órgano: el INFERIOR competente por materia y territorio.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "23", "tit": "Abstención.", "n": 23, "cl": "Interés personal; parentesco de consanguinidad hasta el 4.º grado o afinidad hasta el 2.º, matrimonio o análoga; amistad íntima o enemistad manifiesta; haber sido perito o testigo; relación de servicio o servicios profesionales en los últimos 2 años. Se comunica al superior inmediato. No implica necesariamente la invalidez.", "memo": "Abstención «IN-PA-AM-PE-SE»: INterés personal · PArentesco (consanguinidad 4.º, afinidad 2.º) · AMistad íntima o enemistad manifiesta · PErito o testigo · SErvicio o servicios profesionales en los últimos 2 AÑOS. Actuar con causa de abstención NO invalida necesariamente el acto, pero genera responsabilidad.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "17", "tit": "Convocatorias y sesiones.", "n": 20, "cl": "Presencial o a distancia. Quórum: Presidente y Secretario (o suplentes) y la mitad al menos de los miembros. Sin convocatoria si están todos y lo deciden. Asuntos fuera del orden del día: todos presentes y urgencia por mayoría. Acuerdos por mayoría de votos. Votar en contra o abstenerse exime de responsabilidad. Certificaciones a quien acredite interés legítimo.", "memo": "Colegiado «P + S + MITAD»: Presidente, Secretario y la mitad de los miembros. Fuera del orden del día: TODOS presentes + urgencia por MAYORÍA. Acuerdos por mayoría. Quien vota en contra o se abstiene queda EXENTO de responsabilidad.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "9", "tit": "Delegación de competencias.", "n": 19, "cl": "En órganos de la misma Administración aunque no sean jerárquicamente dependientes, u organismos vinculados. No delegables: relaciones con Jefatura del Estado, Presidencia del Gobierno, Cortes, Presidencias y Asambleas autonómicas; disposiciones de carácter general; resolución de recursos contra sus propios actos; las excluidas por ley. Publicación; se consideran dictadas por el delegante; no se delega lo delegado salvo ley; revocable en cualquier momento; quórum especial.", "memo": "NO delegables «JE-DI-RE-LEY»: relaciones con JEfatura del Estado y altas instituciones · DIsposiciones generales · REcursos contra los propios actos · lo que excluya una LEY. Publicar en boletín. Lo resuelto se considera dictado por el DELEGANTE. Prohibido delegar lo delegado (salvo ley). Revocable en cualquier momento. Tras un dictamen preceptivo ya emitido, no se puede delegar la resolución.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "24", "tit": "Recusación.", "n": 13, "cl": "En cualquier momento de la tramitación, por escrito con la causa. Al día siguiente el recusado dice si concurre; si la niega, el superior resuelve en 3 días. Sin recurso (se alega al recurrir la resolución final).", "memo": "Recusación «1-3-NR»: el recusado contesta al DÍA siguiente; si lo niega, el superior resuelve en 3 DÍAS; No Recurrible directamente. Suspende el plazo para resolver (22.2) y es la única cuestión incidental que suspende la tramitación (74 LPAC).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "5", "tit": "Órganos administrativos.", "n": 12, "cl": "Unidades con funciones con efectos jurídicos frente a terceros o actuación preceptiva. Creación: forma de integración y dependencia jerárquica, funciones y competencias, créditos. No duplicidades.", "memo": "Crear un órgano «IN-FU-CRE»: INtegración y dependencia jerárquica · FUnciones y competencias · CRÉditos. Prohibido duplicar órganos sin suprimir o restringir el existente.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "2", "tit": "Ámbito Subjetivo.", "n": 11, "cl": "Sector público: AGE, CCAA, Entidades Locales y sector público institucional (organismos y entidades de derecho público, entidades de derecho privado vinculadas, Universidades públicas).", "memo": "Son Administraciones Públicas: AGE, CCAA, EELL y organismos/entidades de DERECHO PÚBLICO. Las entidades de derecho privado y las Universidades están en el sector público institucional, pero NO son Administración Pública.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "6", "tit": "Instrucciones y órdenes de servicio.", "n": 10, "cl": "Dirigen la actividad de los órganos dependientes; publicación cuando proceda. Su incumplimiento no afecta por sí solo a la validez de los actos, sin perjuicio de responsabilidad disciplinaria.", "memo": "Incumplir una instrucción: el acto sigue siendo VÁLIDO, pero el funcionario puede tener responsabilidad DISCIPLINARIA.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}, {"ley": "LRJSP", "art": "10", "tit": "Avocación.", "n": 8, "cl": "El órgano superior asume un asunto de un dependiente (ordinario o por delegación) por razones técnicas, económicas, sociales, jurídicas o territoriales. Delegación en no dependiente: solo avoca el delegante. Acuerdo motivado notificado antes o a la vez que la resolución. No recurrible, impugnable con la resolución.", "memo": "Avocación = «el de ARRIBA coge el asunto del de ABAJO». Acuerdo MOTIVADO, notificado antes o con la resolución final. Sin recurso directo (se impugna con la resolución).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566"}]}, {"id": "PE4", "parte": "Especial", "n": 4, "tit": "Ley 9/2017 de Contratos: objeto, tipos contractuales, contratos administrativos y privados, expediente", "preg": 322, "por": "", "arts": [{"ley": "LCSP", "art": "118", "tit": "Expediente de contratación en contratos menores.", "n": 50, "cl": "Menores: obras < 40.000 €; suministros y servicios < 15.000 € (sin IVA). Expediente: informe motivado de necesidad (y de que no se fracciona), aprobación del gasto e incorporación de la factura (en obras, presupuesto y proyecto si lo exige).", "memo": "«40 la obra, 15 lo demás»: piensa «40 ladrillos, 15 cajas». El expediente menor es «NAF»: Necesidad, Aprobación del gasto, Factura. (Duración ≤ 1 año sin prórroga está en el art. 29.8).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "16", "tit": "Contrato de suministro.", "n": 41, "cl": "1. Son contratos de suministro los que tienen por objeto la adquisición, el arrendamiento financiero, o el arr", "memo": "Suministro = «ACAA»: Adquisición, Arrendamiento financiero o Arrendamiento (con o sin opción de compra) de bienes MUEBLES. No lo son propiedades incorporales ni valores negociables. Siempre suministro: entregas sucesivas por precio unitario, equipos informáticos y software (salvo a medida = servicios), fabricación según características del contratante y suministro de energía.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "116", "tit": "Expediente de contratación: iniciación y contenido.", "n": 21, "cl": "1. La celebración de contratos por parte de las Administraciones Públicas requerirá la previa tramitación del ", "memo": "Expediente de contratación: lo inicia el órgano de contratación motivando la necesidad. Incluye los pliegos, el certificado de crédito, la fiscalización y la justificación del procedimiento, la clasificación, la solvencia, los criterios y el valor estimado. En servicios, informe de insuficiencia de medios.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "1", "tit": "Objeto y finalidad.", "n": 21, "cl": "Objeto: garantizar libertad de acceso a las licitaciones, publicidad y transparencia, no discriminación e igualdad de trato, y eficiente utilización de fondos (estabilidad, control del gasto, salvaguarda de la libre competencia, oferta económicamente más ventajosa). Criterios sociales y medioambientales transversales.", "memo": "«LiPuTra-NoDi-E»: Libertad de acceso, Publicidad y Transparencia, No Discriminación e igualdad, Eficiencia. Social y verde «de forma transversal».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "25", "tit": "Contratos administrativos.", "n": 19, "cl": "Contratos administrativos: obra, concesión de obra, concesión de servicios, suministro y servicios (con excepciones privadas), y los administrativos especiales vinculados al giro o tráfico de la Administración.", "memo": "«Los 5 típicos + los especiales»: obra, concesión de obra, concesión de servicios, suministro, servicios.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "3", "tit": "Ámbito subjetivo.", "n": 15, "cl": "Ámbito subjetivo: sector público (AGE, CCAA, EELL, organismos, universidades...), Administraciones Públicas (subconjunto) y poderes adjudicadores (subconjunto). Tres círculos concéntricos.", "memo": "«Tres muñecas rusas»: Sector público ⊃ poderes adjudicadores ⊃ Administraciones Públicas.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "26", "tit": "Contratos privados.", "n": 15, "cl": "Contratos privados: los de las AP cuyo objeto no sea administrativo (p. ej. seguros, banca, espectáculos, suscripciones), los de entidades no AP... Se rigen en preparación y adjudicación por la LCSP; en efectos y extinción por el derecho privado.", "memo": "Privado = «nace público, vive privado»: se prepara y adjudica con la LCSP, pero sus efectos y extinción van por el Código Civil.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "17", "tit": "Contrato de servicios.", "n": 15, "cl": "Contrato de servicios: prestaciones de hacer (actividad o resultado distinto de obra o suministro). No pueden ser objeto los que impliquen ejercicio de autoridad inherente a los poderes públicos.", "memo": "Servicio = «HACER algo» (no construir ni entregar cosas). Nunca la autoridad pública.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "13", "tit": "Contrato de obras.", "n": 14, "cl": "Contrato de obras: ejecución de una obra (aislada o con redacción de proyecto) o de trabajos del Anexo I; la «obra» es el resultado de trabajos de construcción o ingeniería civil destinado a cumplir por sí mismo una función económica o técnica sobre un bien inmueble.", "memo": "«Obra = INMUEBLE que funciona solo»: si al acabar el ladrillo sirve por sí mismo, es obra.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ley": "LCSP", "art": "22", "tit": "Contratos de servicios sujetos a una regulación armonizada: umbral.", "n": 13, "cl": "Contratos SARA de servicios y suministros: AGE y sus OOAA 140.000 €; resto de entidades del sector público 216.000 €; servicios sociales y del Anexo IV 750.000 € (umbrales de la Directiva, revisables cada 2 años).", "memo": "«140 el Estado, 216 los demás, 750 lo social». Obras y concesiones: 5.404.000 € (art. 20). Cifras del texto vigente del BOE.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}]}, {"id": "PE5", "parte": "Especial", "n": 5, "tit": "Ley 4/2021 de la Función Pública Valenciana (Títulos I, III, V, VI y X caps. I-II)", "preg": 153, "por": "", "arts": [{"ley": "Ley 4/2021 CV", "art": "168", "tit": "Principios de la potestad disciplinaria.", "n": 11, "cl": "Principios de la potestad disciplinaria: legalidad y tipicidad, irretroactividad de lo desfavorable y retroactividad de lo favorable, proporcionalidad, culpabilidad y presunción de inocencia.", "memo": "«LIP-CP»: Legalidad, Irretroactividad, Proporcionalidad, Culpabilidad, Presunción de inocencia.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "18", "tit": "Personal funcionario interino.", "n": 10, "cl": "Funcionario interino: razones expresamente justificadas de necesidad y urgencia; plazas vacantes (máx. 3 años), sustitución, programas temporales (máx. 3 años, ampliable 12 meses) y exceso o acumulación de tareas (máx. 9 meses en 18).", "memo": "«Interino 3-3-9»: vacante 3 años, programa 3 (+12 meses), acumul
