ación 9 meses en 18.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "174", "tit": "Relación entre las faltas y las sanciones.", "n": 7, "cl": "Sanciones: faltas muy graves (separación del servicio o revocación del interino, suspensión firme de funciones, traslado forzoso…), graves y leves (apercibimiento).", "memo": "«Leve = APERCIBIMIENTO; muy grave = SEPARACIÓN».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "16", "tit": "Concepto y clases de personal empleado público.", "n": 7, "cl": "Clases de personal empleado público: funcionario de carrera, funcionario interino, personal laboral (fijo, indefinido o temporal) y personal eventual.", "memo": "«C-I-L-E»: Carrera, Interino, Laboral, Eventual.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "2", "tit": "Principios informadores.", "n": 7, "cl": "Principios de la función pública valenciana: servicio a la ciudadanía, sometimiento a la ley y al derecho, economía, eficacia y eficiencia, igualdad de mujeres y hombres y no discriminación, mérito y capacidad, objetividad, transparencia…", "memo": "Empieza siempre por «Servicio a la CIUDADANÍA».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "103", "tit": "Régimen de incompatibilidades.", "n": 6, "cl": "1. El personal comprendido en el ámbito de aplicación de esta ley no podrá compatibilizar sus actividades con el desempeño, por sí o mediante sustitución, de cualquier cargo, profesión o actividad, públicos o privados, por cuenta propia o ajena, retribuidos o …", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "69", "tit": "Causas de pérdida de la condición de personal funcionario de carrera.", "n": 6, "cl": "Pérdida de la condición de funcionario de carrera: renuncia, pérdida de la nacionalidad, jubilación total, sanción firme de separación del servicio, inhabilitación firme, fallecimiento.", "memo": "«RENJUSIF»: Renuncia, Nacionalidad, Jubilación, Separación, Inhabilitación, Fallecimiento.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "99", "tit": "Obligaciones.", "n": 6, "cl": "En el ejercicio de las funciones que tenga asignadas, el personal empleado público deberá observar las siguientes obligaciones:\n1. Tratar con atención y respeto a la ciudadanía, a todo el personal empleado público y, en general, a todas aquellas personas con l…", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "65", "tit": "Sistemas selectivos.", "n": 5, "cl": "1. Los sistemas selectivos aplicables a la selección de personal funcionario de carrera y laboral fijo serán los de oposición, concurso o concurso-oposición.\n2. Tendrá carácter ordinario y preferente en la selección de personal empleado público el sistema de o…", "memo": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ley": "Ley 4/2021 CV", "art": "77", "tit": "Derechos individuales ejercidos colectivamente.", "n": 5, "cl": "Derechos individuales ejercidos colectivamente: libertad sindical, negociación colectiva, huelga (con servicios esenciales), planteamiento de conflictos colectivos y reunión.", "memo": "«SINDI-NEGO-HUELGA»: Sindicato, Negociación, Huelga, Conflicto, Reunión.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}]}, {"id": "PE6", "parte": "Especial", "n": 6, "tit": "Decreto 42/2019: condiciones de trabajo del personal funcionario de la Generalitat", "preg": 12, "por": "Decreto propio de la Generalitat: caen cifras de permisos, vacaciones y jornada.", "arts": [{"ley": "Decreto 42/2019", "art": "4", "tit": "Jornada de trabajo", "n": 0, "cl": "Jornada general: 35 horas semanales. Especial dedicación: 37 horas y 30 minutos.", "memo": "«35 normal, 37,5 especial».", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}, {"ley": "Decreto 42/2019", "art": "16", "tit": "Pausa diaria", "n": 0, "cl": "Pausa de 30 minutos, computable como trabajo efectivo, preferentemente entre las 10 y las 12 horas.", "memo": "«30 minutos de 10 a 12, y cuentan como trabajo».", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}, {"ley": "Decreto 42/2019", "art": "21", "tit": "Permiso por matrimonio o unión de hecho", "n": 0, "cl": "Matrimonio o unión de hecho: 15 días naturales y consecutivos, dentro de los 6 meses siguientes.", "memo": "«15 naturales en 6 meses».", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}, {"ley": "Decreto 42/2019", "art": "34", "tit": "Permiso por fallecimiento", "n": 0, "cl": "Fallecimiento: 1.er grado, 3 días hábiles (misma localidad) o 5 (distinta); 2.º grado, 2 o 4 días hábiles.", "memo": "«3-5 y 2-4»: primero, más; segundo, uno menos.", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}, {"ley": "Decreto 42/2019", "art": "37", "tit": "Permiso por traslado de domicilio habitual", "n": 0, "cl": "Traslado de domicilio: 1 día sin cambio de localidad; 2 días con cambio.", "memo": "«Mudanza: 1 en el pueblo, 2 fuera».", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}, {"ley": "Decreto 42/2019", "art": "40", "tit": "Permiso por asuntos propios", "n": 0, "cl": "Asuntos propios: hasta 6 días por año natural, disfrutables hasta el 15 de febrero del año siguiente; denegación motivada.", "memo": "«6 moscosos hasta el 15-F».", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}, {"ley": "Decreto 42/2019", "art": "50", "tit": "Duración de las vacaciones", "n": 0, "cl": "Vacaciones: 22 días hábiles; 23 a los 15 años de servicio, 24 a los 20, 25 a los 25 y 26 a los 30.", "memo": "«22 base, y +1 cada 5 años desde los 15».", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}, {"ley": "Decreto 42/2019", "art": "51", "tit": "Régimen de disfrute de las vacaciones", "n": 0, "cl": "Vacaciones disfrutables hasta el 31 de enero del año siguiente; la mitad, preferentemente de junio a septiembre; periodos mínimos de 7 días naturales, pero 7 días pueden ir sueltos.", "memo": "«Vacaciones hasta el 31-E; 7 días seguidos o 7 sueltos».", "url": "https://dogv.gva.es/datos/2019/03/31/pdf/2019_3204.pdf"}]}, {"id": "PE7", "parte": "Especial", "n": 7, "tit": "Presupuesto de la Generalitat (I): Ley 1/2015, Título II caps. I, III y IV", "preg": 10, "por": "Presupuesto de la Generalitat: cae la tipología de modificaciones de crédito y la prórroga.", "arts": [{"ley": "Ley 1/2015 GVA", "art": "35", "tit": "Prórroga de los Presupuestos de la Generalitat.", "n": 0, "cl": "Prórroga: si Les Corts no aprueban el presupuesto antes del 1 de enero, se prorroga el del año anterior hasta la publicación del nuevo en el DOGV.", "memo": "«Sin presupuesto el 1-E, se PRORROGA el viejo».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-1952"}, {"ley": "Ley 1/2015 GVA", "art": "44", "tit": "Modificación de los créditos iniciales.", "n": 0, "cl": "Modificaciones de crédito: incorporaciones, créditos extraordinarios y suplementos, ampliaciones, transferencias, generaciones y anulaciones.", "memo": "«I-E-S-A-T-G»: Incorporar, Extraordinario, Suplemento, Ampliar, Transferir, Generar.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-1952"}, {"ley": "Ley 1/2015 GVA", "art": "46", "tit": "Créditos extraordinarios y suplementos de crédito.", "n": 0, "cl": "Crédito extraordinario = no existe crédito; suplemento = el crédito es insuficiente.", "memo": "«EXTRA = no hay nada; SUPLE = hay poco».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-1952"}]}, {"id": "PE8", "parte": "Especial", "n": 8, "tit": "Presupuesto de la Generalitat (II): gestión presupuestaria (Ley 1/2015) y Ley de Presupuestos 2026", "preg": 8, "por": "Fases del gasto (ADOP), pagos a justificar y anticipos de caja fija: preguntas de definición.", "arts": [{"ley": "Ley 1/2015 GVA", "art": "58", "tit": "Fases de ejecución del presupuesto de gastos.", "n": 0, "cl": "Fases del gasto: aprobación (A), compromiso o disposición (D), reconocimiento de la obligación (O) y propuesta de pago (P).", "memo": "«ADOP»: Aprueba, Dispone (vincula a terceros), Obliga, Paga.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-1952"}, {"ley": "Ley 1/2015 GVA", "art": "63", "tit": "Anticipos de caja fija.", "n": 0, "cl": "Anticipos de caja fija: provisiones extrapresupuestarias y PERMANENTES para gastos periódicos o repetitivos.", "memo": "«Caja FIJA = gastos REPETIDOS».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-1952"}, {"ley": "Ley 1/2015 GVA", "art": "64", "tit": "Pagos a justificar.", "n": 0, "cl": "Pagos a justificar: excepcionales; justificación en 3 meses (6 en expropiaciones); requerimiento de 10 días; aprobación o reparo de la cuenta en 2 meses.", "memo": "«3-6-10-2»: 3 meses, 6 si expropias, 10 días de aviso, 2 meses para revisar.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-1952"}]}, {"id": "PE9", "parte": "Especial", "n": 9, "tit": "Decreto 54/2025: vías de acceso electrónico, Registro electrónico y formas de comunicación", "preg": 11, "por": "Decreto 54/2025, muy reciente: direcciones (gva.es / sede.gva.es), registro único 24 h, TEUA y valija.", "arts": [{"ley": "Decreto 54/2025", "art": "9", "tit": "El Portal corporativo de la Generalitat", "n": 0, "cl": "Punto de Acceso General Electrónico de la Generalitat: el Portal corporativo www.gva.es.", "memo": "«gva.es = PUERTA; sede.gva.es = VENTANILLA (Sede PROP)».", "url": "https://dogv.gva.es/datos/2025/04/22/pdf/2025_11622_es.pdf"}, {"ley": "Decreto 54/2025", "art": "15", "tit": "Sede PROP de la Generalitat", "n": 0, "cl": "Sede PROP de la Generalitat: https://sede.gva.es (trámites con identificación o firma).", "memo": "«PROP = sede».", "url": "https://dogv.gva.es/datos/2025/04/22/pdf/2025_11622_es.pdf"}, {"ley": "Decreto 54/2025", "art": "18", "tit": "Tablón Electr const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let known = {}; try { known = JSON.parse(localStorage.getItem("gva-resumen-se") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("gva-resumen-se", JSON.stringify(known)); } catch (e) {} };
let tema = "ALL";
const key = (t, a) => `${t}|${a.ley}|${a.art}`;
function days(){ const d = Math.ceil((new Date("2026-11-28T09:00:00+01:00") - new Date())/86400000); return d > 0 ? `faltan <b>${d}</b> días · ` : ""; }

function chips(){
  $("#chips").innerHTML = [`<button class="chip" data-t="ALL" aria-pressed="${tema==="ALL"}">Todos</button>`]
    .concat(DATA.temas.map(t => { const done = t.arts.length && t.arts.every(a => known[key(t.id,a)]);
      return `<button class="chip${done?" done":""}" data-t="${t.id}" aria-pressed="${tema===t.id}" title="${esc(t.tit)}">${t.id}</button>`; })).join("");
}
function render(){
  const q = $("#q").value.trim().toLowerCase(), pend = $("#soloPend").getAttribute("aria-pressed")==="true";
  let total = 0, sabe = 0, html = "";
  for (const t of DATA.temas){
    if (tema !== "ALL" && t.id !== tema) continue;
    const arts = t.arts.filter(a => {
      total++; if (known[key(t.id,a)]) sabe++;
      if (pend && known[key(t.id,a)]) return false;
      return !q || `${a.ley} ${a.art} ${a.tit} ${a.cl} ${a.memo} ${t.tit}`.toLowerCase().includes(q);
    });
    if (!arts.length) continue;
    html += `<section class="tema"><h2><span class="id">${t.id}</span>${esc(t.tit)}</h2>${t.por ? `<p class="por">${esc(t.por)}</p>` : ""}` +
      arts.map(a => { const k = key(t.id,a), on = !!known[k];
        const b = a.n ? `<span class="badge${a.n>=15?" hot":""}">${a.n} preg.</span>` : `<span class="badge new">nuevo</span>`;
        return `<article class="card${on?" known":""}">
          <div class="head"><span class="art">Art. ${esc(a.art)} ${esc(a.ley)}</span><span class="tit">${esc(a.tit)}</span>${b}</div>
          ${a.cl ? `<p class="cl ans">${esc(a.cl)}</p>` : ""}
          ${a.memo ? `<p class="memo ans"><mark>${esc(a.memo)}</mark></p>` : ""}
          <div class="foot">${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">Texto oficial ↗</a>` : ""}
            <button class="know" data-k="${esc(k)}" aria-pressed="${on}">${on ? "✔ Lo sé" : "Marcar «lo sé»"}</button></div>
        </article>`; }).join("") + `</section>`;
  }
  $("#list").innerHTML = html || `<p class="empty">No hay artículos con ese filtro. Prueba otra palabra o quita «Solo lo que no sé».</p>`;
  $("#count").innerHTML = `${days()}${sabe}/${total} artículos sabidos · ${DATA.total.toLocaleString("es-ES")} preguntas en la app`;
}
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; tema = b.dataset.t; chips(); render(); window.scrollTo({top:0}); });
$("#q").addEventListener("input", render);
$("#repaso").addEventListener("click", e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); document.body.classList.toggle("hide-ans", on); });
$("#soloPend").addEventListener("click", e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); render(); });
$("#list").addEventListener("click", e => {
  const k = e.target.closest(".know"); if (k){ const id = k.dataset.k; if (known[id]) delete known[id]; else known[id] = 1; save(); chips(); render(); return; }
  const a = e.target.closest(".ans"); if (a && document.body.classList.contains("hide-ans")) a.classList.toggle("show");
});
chips(); render();
</script>
