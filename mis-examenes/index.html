ido del acto o esté supeditada a su notificación, publicación o aprobación superior.", "Producen efectos siempre a los diez días de su notificación, periodo en el cual el acto carece por completo de presunción de validez.", "Producen efectos desde la fecha de su publicación en el Boletín Oficial correspondiente, sin que quepa excepción alguna por razón de notificación."], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 39.1 y 39.2 LPAC.", "ley": "LPAC", "art": "39", "mn": "Efectos: desde que se DICTAN (salvo que se disponga otra cosa). Eficacia demorada por notificación, publicación o aprobación superior. Retroactividad EXCEPCIONAL: en sustitución de actos ANULADOS o con efectos FAVORABLES, si los hechos ya existían y no se lesiona a terceros.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a39"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 18, "q": "¿Cuál de los siguientes servicios mínimos es obligatorio para TODOS los municipios, independientemente de su población?", "o": ["Transporte colectivo urbano y biblioteca pública.", "Medio ambiente urbano y parques y jardines.", "Protección civil y evaluación de la información de situaciones de necesidad social.", "Alumbrado público, cementerio, recogida de residuos y abastecimiento domiciliario de agua potable."], "a": "d", "mia": "d", "res": "Bien", "e": "Art. 26.1.a) LBRL (todos los municipios). Biblioteca y parque: >5.000; protección civil y servicios sociales: >20.000; transporte y medio ambiente urbano: >50.000.", "ley": "LBRL", "art": "26", "mn": "Servicios mínimos en 4 escalones: TODOS (alumbrado, cementerio, recogida de residuos, limpieza viaria, agua, alcantarillado, acceso, pavimentación); >5.000 «PaBiTra» (parque, biblioteca, tratamiento de residuos); >20.000 «ProSoInDe» (protección civil, servicios sociales, incendios, deportes); >50.000 «TraMa» (transporte urbano, medio ambiente urbano). La Diputación coordina en municipios de <20.000.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a26"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 19, "q": "Cuando la notificación por medios electrónicos sea de carácter obligatorio, o haya sido expresamente elegida por el interesado, ¿en qué momento se entenderá rechazada según el artículo 43.2 de la Ley 39/2015?", "o": ["Cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación en la sede electrónica o dirección habilitada sin acceder a su contenido.", "Al cumplirse quince días hábiles desde que el acto fue firmado electrónicamente por el órgano competente.", "Cuando hayan transcurrido diez días hábiles desde la puesta a disposición de la notificación en la sede electrónica o dirección habilitada sin acceder a su contenido.", "Ninguna es correcta."], "a": "a", "mia": "a", "res": "Bien", "e": "Art. 43.2 LPAC: diez días NATURALES. Trampa c): hábiles.", "ley": "LPAC", "art": "43", "mn": "Notificación electrónica: se practica por comparecencia en la sede o en la DEHú. Se entiende practicada al ACCEDER. Rechazada a los 10 días NATURALES sin acceso. El aviso al correo es informativo: su falta NO invalida la notificación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a43"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 20, "q": "El art. 46 de la LBRL establece que la celebración de una sesión extraordinaria del Pleno solicitada en tiempo y forma, no podrá demorarse por más de:", "o": ["Quince días hábiles desde que fuera solicitada.", "Diez días hábiles desde que fuera solicitada.", "Quince días naturales desde que fuera solicitada.", "Diez días naturales desde que fuera solicitada."], "a": "a", "mia": "b", "res": "Mal", "e": "Art. 46.2.a) LBRL: quince días hábiles.", "ley": "LBRL", "art": "46", "mn": "Plenos ordinarios «1-2-3»: >20.000 hab. y Diputaciones cada MES; 5.001-20.000 cada DOS meses; ≤5.000 cada TRES. Extraordinaria: Presidente o 1/4 del número legal (máx. 3 solicitudes por concejal y año), en 15 días hábiles. Convocatoria con 2 días HÁBILES. Quórum: 1/3 del número legal, nunca menos de 3, con Presidente y Secretario. Votación ordinaria por regla general.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a46"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 21, "q": "Según el artículo 98.1 de la Ley 39/2015, los actos administrativos serán inmediatamente ejecutivos. ¿Cuál de las siguientes opciones NO constituye una excepción legal a esta ejecutoriedad inmediata?", "o": ["Que se produzca la suspensión de la ejecución del acto.", "Que el interesado haya interpuesto un recurso contencioso-administrativo contra el acto sin que se haya acordado judicialmente la suspensión de su ejecución.", "Que se trate de una resolución de un procedimiento sancionador contra la que quepa algún recurso en vía administrativa.", "Que una disposición establezca lo contrario o se necesite aprobación o autorización superior."], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 98.1 LPAC: las excepciones son a), c) y d).", "ley": "LPAC", "art": "98", "mn": "Ejecutoriedad «NO se ejecuta si: SUSPENDIDO · SANCIÓN recurrible en vía administrativa · lo diga una norma · necesita APROBACIÓN superior». Pagos: electrónicos (tarjeta, transferencia, domiciliación…).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a98"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 22, "q": "Respecto al medio de ejecución forzosa de compulsión sobre las personas regulado en el artículo 104 de la Ley 39/2015, ¿cuál es su ámbito de aplicación legítimo?", "o": ["Se aplica a la recaudación ejecutiva de cualquier tipo de deuda pecuniaria no satisfecha en periodo voluntario.", "Procede para ejecutar actos que impongan una obligación personalísima de no hacer o soportar, en los casos en que la ley expresamente lo autorice y respetando la dignidad y derechos constitucionales.", "Sustituye en todo caso a las multas coercitivas cuando estas resulten ineficaces tras tres imposiciones sucesivas.", "Puede emplearse de forma discrecional por el instructor en cualquier fase del procedimiento sancionador sin necesidad de apercibimiento previo."], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 104.1 LPAC.", "ley": "LPAC", "art": "104", "mn": "Compulsión: solo NO HACER o SOPORTAR; si es un HACER personalísimo que no se cumple → indemnización.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a104"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 23, "q": "Según el artículo 50.2 del TREBEP, si una situación de permiso de maternidad, incapacidad temporal, riesgo durante la lactancia o durante el embarazo impide a un funcionario público iniciar o continuar el disfrute de sus vacaciones anuales dentro del año natural de devengo, ¿qué plazo máximo se establece legalmente para poder disfrutarlas una vez finalice dicha situación?", "o": ["Podrán disfrutarse sin sujeción a límite temporal alguno, siempre que persista la relación de servicios.", "Podrán disfrutarse siempre que no hayan transcurrido más de dieciocho meses a partir del final del año en que se hayan originado.", "Deberán disfrutarse obligatoriamente dentro de los primeros tres meses del año natural siguiente, perdiéndose en caso contrario.", "Se compensarán económicamente de forma automática al término del año natural si no se han podido disfrutar de forma efectiva."], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 50.2 TREBEP: 18 meses desde el final del año en que se originaron.", "ley": "TREBEP", "art": "50", "mn": "«22 hábiles, sábados fuera». Si estás de baja, «las vacaciones te esperan».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a50"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 24, "q": "De acuerdo con el artículo 89.2 del Texto Refundido de la Ley del Estatuto Básico del Empleado Público (TREBEP), ¿cuál es el periodo general de servicios efectivos prestados inmediatamente anteriores que se exige para que pueda concederse la excedencia voluntaria por interés particular?", "o": ["Un periodo mínimo de tres años de servicios efectivos de forma continuada.", "Un periodo mínimo de cinco años de servicios efectivos inmediatamente anteriores.", "No se exige ningún periodo de servicios efectivos previos, pudiendo solicitarse desde el ingreso en el servicio activo.", "Un periodo de tres años de servicios efectivos, con independencia de que sean inmediatamente anteriores o no."], "a": "b", "mia": "a", "res": "Mal", "e": "Art. 89.2 TREBEP: mínimo 5 años inmediatamente anteriores (las leyes de desarrollo pueden fijar menos; en la Ley 4/2021 valenciana son 3).", "ley": "TREBEP", "art": "89", "mn": "Excedencias: interés particular (5 años previos de servicio, sin retribución ni cómputo); agrupación familiar; cuidado de familiares (hasta 3 años por hijo, con reserva de puesto los 2 primeros); violencia de género (6 meses de reserva, prorrogables).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a89"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 25, "q": "De acuerdo con lo previsto en el artículo 38 de la Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, señale la respuesta correcta:", "o": ["Se constituirá un Comité de Seguridad y Salud en todas las empresas y centros de trabajo que cuenten con 25 o más trabajadores.", "El Comité de Seguridad y Salud estará formado por 3 delegados de prevención en empresas de 100 o más trabajadores, de una parte, y por el empresario y sus representantes en un número que no podrá ser superior al tercio de los delegados de prevención de la otra.", "El Comité de Seguridad y Salud se reunirá trimestralmente y siempre que lo solicite alguna de las representaciones del mismo, sin poder adoptar normas de funcionamiento propias.", "Las empresas que cuenten con varios centros de trabajo dotados de Comité de Seguridad y Salud podrán acordar con sus trabajadores la creación de un Comité Intercentros, con las funciones que el acuerdo le atribuya."], "a": "d", "mia": "d", "res": "Bien", "e": "Art. 38.3 LPRL. Trampas: a) 50 o más; b) en número IGUAL; c) adopta sus propias normas de funcionamiento.", "ley": "LPRL", "art": "38", "mn": "Comité de Seguridad y Salud: «50-PARITARIO-TRIMESTRAL»: empresas o centros de 50 o más; paritario (Delegados de Prevención = representantes del empresario); se reúne trimestralmente; delegados sindicales y técnicos con voz y sin voto.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292#a38"}], "repes": [{"q": "Conforme al artículo 127 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, indique cuál de las siguientes funciones NO podrá delegar la Junta de Gobierno Local en los Tenientes de Alcalde, en los demás miembros de la Junta de Gobierno Local, en su caso, en los demás concejales, en los coordinadores generales, directores generales u órganos similares:", "o": ["La concesión de cualquier tipo de licencia, salvo que la legislación sectorial la atribuya expresamente a otro órgano.", "El desarrollo de la gestión económica, autorizar y disponer gastos en materia de su competencia, disponer gastos previamente autorizados por el Pleno, y la gestión del personal.", "La determinación del número y del régimen del personal eventual.", "Ejercer la potestad sancionadora salvo que por ley esté atribuida a otro órgano."], "a": "c", "nx": 6, "ley": "LBRL", "art": "127", "cl": "Atribuciones: aprobar proyectos de ordenanzas y presupuesto, licencias, contratación, personal…", "mn": "La JGL de gran población APRUEBA PROYECTOS (los aprueba el Pleno después) y GESTIONA: licencias, contratos, personal, patrimonio.", "donde": "Alicante, Córdoba, Gandia", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a127"}, {"q": "6.- De acuerdo con el artículo 27 LRBRL, ¿en qué términos se ejercen las competencias delegadas y qué técnicas se prevén?", "o": ["Se ejercen en los términos de la disposición o acuerdo de delegación, sin prever técnicas de dirección y control.", "Se ejercen en los términos establecidos por la Ley de Bases de Régimen Local, previendo técnicas de control de legalidad.", "Se ejercen en los términos de la disposición o acuerdo de delegación, previendo técnicas de dirección y control de oportunidad y eficiencia.", "Se ejercen en los términos que determine la Comunidad Autónoma, previendo técnicas de supervisión financiera."], "a": "c", "nx": 6, "ley": "LBRL", "art": "27", "cl": "El Estado y las CCAA pueden delegar competencias en los municipios; mínimo 5 años; con financiación.", "mn": "Delegación «5-F»: duración mínima de 5 AÑOS y siempre con FINANCIACIÓN suficiente. La Administración que delega conserva la dirección y el control.", "donde": "Burriana C1 29102025, Burriana examen 28102025", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a27"}, {"q": "La seguridad en el trabajo,", "o": ["Es la especialidad médica que, actuando aislada o comunitariamente, estudia los medios preventivos para conseguir el más alto grado de bienestar físico, psíquico y social de los trabajadores en relación con la capacidad de estos, con las características y riesgos de su trabajo, el ámbito laboral y la influencia de este en su entorno, así como promueve los medios para el diagnostico, tratamiento, adaptación, rehabilitación, y calificación de la patología producida o condicionada por el trabajo", "Es la técnica preventiva que aglutina el conjunto de conocimientos científicos aplicados para que el trabajo, los sistemas, productos y ambientes se adapten a las capacidades y limitaciones físicas y mentales de la persona", "Es la técnica preventiva cuyo fin es mejorar las condiciones ambientales de trabajo a fin de evitar o, en su defecto, limitar el riesgo de enfermedad profesional", "Es la técnica preventiva que actúa sobre el entorno físico en el que se encuentra el/la trabajador/a, para tratar de disminuir el riesgo de accidentes. En el caso de que no se pudiese eliminar totalmente el riesgo, las técnicas tienden a reducir las consecuencias"], "a": "d", "nx": 6, "ley": "LPRL", "art": "4", "cl": "Prevención, riesgo laboral, daños, riesgo grave e inminente.", "mn": "Definiciones «PRE-RIE-DA-GRI»: PREvención (actividades en todas las fases); RIEsgo laboral (posibilidad de daño; gravedad = probabilidad + severidad); DAños (enfermedades, patologías, lesiones); riesgo Grave e Inminente (probable en un futuro inmediato con daño grave).", "donde": "Burriana C1 29102025, Burriana examen 28102025", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292#a4"}, {"q": "Según el tenor literal del artículo 46 bis de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público ¿dónde deben ubicarse los sistemas de información y comunicaciones para el registro de datos?", "o": ["Deberán ubicarse y prestarse dentro del territorio de la Unión Europea.", "Deberán ubicarse y prestarse dentro del territorio nacional.", "Deberán ubicarse y prestarse dentro del territorio de un tercer país.", "En el caso de las entidades locales, deberán ubicarse y prestarse dentro del territorio de la Comunidad Autónoma a la que pertenezca."], "a": "a", "nx": 6, "ley": "LRJSP", "art": "46 bis", "cl": "Los sistemas de información de datos personales sensibles de las AAPP deben ubicarse y prestarse dentro de la Unión Europea.", "mn": "«Datos sensibles de la Administración: SOLO en la UE».", "donde": "Alicante, Córdoba, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a4-2"}, {"q": "El artículo 56 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, prevé con carácter previo a la iniciación de un procedimiento administrativo, que el órgano competente para iniciar o instruir el mismo, de oficio o a instancia de parte, en casos de urgencia inaplazable y para la protección provisional de los intereses implicados, adopte de forma motivada una medida provisional. ¿Qué ocurre si en el acuerdo de iniciación no se contiene pronunciamiento expreso sobre la citada medida?", "o": ["Mantendrá la medida adoptada sus efectos.", "Mantendrá la medida sus efectos hasta que en la propuesta de resolución el responsable de su tramitación se pronuncie sobre las mismas.", "Dichas medidas quedarán sin efecto.", "Mantendrá la medida sus efectos hasta la resolución administrativa que ponga fin al procedimiento correspondiente, con la que se extinguirá."], "a": "c", "nx": 6, "ley": "LPAC", "art": "56", "cl": "Iniciado el procedimiento: las adopta el órgano competente para resolver si hay elementos de juicio. Antes de iniciarlo: urgencia inaplazable; confirmación, modificación o levantamiento en el acuerdo de iniciación en 15 días. Proporcionalidad, efectividad y menor onerosidad.", "mn": "Medidas provisionales «PEMO»: Proporcionalidad, Efectividad y Menor Onerosidad. Antes de iniciarse el procedimiento, solo por urgencia inaplazable, y el acuerdo de iniciación debe confirmarlas en 15 días (si no, quedan sin efecto).", "donde": "Alicante, Córdoba, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a56"}, {"q": "Los trámites que deban ser cumplimentados por los interesados, conforme a lo establecido en el artículo 73.1 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, deberán realizarse:", "o": ["En el plazo de diez días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.", "En el plazo de cinco días a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.", "En el plazo de un mes a partir del siguiente al de la notificación del correspondiente acto, salvo en el caso de que en la norma correspondiente se fije plazo distinto.", "No está regulado plazo expreso en el citado artículo."], "a": "a", "nx": 6, "ley": "LPAC", "art": "73", "cl": "Trámites de los interesados: 10 días desde la notificación salvo otro plazo. Defectos: requerimiento con 10 días. Fuera de plazo: se admite si se cumple antes o dentro del día en que se notifica la resolución que tiene por transcurrido el plazo.", "mn": "Trámites del interesado: 10 días. Si no los cumple, se le puede declarar DECAÍDO en su derecho, pero se admite su actuación si la hace ANTES o DENTRO del día en que se le notifica esa resolución.", "donde": "Alicante, Córdoba, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a73"}, {"q": "Indique la opción correcta en relación con el tenor literal del artículo 13 de la Constitución Española de 1978:", "o": ["Solamente los españoles de origen serán titulares de los derechos reconocidos en el artículo 23, salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de sufragio activo y pasivo en las elecciones municipales.", "Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23, salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de sufragio activo y pasivo en las elecciones municipales.", "Solamente los españoles de origen serán titulares de los derechos reconocidos en el artículo 23, salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de sufragio activo y pasivo en las elecciones generales.", "Solamente los españoles serán titulares de los derechos reconocidos en e ión de no haberse cometido la infracción"], "a": "c", "nx": 5, "ley": "LPAC", "art": "52", "cl": "La Administración puede convalidar los actos ANULABLES subsanando los vicios. Efecto desde la fecha de la convalidación (salvo retroactividad del 39.3). Incompetencia no determinante de nulidad: la convalida el superior jerárquico; falta de autorización: otorgándola.", "mn": "Convalidación: solo actos ANULABLES. Produce efecto desde su fecha (salvo la retroactividad del 39.3). Incompetencia no determinante de nulidad: la convalida el superior jerárquico. Falta de autorización: se convalida otorgándola.", "donde": "Examen y plantilla bolsa Téc. Medio de Gestión A2, Oliva", "fallo": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a52"}, {"q": "El trámite de audiencia concedido el 25 de junio de 2025:", "o": ["Tiene por objeto que el interesado manifieste únicamente su conformidad o disconformidad con la propuesta de resolución.", "Solo permite formular alegaciones, pero no aportar documentos que no hubieran sido presentados durante la instrucción.", "Debe concederse por un plazo no superior a diez días hábiles.", "Permite al interesado formular alegaciones y aportar documentos antes de la resolución."], "a": "d", "nx": 5, "ley": "LPAC", "art": "118", "cl": "Hechos o documentos nuevos: alegaciones entre 10 y 15 días. No se tienen en cuenta los que pudo aportar antes. Otros interesados: traslado del recurso.", "mn": "Audiencia en recursos: solo si hay hechos NUEVOS, 10-15 días. El recurso, los informes y las propuestas NO son documentos nuevos.", "donde": "Alicante, Examen Gandia Resuelto Auxiliar, Gandia", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a118"}, {"q": "Las alegaciones presentadas el 10 de julio de 2025 durante el trámite de audiencia:", "o": ["Pueden ir acompañadas de documentos y justificaciones que el interesado estime pertinentes.", "Solo pueden contener observaciones jurídicas.", "Deben limitarse a rebatir la propuesta de resolución.", "Obligan a retrotraer el procedimiento al inicio de la instrucción."], "a": "a", "nx": 5, "ley": "LPAC", "art": "82", "cl": "Instruido el procedimiento e inmediatamente antes de la propuesta de resolución; plazo no inferior a 10 días ni superior a 15. Se puede prescindir si no figuran ni se tienen en cuenta otros hechos, alegaciones o pruebas que las del interesado.", "mn": "Audiencia «10-15»: entre 10 y 15 días, inmediatamente ANTES de la propuesta de resolución y antes del informe jurídico o del dictamen. Se puede prescindir si solo constan los hechos y alegaciones del propio interesado.", "donde": "Alicante, Examen Gandia Resuelto Auxiliar, Gandia", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a82"}, {"q": "Es competencia exclusiva del Estado según el artículo 149 de la Constitución Española de 1978:", "o": ["Regulación de la artesanía.", "Bases y coordinación de la planificación general de la actividad económica.", "Los montes y aprovechamientos forestales.", "Ninguna de las respuestas anteriores son correctas."], "a": "b", "nx": 5, "ley": "CE", "art": "149", "cl": "Lista exclusiva; cláusula residual; prevalencia y supletoriedad (149.3).", "mn": "Competencias exclusivas del Estado: 32 materias. Trucos: lo «básico» y la «legislación» suelen ser del Estado (legislación laboral, mercantil, penal, procesal, civil con matices) y la «ejecución» de la CA. Las cláusulas residuales del 149.3 favorecen al Estado.", "donde": "Alicante, Córdoba", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a149"}, {"q": "En el marco del artículo 27 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, con el objeto de evitar duplicidades administrativas, mejorar la transparencia de los servicios públicos y el servicio a la ciudadanía y, en general, contribuir a los procesos de racionalización administrativa, generando un ahorro neto de recursos, la Administración del Estado y las de la blico y libre designación con convocatoria pública.", "Mediante los de concurso y de libre designacion con convocatoria pública.", "Mediante los de concurso y de libre designación sin convocatoria pública.", "Mediante los de oposición, concurso público y libre designación sin convocatoria pública. Página 10 | 15"], "a": "b", "nx": 5, "ley": "TREBEP", "art": "78", "cl": "Provisión de puestos: igualdad, mérito, capacidad y publicidad. Procedimientos ordinarios: concurso (sistema normal) y libre designación con convocatoria pública. Otros: movilidad, redistribución, adscripción provisional, comisión de servicios.", "mn": "«Concurso por defecto, libre designación por excepción», y siempre con convocatoria pública.", "donde": "Examen y plantilla bolsa Téc. Medio de Gestión A2, Oliva", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a78"}, {"q": "¿Cuándo podrán obtener la excedencia voluntaria por interés particular los funcionarios de carrera?", "o": ["Cuando hayan prestado servicios efectivos en cualquiera de las Administraciones Públicas durante un período mínimo de cinco años inmediatamente anteriores.", "Cuando hayan prestado servicios efectivos en cualquiera de las Administraciones Públicas durante un período mínimo de tres años inmediatamente anteriores.", "Cuando hayan prestado servicios efectivos en cualquiera de las Administraciones Públicas durante un período mínimo de cinco años.", "Cuando hayan prestado, durante un período mínimo de dos años, servicios efectivos en cualquiera de las Administraciones Públicas."], "a": "a", "nx": 5, "ley": "TREBEP", "art": "89", "cl": "1. La excedencia de los funcionarios de carrera podrá adoptar las siguientes modalidades:", "mn": "Excedencias: interés particular (5 años previos de servicio, sin retribución ni cómputo); agrupación familiar; cuidado de familiares (hasta 3 años por hijo, con reserva de puesto los 2 primeros); violencia de género (6 meses de reserva, prorrogables).", "donde": "Examen y p cargos, poderes de dirección...).", "mn": "Se negocia lo que toca «bolsillo y reloj» del empleado (dinero, jornada, vacaciones, permisos, carrera). NO se negocia la «organización»: cómo se organiza la casa ni los derechos del ciudadano.", "donde": "Examen y plantilla bolsa Téc. Medio de Gestión A2, Oliva", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a37"}, {"q": "Serán susceptibles de Recurso especial en materia de contratación actos y disposiciones que se refieran a contratos de servicios que tengan un valor estimado superior a:", "o": ["75.000 euros.", "200.000 euros.", "100.000 euros.", "10.000 euros."], "a": "c", "nx": 5, "ley": "LCSP", "art": "44", "cl": "1. Serán susceptibles de recurso especial en materia de contratación, los actos y decisiones relacionados en e", "mn": "Recurso especial: obras > 3 M€; suministros y servicios > 100.000 €; concesiones > 3 M€. Es potestativo y gratuito.", "donde": "Examen y plantilla bolsa Téc. Medio de Gestión A2, Oliva", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a4-6"}, {"q": "Para que sean aplicables reducciones sobre el importe de la sanción propuesta:", "o": ["El infractor debe renunciar a interponer recurso contencioso administrativo.", "Esta debe tener carácter no pecuniario.", "Debe condicionarse al desistimiento o renuncia de cualquier acción o recurso en vía administrativa.", "Se deberá dictar resolución expresa de conformidad."], "a": "c", "nx": 5, "ley": "LPAC", "art": "85", "cl": "Reconocimiento de responsabilidad y pago voluntario antes de la resolución. Si la sanción es solo pecuniaria: reducciones de al menos el 20% cada una, acumulables, condicionadas al desistimiento o renuncia de recursos administrativos.", "mn": "«Reconoce y paga = 20 + 20»: dos reducciones de AL MENOS el 20% cada una, ACUMULABLES, si la sanción es solo pecuniaria. Condición: renunciar a recurrir en vía administrativa.", "donde": "Examen y plantilla bolsa Téc. Medio de Gestión A2, Oliva", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a85"}, {"q": "El Ámbito de aplicación del Plan de Igualdad, es:", "o": ["Solo departamentos administrativos", "Todo el personal municipal", "Únicamente personal nuevo", "Solo mujeres trabajadoras"], "a": "b", "nx": 5, "ley": "LO 3/2007", "art": "45", "cl": "Empresas de 50 o más trabajadores.", "mn": "Planes de igualdad: OBLIGATORIOS en empresas de 50 o más trabajadores, cuando lo diga el convenio, o cuando lo imponga la autoridad laboral en sustitución de sanciones accesorias. Voluntarios en el resto. Truco «50 = plan».", "donde": "00008989-examen subalterno, 1ExamenGandia2023 Respuestas, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115#a45"}, {"q": "El informe solicitado al servicio municipal:", "o": ["Debe emitirse obligatoriamente en el plazo general de 10 días salvo norma específica.", "Tiene carácter vinculante para el órgano resolutorio.", "Sustituye la fase de prueba.", "Ninguna respuesta es correcta."], "a": "a", "nx": 5, "ley": "LGS", "art": "24", "cl": "", "mn": "", "donde": "Alicante, Examen Gandia Resuelto Auxiliar, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2003-20977#a24"}, {"q": "La resolución de 2 de junio de 2025 rechazando una prueba testifical:", "o": ["Es válida si la Administración considera motivadamente que la prueba es innecesaria.", "Es nula porque toda prueba propuesta debe practicarse.", "Es válida únicamente si la acepta el interesado.", "Es válida, aunque no se haya notificado debidamente."], "a": "a", "nx": 5, "ley": "LPAC", "art": "77", "cl": "Cualquier medio admisible en Derecho. Período de prueba no superior a 30 días ni inferior a 10. Extraordinario: no superior a 10 días. Rechazo motivado solo si son improcedentes o innecesarias.", "mn": "Prueba «10-30 + 10»: período ordinario entre 10 y 30 días; extraordinario hasta 10 días. Rechazo de pruebas: resolución MOTIVADA. Los hechos de sentencias penales firmes vinculan.", "donde": "Alicante, Examen Gandia Resuelto Auxiliar, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a77"}, {"q": "En el supuesto descrito, una vez solicitado el dictamen preceptivo del órgano consultivo competente, el plazo máximo para resolver:", "o": ["Puede suspenderse desde la solicitud del dictamen preceptivo hasta su recepción.", "Se interrumpe definitivamente y comienza de nuevo cuando se reciba el dictamen.", "Continúa su cómputo, sin que la solicitud del dictamen produzca efecto alguno.", "Solo puede suspenderse si el interesado presta su consentimiento."], "a": "a", "nx": 5, "ley": "LPAC", "art": "81", "cl": "Informe del servicio cuyo funcionamiento causó la lesión (10 días). Dictamen del Consejo de Estado u órgano consultivo autonómico cuando la cuantía sea igual o superior a 50.000 euros (o lo que fije la CCAA); dictamen en 2 meses.", "mn": "Responsabilidad patrimonial «10-50-2»: informe del servicio en 10 días; dictamen del Consejo de Estado u órgano autonómico si la cuantía es ≥ 50.000 €; el dictamen se emite en 2 meses. El instructor remite la propuesta en 10 días desde el fin de la audiencia.", "donde": "Alicante, Examen Gandia Resuelto Auxiliar, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a81"}, {"q": "De conformidad con lo establecido por la Disposición Adicional 7ª de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, respecto de la protección de datos personales en las notificaciones por medio de anuncios y publicaciones de actos administrativos:", "o": ["Cuando sea necesaria la publicación de un acto administrativo que contuviese datos personales del afectado, se identificará al mismo mediante su nombre y apellidos, añadiendo el documento nacional de identidad, número de identidad de extranjero, pasaporte o documento equivalente.", "Cuando se trate de la notificación por medio de anuncios, particularmente en los supuestos de notificación infructuosa, se identificará al afectado mediante el número completo de su documento nacional de identidad, número de identidad de extranjero, pasaporte o documento equivalente más su nombre y un apellido.", "Cuando el afectado careciera de documento nacional de identidad, número de identidad de extranjero, pasaporte o documento equivalente, se identificará al afectado únicamente mediante su nombre y apellidos.", "En determinados casos debe publicarse el nombre y apellidos de manera conjunta con el número completo del documento nacional de identidad, número de identidad de extranjero, pasaporte o documento equivalente."], "a": "c", "nx": 5, "ley": "LOPDGDD", "art": "DA 7", "cl": "", "mn": "", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"}, {"q": "De conformidad con el artículo 33 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, la negociación colectiva de condiciones de trabajo de los funcionarios públicos estará sujeta a los principios de legalidad, cobertura presupuestaria, buena fe negocial, publicidad, transparencia y/e:", "o": ["Integridad.", "Obligatoriedad.", "Eficiencia.", "Neutralidad."], "a": "b", "nx": 5, "ley": "TREBEP", "art": "33", "cl": "Negociación colectiva: legalidad, cobertura presupuestaria, obligatoriedad, buena fe negocial, publicidad y transparencia.", "mn": "«LeCO-BuPu»: Legalidad, Cobertura, Obligatoriedad, Buena fe, Publicidad.", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a33"}, {"q": "De conformidad con el artículo 12 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales y respecto al ejercicio de los derechos de las personas, establecidos por esta ley:", "o": ["El encargado del tratamiento estará obligado a informar al afectado sobre los medios a su disposición para ejercer los derechos que le corresponden. Los medios deberán ser fácilmente accesibles para el afectado. El ejercicio del derecho no podrá ser denegado por el solo motivo de optar el afectado por otro medio.", "El responsable podrá tramitar, por cuenta del encargado, las solicitudes de ejercicio formuladas por los afectados de sus derechos si así se estableciere en el contrato o acto jurídico que les vincule.", "La prueba del cumplimiento del deber de responder a la solicitud de ejercicio de sus derechos formulado por el afectado recaerá sobre el responsable.", "En cualquier caso, los titulares de la tutela podrán ejercitar en nombre y representación de los menores de doce años los derechos de acceso, rectificación, cancelación, oposición o cualesquiera otros que pudieran corresponderles."], "a": "c", "nx": 5, "ley": "LOPDGDD", "art": "12", "cl": "Ejercicio de derechos: la prueba de haber respondido a la solicitud corresponde al responsable.", "mn": "«La CARGA de la prueba es del responsable».", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a1-4"}, {"q": "De conformidad con el artículo 41 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, en una Administración con 328 funcionarios, los miembros de las Juntas de Personal y los Delegados de Personal, en su caso, como representantes legales de los funcionarios, dispondrán en el ejercicio de su función, de un crédito de horas mensuales, dentro de la jornada de trabajo y retribuidas como de trabajo efectivo, de:", "o": ["30 horas.", "20 horas.", "13 horas.", "40 horas"], "a": "a", "nx": 5, "ley": "TREBEP", "art": "41", "cl": "Garantías de los representantes del personal, entre ellas el crédito de horas mensuales retribuidas, que crece con la plantilla.", "mn": "«Horas sindicales: crecen con la plantilla».", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a41"}, {"q": "Según el artículo 54 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, es un principio de conducta de los empleados públicos:", "o": ["Abstenerse en aquellos asuntos en los que tengan un interés personal.", "No aceptar ningún trato de favor o situación que implique privilegio o ventaja injustificada, por parte de personas físicas o entidades privadas.", "La administración de los recursos y bienes públicos con austeridad, no utilizando los mismos en provecho propio o de personas allegadas, y debiendo velar por su conservación.", "Cumplir con diligencia las tareas que les correspondan o se les encomienden y, en su caso, resolver dentro de plazo los procedimientos o expedientes de su competencia."], "a": "c", "nx": 5, "ley": "TREBEP", "art": "54", "cl": "Principios de conducta: respeto, obediencia (salvo infracción manifiesta), austeridad con los recursos públicos, no aceptar regalos más allá de los usos sociales…", "mn": "«AUSTERIDAD con lo público; regalos, solo de cortesía».", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a54"}, {"q": "La pertenencia a los órganos de selección, según la dicción literal del artículo 60 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, será siempre a título:", "o": ["Personal.", "Individual.", "Representativo.", "Unipersonal."], "a": "b", "nx": 5, "ley": "TREBEP", "art": "60", "cl": "Órganos de selección: colegiados, imparcialidad y profesionalidad, tendencia a la paridad. No pueden formar parte personal de elección o designación política, interinos ni eventuales. Pertenencia a título individual.", "mn": "Tribunal «sin políticos, sin interinos, sin eventuales», y nadie va «en representación de».", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a60"}, {"q": "Indique cuál de las siguientes afirmaciones es CORRECTA, de conformidad con el Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:", "o": ["La renuncia a la condición de funcionario inhabilita para ingresar de nuevo en la Administración Pública.", "La pérdida de la nacionalidad española o la de cualquier otro Estado miembro de la Unión Europea o la de aquellos Estados a los que, en virtud de tratados internacionales celebrados por la Unión Europea y ratificados por España, les sea de aplicación la libre circulación de trabajadores, que haya sido tenida en cuenta para el nombramiento, determinará en todo caso la pérdida de la condición de funcionario.", "La renuncia a la condición de funcionario será aceptada por la Administración salvo que el funcionario esté sujeto a expediente disciplinario.", "La pena principal o accesoria de inhabilitación absoluta cuando hubiere adquirido firmeza la sentencia que la imponga produce la pérdida de la condición de funcionario respecto de aquellos empleos o cargos especificados en la sentencia."], "a": "c", "nx": 5, "ley": "TREBEP", "art": "65", "cl": "Renuncia a la condición de funcionario: por escrito y aceptada expresamente; no si está sujeto a expediente disciplinario o procesado por delito.", "mn": "«Renuncia POR ESCRITO; no si tienes EXPEDIENTE».", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a65"}, {"q": "De conformidad con el artículo 35 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, las Mesas de Negociación a que se refieren los artículos 34, 36.3 y disposición adicional duodécima de este Estatuto, quedarán válidamente constituidas cuando, además de la representación de la Administración correspondiente, y sin perjuicio del derecho de todas las organizaciones sindicales legitimadas a participar en ellas en proporción a su representatividad, tales organizaciones sindicales representen, como mínimo:", "o": ["La mayoría simple de los miembros de los órganos unitarios de representación en el ámbito de que se trate.", "La mayoría de tres quintas partes de los miembros de los órganos unitarios de representación en el ámbito de que se trate.", "La mayoría absoluta de los miembros de los órganos unitarios de representación en el ámbito de que se trate.", "La mitad más uno de los asistentes de los miembros de los órganos unitarios de representación en el ámbito de que se trate."], "a": "c", "nx": 5, "ley": "TREBEP", "art": "35", "cl": "Mesas de negociación válidas cuando los sindicatos presentes representan la mayoría absoluta de los miembros de los órganos unitarios de representación.", "mn": "«Mesa válida = sindicatos con MAYORÍA ABSOLUTA de delegados».", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a35"}, {"q": "Señale la respuesta correcta, en relación a los requisitos para poder participar en los procesos selectivos, de conformidad con lo establecido en los artículos 56 y 57 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público:", "o": ["Sólo podrán acceder como personal funcionario a la Administración Pública quienes tengan la nacionalidad española.", "Sólo podrán acceder como personal funcionario a la Administración Pública además de los que tengan la nacionalidad española y los nacionales de los estados miembros de la Unión Europea.", "Los extranjeros que pueden acceder como personal funcionario a la Administración Pública, así como los extranjeros con residencia legal en España, podrán acceder a las Administraciones Públicas, como personal laboral, en igualdad de condiciones que los españoles.", "Ninguna de las respuestas anteriores es correcta."], "a": "c", "nx": 5, "ley": "TREBEP", "art": "56", "cl": "Requisitos generales: nacionalidad española (salvo art. 57), capacidad funcional, 16 años y no exceder la edad máxima de jubilación, no haber sido separado ni inhabilitado, titulación exigida.", "mn": "«N-C-E-H-T»: Nacionalidad, Capacidad, Edad (16), Historial limpio, Titulación.", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a56"}, {"q": "Según lo dispuesto en el artículo 169 del Texto Refundido de la Ley de Haciendas Locales aprobado por el Real Decreto Legislativo 2/2004 de 5 de marzo, si al iniciarse el ejercicio económico no hubiese entrado en vigor el presupuesto:", "o": ["Se considerará automáticamente prorrogado el del anterior, en todos sus créditos iniciales, incluidos los créditos para servicios o programas que debían concluir en el ejercicio anterior y no lo hicieron.", "Se considerará automáticamente prorrogado el del anterior, en todos sus créditos finales, teniendo en cuenta las modificaciones realizadas conforme los artículos 177, 178 y 179 del mismo cuerpo legal.", "Se considerará automáticamente prorrogado el del anterior, en todos sus créditos iniciales. La prórroga no afectará a créditos para servicios o programas que deban concluir en el ejercicio anterior o que estén financiados con créditos u otros ingresos específicos o afectados.", "Se considerará automáticamente prorrogado el del anterior, en todos sus créditos iniciales. La prórroga no afectará a créditos para servicios o programas que deban concluir en el ejercicio anterior o que estén financiados con créditos u otros ingresos específicos o afectados. Se entenderá prorrogado hasta 1 de marzo del ejercicio económico iniciado que es cuando debe estar confeccionada la liquidación del presupuesto del ejercicio anterior."], "a": "c", "nx": 5, "ley": "TRLRHL", "art": "169", "cl": "15 días; 1 mes para resolver; antes del 31/12; prórroga automática.", "mn": "Presupuesto «15-1M-31D»: exposición pública de 15 días previo anuncio en el BOP; sin reclamaciones queda aprobado; si las hay, el Pleno tiene 1 MES para resolverlas; aprobación definitiva antes del 31 de diciembre; si no, se prorroga automáticamente el anterior.", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a169"}, {"q": "Indique la opción correcta conforme a lo dispuesto en el artículo 154 de la Constitución Española de 1978:", "o": ["Un Delegado nombrado por el Presidente del Gobierno dirigirá la Administración del Estado en el territorio de la Comunidad Autónoma y la coordinará con la administración propia de la Comunidad.", "Un Delegado nombrado por el Presidente del Gobierno dirigirá la Administración del Estado en el territorio de la Comunidad Autónoma y la coordinará, cuando proceda, con la administración propia de la Comunidad.", "Un Delegado nombrado por el Gobierno dirigirá la Administración del Estado en el territorio de la Comunidad Autónoma y la coordinará, cuando proceda, con la administración propia de la Comunidad.", "Un Delegado nombrado por el Gobierno coordinará la Administración del Estado en el territorio de la Comunidad Autónoma y cooperará con la administración propia de la Comunidad."], "a": "c", "nx": 5, "ley": "CE", "art": "154", "cl": "Dirige la Administración del Estado en el territorio de la CA y la coordina con la autonómica.", "mn": "«154 = Delegado del Gobierno»: lo nombra el Gobierno. No confundir con el President de la Generalitat (152).", "donde": "Alicante, Córdoba", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a154"}, {"q": "La Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, en su artículo 14 señala cuales serán, a los fines de esta ley, los criterios generales de actuación de los Poderes Públicos. Uno de los que se citan N
