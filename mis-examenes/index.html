 judicial motivada.", "mn": "«Inscribir = publicidad; disolver = juez». Prohibidas: SECRETAS y PARAMILITARES. Las que persigan fines o usen medios delictivos son ilegales.", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a22"}, {"q": "De acuerdo con el artículo 22 del Estatuto de Autonomía de la Comunitat Valenciana, corresponde a Les Corts:", "o": ["Solicitar a las Cortes Generales la adopción de proyectos de ley.", "Presentar al Gobierno del Estado proposiciones de ley.", "Solicitar al Gobierno del Estado la adopción de proyectos de ley.", "Solicitar al Congreso de los Diputados la adopción de proposiciones de ley."], "a": "c", "nx": 4, "ley": "EACV", "art": "22", "cl": "Potestad legislativa, presupuestos, control del Consell, elección del President, designación de senadores…", "mn": "Les Corts «LEGISLAN, PRESUPUESTAN, CONTROLAN y ELIGEN» (al President y a los senadores autonómicos).", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235#aveintidos"}, {"q": "Según dispone el artículo 61.6 del TREBEP, ¿bajo qué condición podrá aplicarse el sistema de concurso para la selección de funcionarios de carrera?", "o": ["En virtud de reglamento aprobado por el Pleno de la Corporación Local.", "Solo en virtud de ley, con carácter excepcional.", "Mediante acuerdo de la Mesa General de Negociación, con carácter extraordinario.", "En virtud de Real Decreto, de forma permanente para el subgrupo C1 y C2."], "a": "b", "nx": 4, "ley": "TREBEP", "art": "61", "cl": "Sistemas selectivos: oposición, concurso-oposición y, excepcionalmente, concurso (solo por ley). Procesos abiertos, libre concurrencia, conexión entre pruebas y funciones. Personal laboral fijo: los mismos sistemas.", "mn": "«O, C-O, y C solo con ley». El concurso puro es la excepción.", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a61"}, {"q": "De acuerdo con el artículo 68.1 de la LPACAP, si una solicitud de iniciación no reúne los requisitos exigidos, se requerirá al interesado para que subsane la falta o acompañe los documentos preceptivos en el plazo de:", "o": ["Quince días, ampliables a otros diez en procedimientos de urgencia.", "Diez días, bajo apercibimiento de que, si no lo hiciere, se le tendrá por desistido de su petición previa resolución expresa.", "Cinco días hábiles desde la fecha de recepción de la comunicación siempre que se trate de procedimientos selectivos o de concurrencia competitiva.", "Un mes de plazo improrrogable según las normas generales de ordenación del procedimiento."], "a": "b", "nx": 4, "ley": "LPAC", "art": "68", "cl": "10 días para subsanar; si no, desistido previa resolución. Ampliable hasta 5 días más (no en selectivos ni concurrencia competitiva). Presentación presencial de obligados: subsanar por vía electrónica.", "mn": "Subsanación: «10 + 5» días (los 5 de ampliación NO en selectivos ni concurrencia competitiva). Si no se subsana = DESISTIDO, previa resolución. Si un obligado presenta en papel: se le requiere subsanar electrónicamente y la fecha válida es la de la subsanación.", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a68"}, {"q": "De acuerdo con el artículo 125.2 de la LPACAP, el recurso extraordinario de revisión se interpondrá dentro del plazo de cuatro años siguientes a la fecha de la notificación de la resolución impugnada cuando concurra la circunstancia:", "o": ["Que al dictarlos se hubiera incurrido en error de hecho, que resulte de los propios documentos incorporados al expediente.", "Que aparezcan documentos de valor esencial para la resolución del asunto que, aunque sean posteriores, evidencien el error de la resolución recurrida.", "Que en la resolución hayan influido esencialmente documentos o testimonios declarados falsos por sentencia judicial firme, anterior o posterior a aquella resolución.", "Que la resolución se hubiese dictado como consecuencia de prevaricación, cohecho, violencia, maquinación fraudulenta u otra conducta punible y se haya declarado así en virtud de sentencia judicial firme."], "a": "a", "nx": 4, "ley": "LPAC", "art": "125", "cl": "Contra actos firmes, ante el mismo órgano: error de hecho que resulte de documentos del expediente (4 años desde la notificación); documentos de valor esencial; documentos o testimonios declarados falsos por sentencia firme; prevaricación, cohecho, violencia u otra conducta punible por sentencia firme (3 meses).", "mn": "Recurso extraordinario de revisión «E-D-F-P»: Error de hecho (4 años), Documentos esenciales nuevos, Falsedad declarada en sentencia, Prevaricación o cohecho declarados en sentencia (en estos tres, 3 meses desde el conocimiento o la firmeza). Solo contra actos FIRMES y ante el mismo órgano.", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a125"}, {"q": "De acuerdo con el artículo 124 de la LPACAP, ¿cuál de las siguientes respuestas es correcta en relación con el recurso potestativo de reposición?", "o": ["El plazo para su interposición será de dos meses si el acto fuera expreso.", "El plazo máximo para dictar y notificar su resolución será de tres meses.", "Si el acto no fuera expreso, el recurso de reposición deberá interponerse en el plazo de un mes desde que se produzca el acto presunto.", "Ninguna respuesta es correcta."], "a": "d", "nx": 4, "ley": "LPAC", "art": "124", "cl": "Acto expreso: 1 mes; si no es expreso, en cualquier momento desde el día siguiente al silencio. Resolver y notificar: 1 mes. No cabe nuevo recurso de reposición contra su resolución.", "mn": "Reposición «1-1»: 1 MES para interponer, 1 MES para resolver. Nada de reposición sobre reposición.", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a124"}, {"q": "Conforme al artículo 14 de la Ley 19/2013, de 9 de diciembre, de Transparencia, acceso a la información pública y buen gobierno, son límites al derecho de acceso a la información pública:", "o": ["La seguridad nacional.", "Las relaciones exteriores.", "Los intereses económicos y comerciales.", "todas las anteriores son correctas."], "a": "d", "nx": 4, "ley": "Ley 19/2013", "art": "14", "cl": "Doce límites al acceso: seguridad nacional, defensa, relaciones exteriores, seguridad pública, ilícitos penales/administrativos/disciplinarios, igualdad de partes en procesos judiciales, funciones de vigilancia/inspección/control, intereses económicos y comerciales, política económica y monetaria, secreto profesional y propiedad intelectual/industrial, confidencialidad en la toma de decisiones, medio ambiente. Aplicación justificada y proporcionada (test del daño).", "mn": "«Los 12 apóstoles del secreto»: empiezan por las 4 de seguridad (Nacional, Defensa, Exteriores, Pública) y acaban en el medio ambiente. Siempre justificado y proporcionado.", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a14"}, {"q": "Que Ley regula la igualdad entre mujeres y hombres en la Comunitat Valenciana?", "o": ["Ley 9/2003, de 2 de abril.", "Ley 7/1985, de 15 de abril.", "No existe legislación autonómica valenciana sobre igualdad.", "Ninguna es correcta."], "a": "a", "nx": 4, "ley": "LBRL", "art": "20", "cl": "Alcalde, Tenientes y Pleno en todos; JGL en más de 5.000 o si se acuerda.", "mn": "Existen en todos los municipios: Alcalde, Tenientes de Alcalde, Pleno y Comisión Especial de Cuentas. JGL en los de >5.000 (o si lo decide el ROM o el Pleno).", "donde": "Calp", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a20"}, {"q": "Según el Texto Refundido del Estatuto Básico del Empleado Público, la enfermedad grave de un familiar de primer grado de afinidad, cuando sea en distinta localidad, dará lugar a un permiso de:", "o": ["Tres días hábiles.", "Cuatro días hábiles.", "Cinco días hábiles.", "Depende del Convenio Colectivo firmado entre el Ayuntamiento y los trabajadores."], "a": "c", "nx": 4, "ley": "TREBEP", "art": "48", "cl": "Accidente/enfermedad grave, hospitalización o intervención con reposo de familiar de 1.er grado (o conviviente): 5 días hábiles; 2.º grado: 4. Fallecimiento 1.er grado: 3 días (misma localidad) / 5 (distinta); 2.º grado: 2 / 4. Traslado de domicilio: 1 día. Exámenes: el día. Asuntos particulares: 6 días. Matrimonio o pareja de hecho: 15 días.", "mn": "Desde 2025: «Enfermo 5-4, muerto 3-5 / 2-4». Mudanza 1, asuntos propios 6, boda 15 (quincena de novios).", "donde": "AYUNTAMIENTO DE PEGO SINRESPUESTAS, Magán, Pego C1 test respostes 10-2025, examenAdministrativoPego15101015", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a48"}, {"q": "¿Quién representa al Ayuntamiento?", "o": ["El Pleno", "La Junta de Gobierno Local", "El Alcalde", "Todos los Concejales"], "a": "c", "nx": 4, "ley": "LBRL", "art": "124", "cl": "Municipios de gran población: el Alcalde ostenta la máxima representación, es responsable de su gestión política ante el Pleno y tiene tratamiento de Excelencia. Lista de atribuciones del 124.4.", "mn": "Alcalde «grande» = «Excelencia»: ciudad grande, tratamiento grande. Responde ante el Pleno, no ante la Junta.", "donde": "20210329 EXAMEN-DE-CONSERJE 2023, 20210329 EXAMEN-DE-CONSERJE Pueblamontalban, EXAMEN CONSERJE CORREGIDO, EXAMEN CONSERJE CORREGIDO (1)", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a124"}, {"q": "Cuando el recurso potestativo de reposición se haya interpuesto contra la desestimación por silencio administrativo de una solicitud por el transcurso del plazo si, llegado el plazo de resolución del recurso, el órgano administrativo no ha dictado y notificado resolución expresa, se entenderá:", "o": ["Estimado.", "Desestimado.", "lnadmitido.", "Rechazado."], "a": "b", "nx": 4, "ley": "LPAC", "art": "24", "cl": "Regla: estimatorio. Desestimatorio: derecho de petición, transferencia de facultades de dominio o servicio público, medio ambiente, responsabilidad patrimonial, impugnación de actos y revisión de oficio. Estimatorio en alzada contra silencio. El estimatorio es acto finalizador; el desestimatorio solo permite recurrir.", "mn": "Silencio en procedimientos a solicitud: ESTIMATORIO por regla. Desestimatorio en «PeDoMaReReRe»: PEtición, DOminio y servicio público, Medio Ambiente, REsponsabilidad patrimonial, REcursos (impugnación) y REvisión de oficio. Excepción doble: en el recurso de alzada contra un silencio previo, el silencio es estimatorio.", "donde": "Alicante, Calp, RRHH-5ADM-C1-EXAMEN-TEST", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a24"}, {"q": "Según el artículo 2 del Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, podemos clasificar las contribuciones especiales como:", "o": ["Ingresos de derecho privado", "Precios públicos", "Tasas", "Tributos propios"], "a": "d", "nx": 4, "ley": "TRLRHL", "art": "2", "cl": "Lista a)–h): patrimonio, tributos, participaciones, subvenciones, precios públicos, crédito, multas…", "mn": "Recursos de las haciendas locales «PA-TRI-PAR-SUB-PRE-CRE-MUL-DEMÁS»: PAtrimonio, TRIbutos propios y recargos, PARticipaciones, SUBvenciones, PREcios públicos, CRÉditos, MULtas y demás prestaciones de Derecho público.", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a2"}, {"q": "Según el artículo 85 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, si una entidad local presta los servicios públicos de competencia local a través de un Organismo Autónomo Local, dicho servicio se está gestionando mediante:", "o": ["Gestión indirecta", "Gestión directa", "Gestión Consorciada", "Contrato de servicios"], "a": "b", "nx": 4, "ley": "LBRL", "art": "85", "cl": "Directa (4) e indirecta.", "mn": "Gestión directa = «GO-EE-SM»: Gestión por la propia entidad, Organismo autónomo, Entidad pública empresarial, Sociedad mercantil 100 % pública. EPE y SM solo si son más sostenibles y eficientes (memoria justificativa). Indirecta = modalidades del contrato de concesión (LCSP). Nunca indirecta ni por sociedad privada si hay ejercicio de autoridad.", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a85"}, {"q": "Son derechos y deberes de los vecinos de conformidad con lo establecido en el artículo 18 de la Ley 7/1985, de 2 de abril, reguladora de las Bases de Régimen Local:", "o": ["Ser elector y elegible de acuerdo con lo dispuesto en la legislación electoral", "Pedir la consulta popular en los términos previstos en la ley", "Son correctas las respuestas a y b", "Ninguna es correcta"], "a": "c", "nx": 4, "ley": "LBRL", "art": "18", "cl": "Lista 18.1 a)–h).", "mn": "Derechos y deberes de los vecinos: elector y elegible; participar; usar los servicios y aprovechamientos comunales; CONTRIBUIR (deber); ser informado; pedir CONSULTA popular; exigir el servicio obligatorio; iniciativa popular.", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a18"}, {"q": "La Junta de Gobierno Local", "o": ["Existe en todos los municipios con población superior a 5.000 habitantes y en los de menos, cuando así lo disponga su reglamento orgánico o así lo acuerde el Pleno de su ayuntamiento", "Solo existe en todos los municipios con población superior a 5.000 habitantes", "Solo existe en los municipios señalados en el título X de la Ley de Bases de Régimen Local", "Existe en todos los municipios con población superior a 15.000 habitantes y en los de menos, cuando así lo disponga su reglamento orgánico o así lo acuerde el Pleno de su ayuntamiento"], "a": "a", "nx": 4, "ley": "LBRL", "art": "20", "cl": "Alcalde, Tenientes y Pleno en todos; JGL en más de 5.000 o si se acuerda.", "mn": "Existen en todos los municipios: Alcalde, Tenientes de Alcalde, Pleno y Comisión Especial de Cuentas. JGL en los de >5.000 (o si lo decide el ROM o el Pleno).", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a20"}, {"q": "La Comisión Especial de Cuentas existe en:", "o": ["Todos los municipios", "Solo existe en todos los municipios con población superior a 5.000 habitantes", "Solo existe en los municipios señalados en el Título X de la Ley de Bases de Régimen Local", "Existe en todos los municipios con población superior a 15.000 habitantes y en los de menos, cuando así lo disponga su reglamento orgánico o así lo acuerde el Pleno de su ayuntamiento"], "a": "a", "nx": 4, "ley": "LBRL", "art": "20", "cl": "Alcalde, Tenientes y Pleno en todos; JGL en más de 5.000 o si se acuerda.", "mn": "Existen en todos los municipios: Alcalde, Tenientes de Alcalde, Pleno y Comisión Especial de Cuentas. JGL en los de >5.000 (o si lo decide el ROM o el Pleno).", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a20"}, {"q": "Las Comunidades Autónomas podrán ampliar sucesivamente sus competencias dentro del marco establecido en el artículo 149 de la Constitución:", "o": ["Transcurridos 3 años y mediante la reforma de sus Estatutos", "Transcurridos 5 años y mediante la reforma de sus Estatutos", "Transcurridos 2 años y mediante la reforma de sus Estatutos", "Mediante la reforma de sus Estatutos, una vez asumidas las competencias básicas o transcurridos 2 años"], "a": "b", "nx": 4, "ley": "CE", "art": "149", "cl": "Lista exclusiva; cláusula residual; prevalencia y supletoriedad (149.3).", "mn": "Competencias exclusivas del Estado: 32 materias. Trucos: lo «básico» y la «legislación» suelen ser del Estado (legislación laboral, mercantil, penal, procesal, civil con matices) y la «ejecución» de la CA. Las cláusulas residuales del 149.3 favorecen al Estado.", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a149"}, {"q": "Según el artículo 49 de la LRBRL, tras la aprobación inicial de la una Ordenanza local se establecerá el siguiente trámite:", "o": ["Información pública y audiencia a los interesados por el plazo mínimo de 20 días para la presentación de reclamaciones y sugerencias", "Consulta pública previa a través del portal web de la Administración por el plazo mínimo de 20 días", "Información pública y audiencia a los interesados por el plazo máximo de 30 días para la presentación de reclamaciones y sugerencias", "Información pública y audiencia a los interesados por el plazo mínimo de 30 días para la presentación de reclamaciones y sugerencias"], "a": "d", "nx": 4, "ley": "LBRL", "art": "49", "cl": "Inicial Pleno + 30 días + definitiva Pleno; sin reclamaciones, automática.", "mn": "Ordenanzas «I-30-D»: aprobación Inicial por el Pleno, información pública 30 días MÍNIMO, aprobación Definitiva por el Pleno. Si no hay reclamaciones, el acuerdo provisional pasa a definitivo automáticamente. Entran en vigor tras publicar el texto íntegro en el BOP y transcurrir 15 días hábiles (art. 70.2 y 65.2).", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a49"}, {"q": "Según el artículo 47 de la LPACAP 39/2015, son nulos de pleno derecho aquellos actos que:", "o": ["Restrinjan los derechos y libertades de cualquier tipo", "Los dictados por órgano jerárquicamente incompetente", "Los actos expresos o presuntos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición", "Los que tengan un contenido excesivo"], "a": "c", "nx": 4, "ley": "LPAC", "art": "47", "cl": "Lesionen derechos susceptibles de amparo; órgano manifiestamente incompetente por materia o territorio; contenido imposible; constitutivos de infracción penal; prescindiendo total y absolutamente del procedimiento o de las normas de órganos colegiados; facultades sin requisitos esenciales; otros por ley. Disposiciones nulas (47.2).", "mn": "Nulidad = «DOCE PEO»: Derechos de amparo · Órgano manifiestamente incompetente por MATERIA o TERRITORIO (¡jerarquía NO, eso es anulable!) · Contenido imposible · Delito · Prescindir TOTAL y absolutamente del procedimiento · Facultades sin requisitos Esenciales · Otros por Ley. Las disposiciones (47.2) también son nulas si vulneran la CE, leyes o normas superiores, regulan materias reservadas a ley o establecen retroactividad sancionadora desfavorable.", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a47"}, {"q": "Según el artículo 69.4 de la LPACAP 39/2015, la inexactitud, falsedad u omisión, de carácter esencial, de cualquier dato o información que se incorpore a una declaración responsable o a una comunicación, determinará la imposibilidad de continuar el ejercicio al derecho o actividad:", "o": ["Desde el día siguiente en el que se tenga constancia de tales hechos", "Desde el momento de requerimiento de la administración debidamente notificado", "Desde el momento en que se tenga constancia de tales hechos", "Ninguna respuesta anterior es correcta"], "a": "c", "nx": 4, "ley": "LPAC", "art": "69", "cl": "Declaración responsable: el interesado manifiesta bajo su responsabilidad que cumple los requisitos y dispone de documentación. Comunicación: pone en conocimiento datos. Permiten el ejercicio desde su presentación. Inexactitud esencial: impide continuar.", "mn": "Declaración responsable = «CUMPLO y lo TENGO»; Comunicación = «te AVISO». Ambas habilitan desde el día de su PRESENTACIÓN. Falsedad o inexactitud ESENCIAL: cese de la actividad y posible imposibilidad de pedir lo mismo durante el tiempo que fije la ley.", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a69"}, {"q": "Según el Artículo 107 de la Ley 39/2015, la declaración de lesividad:", "o": ["Es susceptible de recurso de reposición, sin perjuicio de su examen como presupuesto procesal de admisibilidad, en el plazo de un mes desde que se notifique a los interesados", "Es susceptible de recurso de alzada, sin perjuicio de su examen como presupuesto procesal de admisibilidad, en el plazo de un mes desde que se notifique a los interesados", "No es susceptible de recurso en vía administrativa, pero debe notificarse a los interesados en el procedimiento", "No es susceptible de recurso en vía administrativa, si bien podrá notificarse a los interesados a los meros efectos informativos"], "a": "d", "nx": 4, "ley": "LPAC", "art": "107", "cl": "Actos favorables anulables: declaración de lesividad para impugnarlos en el contencioso. Dentro de 4 años; audiencia; 6 meses o caducidad. No recurrible. Entidades locales: el Pleno o el órgano colegiado superior.", "mn": "Lesividad «4-6-NR»: solo para actos FAVORABLES y ANULABLES. Plazo de 4 años desde que se dictó; caducidad a los 6 meses desde la iniciación; la declaración No es Recurrible. Exige audiencia previa. En entidades locales la declara el PLENO (o el órgano colegiado superior).", "donde": "Alicante, Crevillent", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a107"}, {"q": "En su artículo 9, la Constitución garantiza:", "o": ["La libertad", "La soberanía nacional", "La unidad indisoluble de la Nación española", "La jerarquía normativa"], "a": "d", "nx": 4, "ley": "CE", "art": "9", "cl": "7 principios: legalidad, jerarquía, publicidad, irretroactividad, seguridad jurídica, responsabilidad, interdicción de la arbitrariedad.", "mn": "9.3 = «LE-JE-PU-IRRE-SE-RE-IN» (7 principios): LEgalidad, JErarquía normativa, PUblicidad de las normas, IRREtroactividad de las sancionadoras no favorables o restrictivas, SEguridad jurídica, REsponsabilidad e INterdicción de la arbitrariedad de los poderes públicos. Ojo: la «eficacia» NO está (es del art. 103).", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a9"}, {"q": "La Constitución Española garantiza conforme establece el artículo 9.3, el principio de:", "o": ["Retroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales", "Interdicción de la arbitrariedad de los poderes públicos", "Descentralización", "Eficacia"], "a": "b", "nx": 4, "ley": "CE", "art": "9", "cl": "7 principios: legalidad, jerarquía, publicidad, irretroactividad, seguridad jurídica, responsabilidad, interdicción de la arbitrariedad.", "mn": "9.3 = «LE-JE-PU-IRRE-SE-RE-IN» (7 principios): LEgalidad, JErarquía normativa, PUblicidad de las normas, IRREtroactividad de las sancionadoras no favorables o restrictivas, SEguridad jurídica, REsponsabilidad e INterdicción de la arbitrariedad de los poderes públicos. Ojo: la «eficacia» NO está (es del art. 103).", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a9"}, {"q": "Según el artículo 149.1 de la Constitución Española, es competencia exclusiva del Estado:", "o": ["Sanidad e Higiene", "Asistencia Social", "Todas son competencias exclusivas del Estado", "Hacienda general y Deuda del Estado"], "a": "d", "nx": 4, "ley": "CE", "art": "149", "cl": "Lista exclusiva; cláusula residual; prevalencia y supletoriedad (149.3).", "mn": "Competencias exclusivas del Estado: 32 materias. Trucos: lo «básico» y la «legislación» suelen ser del Estado (legislación laboral, mercantil, penal, procesal, civil con matices) y la «ejecución» de la CA. Las cláusulas residuales del 149.3 favorecen al Estado.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a149"}, {"q": "Según el artículo 24 de la Ley 39/2015, de 1 de octubre, el silencio administrativo:", "o": ["Tendrá efecto desestimatorio en los procedimientos que impliquen actividades que puedan dañar el medio ambiente", "Tendrá efecto estimatorio cuando el procedimiento tenga por objeto el acceso a actividades o su ejercicio", "Tendrá efecto estimatorio en los procedimientos relativos al ejercicio del derecho de petición, al que se refiere el artículo 29 de la Constitución", "Tendrá efectos estimatorios en los procedimientos de responsabilidad patrimonial de las administraciones públicas"], "a": "a", "nx": 4, "ley": "LPAC", "art": "24", "cl": "Regla: estimatorio. Desestimatorio: derecho de petición, transferencia de facultades de dominio o servicio público, medio ambiente, responsabilidad patrimonial, impugnación de actos y revisión de oficio. Estimatorio en alzada contra silencio. El estimatorio es acto finalizador; el desestimatorio solo permite recurrir.", "mn": "Silencio en procedimientos a solicitud: ESTIMATORIO por regla. Desestimatorio en «PeDoMaReReRe»: PEtición, DOminio y servicio público, Medio Ambiente, REsponsabilidad patrimonial, REcursos (impugnación) y REvisión de oficio. Excepción doble: en el recurso de alzada contra un silencio previo, el silencio es estimatorio.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a24"}, {"q": "Según lo establecido en el artículo 47 de la Ley de Procedimiento Administrativo Común de las Administraciones Públicas, serán nulas de pleno derecho las disposiciones administrativas (señala la incorrecta):", "o": ["Que vulneren la Constitución", "Que vulneren las leyes u otras disposiciones administrativas de rango superior", "Que establezca la irretroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales", "Que establezca la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales"], "a": "d", "nx": 4, "ley": "LPAC", "art": "47", "cl": "Lesionen derechos susceptibles de amparo; órgano manifiestamente incompetente por materia o territorio; contenido imposible; constitutivos de infracción penal; prescindiendo total y absolutamente del procedimiento o de las normas de órganos colegiados; facultades sin requisitos esenciales; otros por ley. Disposiciones nulas (47.2).", "mn": "Nulidad = «DOCE PEO»: Derechos de amparo · Órgano manifiestamente incompetente por MATERIA o TERRITORIO (¡jerarquía NO, eso es anulable!) · Contenido imposible · Delito · Prescindir TOTAL y absolutamente del procedimiento · Facultades sin requisitos Esenciales · Otros por Ley. Las disposiciones (47.2) también son nulas si vulneran la CE, leyes o normas superiores, regulan materias reservadas a ley o establecen retroactividad sancionadora desfavorable.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a47"}, {"q": "Según el artículo 48 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, indica qué actos o disposiciones son anulables:", "o": ["Los actos expresos o presuntos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición", "Los actos de la Administración que incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder", "Las disposiciones administrativas que establezcan la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales", "Los dictados por órgano manifiestamente incompetente por razón de la materia o del territorio"], "a": "b", "nx": 4, "ley": "LPAC", "art": "48", "cl": "Cualquier infracción del ordenamiento, incluso la desviación de poder. Defecto de forma: solo si falta un requisito indispensable para el fin o causa indefensión. Fuera de plazo: solo si lo impone la naturaleza del término.", "mn": "Anulabilidad: cualquier infracción, INCLUIDA la desviación de poder. El defecto de forma solo si impide el fin o causa indefensión. La actuación fuera de plazo solo si lo impone la naturaleza del plazo.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a48"}, {"q": "Según el artículo 47 de la Ley que rige el Procedimiento Administrativo Común de las Administraciones Públicas, ¿cuál de las siguientes respuestas NO se corresponde con actos nulos de pleno derecho?:", "o": ["Los dictados por órgano manifiestamente incompetente por razón de la materia o del territorio", "Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta", "Los actos de la Administración que incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder", "Los dictados prescindiendo total y absolutamente del procedimiento legalmente establecido"], "a": "c", "nx": 4, "ley": "LPAC", "art": "47", "cl": "Lesionen derechos susceptibles de amparo; órgano manifiestamente incompetente por materia o territorio; contenido imposible; constitutivos de infracción penal; prescindiendo total y absolutamente del procedimiento o de las normas de órganos colegiados; facultades sin requisitos esenciales; otros por ley. Disposiciones nulas (47.2).", "mn": "Nulidad = «DOCE PEO»: Derechos de amparo · Órgano manifiestamente incompetente por MATERIA o TERRITORIO (¡jerarquía NO, eso es anulable!) · Contenido imposible · Delito · Prescindir TOTAL y absolutamente del procedimiento · Facultades sin requisitos Esenciales · Otros por Ley. Las disposiciones (47.2) también son nulas si vulneran la CE, leyes o normas superiores, regulan materias reservadas a ley o establecen retroactividad sancionadora desfavorable.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a47"}, {"q": "Según el artículo 40 de la Ley 39/2015, de 1 de octubre, toda notificación deberá contener:", "o": ["El texto íntegro de la resolución", "Indicación de si pone fin o no a la vía administrativa", "La expresión de los recursos que procedan", "Todas son correctas"], "a": "d", "nx": 4, "ley": "LPAC", "art": "40", "cl": "Se notifican las resoluciones y actos que afecten a derechos e intereses, en 10 días desde que se dictan, con texto íntegro, si pone fin a la vía administrativa, recursos, órgano y plazo. Notificación defectuosa: efectos desde que el interesado se da por enterado. Basta el intento con texto íntegro para cumplir el plazo máximo.", "mn": "Notificación «10 días»: se cursa dentro de los 10 días desde que se dicta el acto. Contiene el texto íntegro, si pone fin a la vía administrativa, los recursos, el órgano y el plazo. Notificación defectuosa = efectos desde que el interesado se da por enterado. Para cumplir el plazo de resolver basta el INTENTO de notificación debidamente acreditado.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a40"}, {"q": "Según lo establecido en el artículo 69 de la Ley de Procedimiento Administrativo Común de las Administraciones Públicas, respecto a la declaración responsable, las Administraciones podrán requerir que se aporte la documentación que acredite el cumplimiento de los requisitos para obtener el reconocimiento de un derecho o facultad para su ejercicio:", "o": ["Durante la fase de ordenación y el interesado deberá aportarla", "En cualquier momento y el interesado deberá aportarla", "En cualquier momento y el interesado podrá no aportarla", "Durante la fase de ordenación y el interesado podrá no aportarla"], "a": "b", "nx": 4, "ley": "LPAC", "art": "69", "cl": "Declaración responsable: el interesado manifiesta bajo su responsabilidad que cumple los requisitos y dispone de documentación. Comunicación: pone en conocimiento datos. Permiten el ejercicio desde su presentación. Inexactitud esencial: impide continuar.", "mn": "Declaración responsable = «CUMPLO y lo TENGO»; Comunicación = «te AVISO». Ambas habilitan desde el día de su PRESENTACIÓN. Falsedad o inexactitud ESENCIAL: cese de la actividad y posible imposibilidad de pedir lo mismo durante el tiempo que fije la ley.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a69"}, {"q": "De conformidad con lo indicado en el artículo 68 de la Ley 39/2015, de 1 de octubre, al interesado que, una vez transcurrido el plazo otorgado en el requerimiento, no subsane la solicitud:", "o": ["Se le aplicará la tramitación simplificada y se dictará resolución desestimatoria", "Se le tendrá por desistido en su petición sin necesidad de previa resolución", "Se le tendrá por decaído en su derecho al trámite y el procedimiento continuará", "Se le tendrá por desistido en su petición previa resolución"], "a": "c", "nx": 4, "ley": "LPAC", "art": "68", "cl": "10 días para subsanar; si no, desistido previa resolución. Ampliable hasta 5 días más (no en selectivos ni concurrencia competitiva). Presentación presencial de obligados: subsanar por vía electrónica.", "mn": "Subsanación: «10 + 5» días (los 5 de ampliación NO en selectivos ni concurrencia competitiva). Si no se subsana = DESISTIDO, previa resolución. Si un obligado presenta en papel: se le requiere subsanar electrónicamente y la fecha válida es la de la subsanación.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a68"}, {"q": "Constituye un ingreso de derecho privado, para las Administraciones Públicas:", "o": ["El producto de las multas y sanciones", "Los percibidos en concepto de precios públicos", "Las adquiridos a título de herencia", "Las subvenciones"], "a": "c", "nx": 4, "ley": "TRLRHL", "art": "2", "cl": "Lista a)–h): patrimonio, tributos, participaciones, subvenciones, precios públicos, crédito, multas…", "mn": "Recursos de las haciendas locales «PA-TRI-PAR-SUB-PRE-CRE-MUL-DEMÁS»: PAtrimonio, TRIbutos propios y recargos, PARticipaciones, SUBvenciones, PREcios públicos, CRÉditos, MULtas y demás prestaciones de Derecho público.", "donde": "Alicante, Canet, Examen test auxiliares corregido CdB Majo", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a2"}, {"q": "Según el art. 49 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases de Régimen Local, una vez aprobadas inicialmente las Ordenanzas, ¿durante qué plazo mínimo deben exponerse al público?", "o": ["Cuarenta y cinco días hábiles", "Treinta días (art 49 LBRL)", "Un mes", "Quince días naturales"], "a": "b", "nx": 4, "ley": "LBRL", "art": "49", "cl": "Inicial Pleno + 30 días + definitiva Pleno; sin reclamaciones, automática.", "mn": "Ordenanzas «I-30-D»: aprobación Inicial por el Pleno, información pública 30 días MÍNIMO, aprobación Definitiva por el Pleno. Si no hay reclamaciones, el acuerdo provisional pasa a definitivo automáticamente. Entran en vigor tras publicar el texto íntegro en el BOP y transcurrir 15 días hábiles (art. 70.2 y 65.2).", "donde": "Alicante, Manises", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a49"}, {"q": "Según el artículo 27 de la Ley 7/1985, de 2 de Abril, Reguladora de las Bases de Régimen Local, la delegación de competencias del Estado y las Comunidades Autónomas a los municipios no podrá ser inferior a:", "o": ["5 años", "4 años", "10 años", "7 años"], "a": "a", "nx": 4, "ley": "LBRL", "art": "27", "cl": "El Estado y las CCAA pueden delegar competencias en los municipios; mínimo 5 años; con financiación.", "mn": "Delegación «5-F»: duración mínima de 5 AÑOS y siempre con FINANCIACIÓN suficiente. La Administración que delega conserva la dirección y el control.", "donde": "Alicante, Manises", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a27"}, {"q": "La Constitución g do con lo estipulado en el artículo 125.2 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿Qué plazo está establecido para interponer el recurso extraordinario de revisión cuando se trate de la causa a) del artículo 125.1?", "o": ["Tres meses siguientes a la fecha de la notificación de la resolución impugnada.", "Un año siguiente a la fecha de la notificación de la resolución impugnada.", "Dos años siguientes a la fecha de la notificación de la resolución impugnada.", "Cuatro años siguientes a la fecha de la notificación de la resolución impugnada."], "a": "d", "nx": 4, "ley": "LPAC", "art": "125", "cl": "Contra actos firmes, ante el mismo órgano: error de hecho que resulte de documentos del expediente (4 años desde la notificación); documentos de valor esencial; documentos o testimonios declarados falsos por sentencia firme; prevaricación, cohecho, violencia u otra conducta punible por sentencia firme (3 meses).", "mn": "Recurso extraordinario de revisión «E-D-F-P»: Error de hecho (4 años), Documentos esenciales nuevos, Falsedad declarada en sentencia, Prevaricación o cohecho declarados en sentencia (en estos tres, 3 meses desde el conocimiento o la firmeza). Solo contra actos FIRMES y ante el mismo órgano.", "donde": "EXAMEN AYUNTAMIENTO DE ZAMORA - C2 2023 Libre, EXAMEN AYUNTAMIENTO DE ZAMORA - C2 2023 Libre (1), MODELO 1 AUXILIAR ADMINISTRATIVO (TURNO LIBRE Y DISCAPACITADOS), MODELO 2 AUXILIAR ADMINISTRATIVO", "fallo": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a125"}, {"q": "De acuerdo con la Ley 19/2013, ¿cuál de las siguientes materias NO constituye un límite en la aplicación del principio de publicidad activa?", "o": ["El secreto profesional y la propiedad intelectual e industrial.", "La garantía de la confidencialidad o el secreto requerido en los procesos de toma de decisión.", "Los intereses económicos y comerciales.", "La información relativa al grado de cumplimiento y cal
