 su ocupación de la vivienda:", "o": ["Se le deberá exigir la autorización por escrito de la persona propietaria del domicilio.", "Se le deberá exigir la autorización por escrito de todas las personas mayores de edad que figuren empadronadas en ese domicilio.", "Se le deberá exigir la autorización por escrito de una persona mayor de edad que figure empadronada en ese domicilio. La persona que autorice deberá disponer de algún título acreditativo de la posesión efectiva de la vivienda (propiedad, alquiler...) a nombre de la misma.", "Se le deberá exigir la autorización por escrito de una persona mayor de edad que figure empadronada en ese domicilio. La persona que autorice no deberá disponer necesariamente de ningún título acreditativo de la posesión efectiva de la vivienda (propiedad, alquiler...) a nombre de la misma."], "a": "c", "nx": 4, "ley": "LBRL", "art": "17", "cl": "Ayuntamiento; Diputaciones si no tienen capacidad; Consejo de Empadronamiento.", "mn": "Padrón = «lo hace el AYUNTAMIENTO, lo coordina el INE». Formación, mantenimiento, revisión y custodia: Ayuntamiento (Diputaciones si no puede). Discrepancias INE–Ayuntamiento → Consejo de Empadronamiento (adscrito al Ministerio, presidido por el Presidente del INE).", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a17"}, {"q": "Según el artículo 54.2 del Real Decreto 1690/1986, de 11 de julio, por el que se aprueba el Reglamento de Población y Demarcación Territorial de las Entidades Locales:", "o": ["Las personas menores de edad emancipadas tendrán la misma vecindad que los padres que tengan su guarda y custodia o, en su defecto, de sus representantes legales, salvo autorización por escrito de éstos para residir en otro domicilio o municipio.", "Las personas menores de edad no emancipadas tendrán la misma vecindad que los padres que tengan su guarda y custodia o, en su defecto, de sus representantes legales, salvo autorización por escrito de éstos para residir en otro domicilio o municipio.", "Las personas menores de edad no emancipadas tendrán la misma vecindad que los padres, tengan o no su guarda y custodia o, en su defecto, de sus representantes legales, salvo autorización por escrito de éstos para residir en otro domicilio o municipio.", "Todas las anteriores son falsas."], "a": "b", "nx": 4, "ley": "ROF", "art": "221", "cl": "", "mn": "", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art221"}, {"q": "Según el artículo 61 del Real Decreto 1690/1986, de 11 de julio, por el que se aprueba el Reglamento de Población y Demarcación Territorial de las Entidades Locales, los Ayuntamientos podrán expedir volantes de empadronamiento:", "o": ["Como documentos de carácter administrativo en los que no serán necesarias las formalidades previstas para las certificaciones.", "Como documentos de carácter administrativo en los que serán necesarias las formalidades previstas para las certificaciones.", "Como documentos de carácter puramente informativo en los que no serán necesarias las formalidades previstas para las certificaciones.", "Como documentos de carácter puramente informativo en los que serán necesarias las formalidades previstas para las certificaciones."], "a": "c", "nx": 4, "ley": "LBRL", "art": "17", "cl": "Ayuntamiento; Diputaciones si no tienen capacidad; Consejo de Empadronamiento.", "mn": "Padrón = «lo hace el AYUNTAMIENTO, lo coordina el INE». Formación, mantenimiento, revisión y custodia: Ayuntamiento (Diputaciones si no puede). Discrepancias INE–Ayuntamiento → Consejo de Empadronamiento (adscrito al Ministerio, presidido por el Presidente del INE).", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a17"}, {"q": "Según el artículo 56.2 del Real Decreto 1690/1986, de 11 de julio, por el que se aprueba el Reglamento de Población y Demarcación Territorial de las Entidades Locales, la inscripción de los extranjeros en el padrón municipal:", "o": ["No constituirá prueba de su residencia legal en España ni les atribuirá ningún derecho que no les confiera la legislación vigente, salvo lo dispuesto en materia de educación y sanidad.", "No constituirá prueba de su residencia legal en España ni les atribuirá ningún derecho que no les confiera la legislación vigente, especialmente en materia de derechos y libertades de los extranjeros en España.", "No constituirá prueba de su residencia legal en España ni les atribuirá ningún derecho que no les confiera la legislación vigente, especialmente en materia de educación y sanidad.", "No constituirá prueba de su residencia legal en España ni les atribuirá ningún derecho que no les confiera la legislación vigente, salvo lo dispuesto en materia de derechos fundamentales."], "a": "b", "nx": 4, "ley": "Ley 8/2010 CV", "art": "25", "cl": "", "mn": "", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2010-11729#a25"}, {"q": "Según el artículo 41.1 del Real Decreto 2568/1986, de 28 de noviembre, por el que se aprueba el Reglamento de Organización, Funcionamiento y Régimen Jurídico de las Entidades Locales, el alcalde ostenta la atribución de:", "o": ["Representar al Ayuntamiento y presidir todos los actos públicos que se celebren en el término municipal, sin perjuicio de lo que apruebe el Pleno al inicio del mandato corporativo.", "Representar al Ayuntamiento y presidir todos los actos públicos que se celebren en el término municipal, sin perjuicio de lo dispuesto en el Reglamento de Protocolo.", "Representar al Ayuntamiento y presidir todos los actos públicos que se celebren en el término municipal, sin perjuicio de lo dispuesto en el Reglamento Orgánico Municipal.", "Todas las anteriores son falsas."], "a": "b", "nx": 4, "ley": "ROF", "art": "41", "cl": "Alcalde: representa al Ayuntamiento y preside todos los actos públicos del municipio; convoca y preside las sesiones; dirige el gobierno.", "mn": "«El Alcalde REPRESENTA y PRESIDE todo».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art41"}, {"q": "Según el artículo 47.2 del Real Decreto 2568/1986, de 28 de noviembre, por el que se aprueba el Reglamento de Organización, Funcionamiento y Régimen Jurídico de las Entidades Locales, en los casos de ausencia, enfermedad o impedimento, las funciones del Alcalde no podrán ser asumidas por el Teniente de Alcalde a quien corresponda sin expresa delegación, que reunirá los requisitos de los números 1 y 2 del artículo 44. No obstante lo dispuesto en el párrafo anterior:", "o": ["Cuando el Alcalde se ausente del territorio nacional por más de veinticuatro horas, sin haber conferido la delegación, o cuando por causa imprevista le hubiere resultado imposible otorgarla, le sustituirá, en la totalidad de sus funciones, el Teniente de Alcalde a quien corresponda, dando cuenta al resto de la Corporación.", "Cuando el Alcalde se ausente del territorio nacional por más de cuarenta y ocho horas, sin haber conferido la delegación, o cuando por causa imprevista le hubiere resultado imposible otorgarla, le sustituirá, en la totalidad de sus funciones, el Teniente de Alcalde a quien corresponda, dando cuenta al resto de la Corporación.", "Cuando el Alcalde se ausente del término municipal por más de veinticuatro horas, sin haber conferido la delegación, o cuando por causa imprevista le hubiere resultado imposible otorgarla, le sustituirá, en la totalidad de sus funciones, el Teniente de Alcalde a quien corresponda, dando cuenta al resto de la Corporación.", "Cuando el Alcalde se ausente del término municipal por más de cuarenta y ocho horas, sin haber conferido la delegación, o cuando por causa imprevista le hubiere resultado imposible otorgarla, le sustituirá, en la totalidad de sus funciones, el Teniente de Alcalde a quien corresponda, dando cuenta al resto de la Corporación."], "a": "c", "nx": 4, "ley": "ROF", "art": "47", "cl": "Sustitución del Alcalde por los tenientes de alcalde por orden de nombramiento; si se ausenta más de 24 horas sin delegar, lo sustituye el teniente que corresponda.", "mn": "«Más de 24 h fuera sin delegar = entra el TENIENTE».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art47"}, {"q": "Según el artículo 113.1.c) del Real Decreto 2568/1986, de 28 de noviembre, por el que se aprueba el Reglamento de Organización, Funcionamiento y Régimen Jurídico de las Entidades Locales, para la válida constitución de la Junta de Gobierno Local se requiere la asistencia de:", "o": ["La mayoría absoluta de sus componentes. Si no existiera quórum, se constituirá en segunda convocatoria, una hora después de la señalada para la primera, siendo suficiente la asistencia de la cuarta parte de sus miembros y, en todo caso, un número no inferior a tres.", "Un tercio de sus componentes. Si no existiera quórum, se constituirá en segunda convocatoria, una hora después de la señalada para la primera, siendo suficiente la asistencia de la tercera parte de sus miembros y, en todo caso, un número no inferior a tres.", "La mayoría absoluta de sus componentes. Si no existiera quórum, se constituirá en segunda convocatoria, una hora después de la señalada para la primera, siendo suficiente la asistencia de la tercera parte de sus miembros y, en todo caso, un número no inferior a tres.", "Un tercio de sus componentes. Si no existiera quórum, se constituirá en segunda convocatoria, una hora después de la señalada para la primera, siendo suficiente la asistencia de la cuarta parte de sus miembros y, en todo caso, un número no inferior a tres."], "a": "c", "nx": 4, "ley": "ROF", "art": "113", "cl": "Junta de Gobierno Local: en primera convocatoria, mayoría absoluta; si no hay quórum, en segunda una hora después con un tercio y no menos de tres.", "mn": "«JGL: mayoría absoluta; si no, 1 HORA después con 1/3 (mín. 3)».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art113"}, {"q": "Según el artículo 125.a) del Real Decreto 2568/1986, de 28 de noviembre, por el que se aprueba el Reglamento de Organización, Funcionamiento y Régimen Jurídico de las Entidades Locales, respecto a las comisiones informativas:", "o": ["El Alcalde o Presidente de la Corporación, es el Presidente nato de todas ellas; sin embargo, la Presidencia efectiva podrá delegarla en cualquier miembro de la Corporación, a propuesta de la propia Comisión, tras la correspondiente elección efectuada en su seno.", "El Alcalde o Presidente de la Corporación, es el Presidente nato de todas ellas; sin embargo, la Presidencia efectiva podrá delegarla en cualquier miembro de la Corporación miembro de la comisión informativa respectiva.", "El presidente de la comisión informativa será designado por sus componentes por mayoría absoluta.", "El presidente de la comisión informativa será designado por sus componentes por mayoría simple."], "a": "a", "nx": 4, "ley": "ROF", "art": "125", "cl": "Comisiones informativas: el Alcalde o Presidente es el presidente nato de todas ellas, aunque puede delegar.", "mn": "«Alcalde = presidente NATO de las comisiones».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art125"}, {"q": "Según el artículo 127.3 del Real Decreto 2568/1986, de 28 de noviembre, por el que se aprueba el Reglamento de Organización, Funcionamiento y Régimen Jurídico de las Entidades Locales, respecto a la Comisión Especial de Cuentas:", "o": ["Bien a través del reglamento orgánico o mediante acuerdo adoptado por el Pleno de la Corporación, la Comisión Especial de Cuentas podrá actuar como Comisión informativa permanente para los asuntos relativos a economía y hacienda de la entidad.", "Solo a través del reglamento orgánico, la Comisión Especial de Cuentas podrá actuar como Comisión informativa permanente para los asuntos relativos a economía y hacienda de la entidad.", "Solo mediante acuerdo adoptado por el Pleno de la Corporación por mayoría absoluta, la Comisión Especial de Cuentas podrá actuar como Comisión informativa permanente para los asuntos relativos a economía y hacienda de la entidad.", "Solo mediante acuerdo adoptado por el Pleno de la Corporación por mayoría simple, la Comisión Especial de Cuentas podrá actuar como Comisión informativa permanente para los asuntos relativos a economía y hacienda de la entidad."], "a": "a", "nx": 4, "ley": "ROF", "art": "127", "cl": "Comisión Especial de Cuentas: examen, estudio e informe de todas las cuentas presupuestarias y extrapresupuestarias que debe aprobar el Pleno.", "mn": "«Cuentas → Comisión Especial → Pleno».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art127"}, {"q": "Según el artículo 236.4 del Real Decreto 2568/1986, de 28 de noviembre, por el que se aprueba el Reglamento de Organización, Funcionamiento y Régimen Jurídico de las Entidades Locales, el Registro Municipal de Asociaciones Vecinales:", "o": ["Se llevará en la Alcaldía y sus datos serán públicos.", "Se llevará en la Alcaldía y sus datos no serán públicos.", "Se llevará en la Secretaría General de la Corporación y sus datos serán públicos.", "Se llevará en la Secretaría General de la Corporación y sus datos no serán públicos."], "a": "c", "nx": 4, "ley": "ROF", "art": "236", "cl": "Registro de intereses de los concejales: en la Secretaría General.", "mn": "«Intereses de los concejales: en SECRETARÍA».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art236"}, {"q": "Según el artículo 10.1.d) del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el Texto Refundido de la Ley del Estatuto Básico del Empleado Público (TREBEP), ¿cuál es el plazo máximo permitido para el nombramiento de personal funcionario interino por exceso o acumulación de tareas?", "o": ["Un máximo de seis meses, dentro de un período de doce meses.", "Un máximo de nueve meses, dentro de un período de dieciocho meses.", "Un máximo de doce meses, dentro de un período de veinticuatro meses.", "Un máximo de tres años sin posibilidad de ampliación."], "a": "b", "nx": 4, "ley": "TREBEP", "art": "10", "cl": "1. Son funcionarios interinos los que, por razones expresamente justificadas de necesidad y urgencia, son nomb", "mn": "Interinos «V-S-P-E»: Vacante (máximo 3 años), Sustitución, Programas (3 años + 12 meses), Exceso o acumulación de tareas (9 meses dentro de 18).", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a10"}, {"q": "Conforme al artículo 70.1 del TREBEP, ¿cuál es el plazo improrrogable establecido para la ejecución de la Oferta de Empleo Público o instrumento similar a partir de su publicación?", "o": ["Un año.", "Dos años.", "Tres años.", "Cuatro años."], "a": "c", "nx": 4, "ley": "TREBEP", "art": "70", "cl": "OEP: necesidades de personal de nuevo ingreso con asignación presupuestaria; aprobación anual por los órganos de gobierno; publicación en el diario oficial; ejecución en plazo improrrogable de 3 años.", "mn": "«OEP = 1 año para aprobar, 3 para ejecutar». Solo plazas con dinero (asignación presupuestaria).", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a70"}, {"q": "De acuerdo con el artículo 74 del TREBEP, no forma parte del contenido mínimo que deben comprender las relaciones de puestos de trabajo (RPT) u otros instrumentos organizativos similares:", "o": ["El plan de formación asociado.", "La denominación de los puestos.", "Los grupos de clasificación profesional.", "Las retribuciones complementarias."], "a": "a", "nx": 4, "ley": "TREBEP", "art": "74", "cl": "Las AAPP se estructuran mediante relaciones de puestos de trabajo (RPT) u otros instrumentos: denominación, grupos, cuerpos o escalas, sistemas de provisión y retribuciones complementarias. Son públicas.", "mn": "RPT = «DNI del puesto»: nombre, grupo, cuerpo, cómo se provee y cuánto cobra. Siempre pública.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a74"}, {"q": "De acuerdo con el artículo 15 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, el personal público no podrá invocar su condición para el ejercicio de actividad:", "o": ["Mercantil, industrial o profesional.", "De administración de patrimonio personal o familiar.", "De producción y creación literaria o artística.", "De colaboración u organización de congresos."], "a": "a", "nx": 4, "ley": "Ley 53/1984", "art": "15", "cl": "Actividades privadas (mercantiles, industriales o profesionales) no prohibidas, con autorización de compatibilidad.", "mn": "«Privada = mercantil, industrial o profesional, con permiso».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-151#aquince"}, {"q": "De conformidad con el artículo 16.5 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP), cuando un interesado presenta presencialmente un documento ante una oficina de asistencia en materia de registros, ¿cuál de las siguientes actuaciones se ajusta a lo previsto legalmente?", "o": ["La oficina deberá conservar el documento original en soporte papel y remitir una copia al órgano destinatario, salvo que el interesado solicite expresamente su devolución.", "La oficina deberá remitir físicamente el documento al órgano destinatario, pudiendo proceder a su digitalización cuando dicho órgano lo solicite expresamente.", "La oficina deberá incorporar directamente el documento original al expediente electrónico, conservándolo posteriormente en papel como documento integrante del expediente durante el plazo de prescripción correspondiente.", "La oficina deberá digitalizar el documento para su incorporación al expediente administrativo electrónico y, con carácter general, devolver el original al interesado."], "a": "d", "nx": 4, "ley": "LPAC", "art": "16", "cl": "Cada Administración, un Registro Electrónico General. Presentación: registro electrónico de cualquier Administración, Correos, representaciones diplomáticas y consulares, oficinas de asistencia en materia de registros y cualquier otro que establezcan las disposiciones.", "mn": "Dónde presentar «RE-CO-DI-OF»: REgistro electrónico de cualquier Administración, COrreos, DIplomáticas/consulares, OFicinas de asistencia en materia de registros y cualquier otro legal. Pagos: transferencia u otros medios. Los registros se rigen por el calendario de días inhábiles.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a16"}, {"q": "Al amparo del artículo 30.4 de la LPACAP, si el plazo se fija en meses o años:", "o": ["El plazo concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento.", "El plazo concluirá el día siguiente a aquel en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento.", "El plazo concluirá el dia anterior a aquel en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento.", "En cualquier caso, se entenderá que el plazo expira el último día del mes del año de vencimiento."], "a": "a", "nx": 4, "ley": "LPAC", "art": "30", "cl": "Horas: hábiles (todas salvo sábados, domingos y festivos), máximo 24 h. Días: hábiles salvo que se diga naturales; desde el día siguiente. Meses/años: de fecha a fecha. Último día inhábil: primer hábil siguiente. Hábil en un sitio e inhábil en otro: inhábil.", "mn": "Plazos: horas hábiles (máximo 24 h; si es más, se expresan en días). Días = HÁBILES, sin sábados, domingos ni festivos. Se cuentan desde el día SIGUIENTE. Meses y años, de fecha a fecha; si no hay día equivalente, el último del mes. Si el último día es inhábil, se prorroga al primer hábil siguiente. Si un día es hábil donde reside el interesado e inhábil en la sede del órgano (o al revés), es INHÁBIL en todo caso.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a30"}, {"q": "De conformidad con el artículo 12.2 de la LPACAP, si un interesado que no está obligado a relacionarse electrónicamente con la Administración no dispone de los medios técnicos necesarios y solicita asistencia para firmar un escrito de solicitud, ¿cómo se podrá realizar válidamente dicha firma en el procedimiento?", "o": ["Únicamente mediante la expedición presencial y gratuita de un certificado de firma digital cualificada por la propia Corporación Local.", "Podrá ser válidamente realizada por un funcionario público habilitado mediante el uso del sistema de firma electrónica del que esté dotado, siempre que el interesado se identifique ante el funcionario y preste su consentimiento expreso.", "Deberá realizar la firma de forma manuscrita sobre un dispositivo biométrico de captura de firma digitalizado en la propia oficina de asistencia en materia de registros.", "La firma del interesado no podrá ser suplida por personal público, por lo que se le exigirá presentar la solicitud en soporte papel para su posterior digitalización por la oficina de asistencia."], "a": "b", "nx": 4, "ley": "LPAC", "art": "12", "cl": "Para los no obligados del art. 14.2 y 14.3; un funcionario habilitado puede identificar o firmar por el interesado con su consentimiento expreso; registro de funcionarios habilitados.", "mn": "Funcionario habilitado: firma POR el interesado que no tiene medios, si este se identifica ante él y CONSIENTE expresamente. Solo para quien NO está obligado a la vía electrónica.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a12"}, {"q": "De acuerdo con el artículo 77.3 de la LPACAP, ¿en qué casos y bajo qué condiciones formales podrá el instructor de un procedimiento administrativo común rechazar las pruebas que propongan los interesados?", "o": ["De forma discrecional, mediante diligencia ordinaria de ordenación contra la que no cabrá recurso alguno.", "Mediante acuerdo del Pleno de la Corporación Local si el coste económico de la práctica de la prueba excede las partidas presupuestarias.", "Solo cuando las pruebas propuestas sean manifiestamente improcedentes o innecesarias, debiendo formularse dicho rechazo mediante resolución motivada.", "Cuando las pruebas no hayan sido solicitadas de manera expresa en el escrito inicial de solicitud o subsanación de deficiencias."], "a": "c", "nx": 4, "ley": "LPAC", "art": "77", "cl": "Cualquier medio admisible en Derecho. Período de prueba no superior a 30 días ni inferior a 10. Extraordinario: no superior a 10 días. Rechazo motivado solo si son improcedentes o innecesarias.", "mn": "Prueba «10-30 + 10»: período ordinario entre 10 y 30 días; extraordinario hasta 10 días. Rechazo de pruebas: resolución MOTIVADA. Los hechos de sentencias penales firmes vinculan.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a77"}, {"q": "De acuerdo con el artículo 122 de la LPACAP, ¿cuál de las siguientes afirmaciones es correcta en relación con el recurso de alzada?", "o": ["El plazo para su interposición será de tres meses si el acto fuera expreso.", "El plazo máximo para dictar y notificar su resolución será de un mes.", "Contra la resolución de un recurso de alzada no cabrá ningún otro recurso administrativo, salvo el recurso extraordinario de revisión, en los casos establecidos en el artículo 125.1.", "Si el acto no fuera expreso, el recurso de alzada deberá interponerse en el plazo de un mes desde que se produzcan los efectos del silencio administrativo."], "a": "c", "nx": 4, "ley": "LPAC", "art": "122", "cl": "Acto expreso: 1 mes. Si no es expreso: en cualquier momento desde el día siguiente al silencio. Resolución y notificación: 3 meses; silencio desestimatorio (salvo 24.1). Contra su resolución no cabe otro recurso administrativo salvo el extraordinario de revisión.", "mn": "Alzada «1-3»: 1 MES para interponer (sin plazo si no hay acto expreso), 3 MESES para resolver. Tras la alzada, solo el EXTRAORDINARIO de revisión.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a122"}, {"q": "De acuerdo con el artículo 114.1 de la LPACAP, ¿cuál de las siguientes resoluciones pone fin a la vía administrativa?", "o": ["La resolución de un recurso extraordinario de revisión exclusivamente cuando sea estimatoria.", "Las resoluciones de los recursos de alzada.", "Cualquier acto de trámite que produzca indefensión.", "La resolución de un recurso potestativo de reposición únicamente cuando confirme íntegramente el acto recurrido."], "a": "b", "nx": 4, "ley": "LPAC", "art": "114", "cl": "Resoluciones de alzada; procedimientos sustitutivos; órganos sin superior jerárquico salvo ley; demás resoluciones cuando una disposición lo establezca; acuerdos finalizadores; responsabilidad patrimonial; sancionadores en que el recurso no sea posible; en la AGE, Ministros, Secretarios de Estado, etc.", "mn": "Ponen fin a la vía administrativa: resolución de ALZADA · procedimientos SUSTITUTIVOS · órgano SIN superior jerárquico · lo que diga una norma · acuerdos finalizadores · resolución de RESPONSABILIDAD PATRIMONIAL · procedimiento complementario de indemnización en sancionadores. En el Ayuntamiento: Alcalde y Pleno (art. 52 LBRL).", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a114"}, {"q": "De acuerdo con el Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales, ¿en qué Título y Capítulo se regulan los presupuestos?", "o": ["En el Título IV, Capítulo I.", "En el Título V, Capítulo I.", "En el Título VI, Capítulo I.", "En el Título VII, Capítulo I."], "a": "c", "nx": 4, "ley": "TRLRHL", "art": "DF 1", "cl": "", "mn": "", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214"}, {"q": "De acuerdo con el artículo 165.1 del RDL 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales:", "o": ["El presupuesto general atenderá al cumplimiento del principio de estabilidad.", "El presupuesto general atenderá al cumplimiento del principio de unidad.", "El presupuesto general atenderá al cumplimiento del principio de publicidad.", "El presupuesto general atenderá al cumplimiento del principio de anualidad."], "a": "a", "nx": 4, "ley": "TRLRHL", "art": "165", "cl": "Contenido del presupuesto general: estados de gastos (créditos) y de ingresos (previsiones), y bases de ejecución. Cada presupuesto se aprueba sin déficit inicial.", "mn": "«Gastos, ingresos y bases», y «nunca con déficit inicial».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a165"}, {"q": "De acuerdo con el artículo 165.1 del texto refundido de la Ley Reguladora de las Haciendas Locales, las bases de ejecución del presupuesto:", "o": ["Contendrán la adaptación de las disposiciones generales en materia de contratación a la organización y circunstancias de la propia entidad, así como aquellas otras necesarias para su acertada gestión.", "Contendrán la adaptación de las disposiciones generales en materia presupuestaria a la organización y circunstancias de la propia entidad, así como aquellas otras necesarias para su acertada gestión.", "Contendrán la adaptación de las disposiciones generales en materia de contabilidad pública local a la organización y circunstancias de la propia entidad, así como aquellas otras necesarias para su acertada gestión.", "Contendrán la adaptación de las disposiciones generales en materia tributaria y de recaudación a la organización y circunstancias de la propia entidad, así como aquellas otras necesarias para su acertada gestión."], "a": "b", "nx": 4, "ley": "TRLRHL", "art": "165", "cl": "Contenido del presupuesto general: estados de gastos (créditos) y de ingresos (previsiones), y bases de ejecución. Cada presupuesto se aprueba sin déficit inicial.", "mn": "«Gastos, ingresos y bases», y «nunca con déficit inicial».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a165"}, {"q": "De acuerdo con el artículo 169.1 del texto refundido de la Ley Reguladora de las Haciendas Locales, aprobado inicialmente el presupuesto general, se expondrá al público, previo anuncio en el boletín oficial correspondiente, por un plazo de:", "o": ["Treinta días.", "Quince días.", "Treinta días, durante los cuales y ocho más los interesados podían presentar reclamaciones, reparos u observaciones.", "Quince días, durante los cuales y ocho más los interesados podían presentar reclamaciones, reparos u observaciones."], "a": "b", "nx": 4, "ley": "TRLRHL", "art": "169", "cl": "15 días; 1 mes para resolver; antes del 31/12; prórroga automática.", "mn": "Presupuesto «15-1M-31D»: exposición pública de 15 días previo anuncio en el BOP; sin reclamaciones queda aprobado; si las hay, el Pleno tiene 1 MES para resolverlas; aprobación definitiva antes del 31 de diciembre; si no, se prorroga automáticamente el anterior.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a169"}, {"q": "Conforme al artículo 7 de la Ley 19/2013, de 9 de diciembre, de Transparencia, acceso a la información pública y buen gobierno, sobre información con relevancia jurídica, indique cual de esta información no es necesaria su publicación por parte de las Administraciones Públicas:", "o": ["Las directrices, instrucciones, acuerdos, circulares o respuestas a consultas planteadas por los particulares u otros órganos en la medida en que supongan una interpretación del Derecho o tengan efectos jurídicos.", "Las instrucciones internas firmadas por superiores jerárquicos.", "Los Anteproyectos de Ley y los proyectos de Decretos Legislativos.", "Los proyectos de Reglamentos."], "a": "b", "nx": 4, "ley": "Ley 19/2013", "art": "7", "cl": "Información de relevancia jurídica: directrices, instrucciones, acuerdos, circulares, anteproyectos de ley, proyectos de reglamento, memorias e informes.", "mn": "«Lo que interpreta el derecho, se PUBLICA».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a7"}, {"q": "En relación con el artículo 5 donde se indican los principios generales de la publicidad activa, ¿de qué forma debe publicarse la información sujeta a las obligaciones de transparencia según la Ley 19/2013?", "o": ["Exclusivamente en el Boletín Oficial del Estado o diario oficial correspondiente.", "En las correspondientes sedes electrónicas o páginas web, de manera clara, estructurada, entendible y, preferiblemente, en formatos reutilizables.", "Únicamente mediante entrega presencial tras la solicitud del interesado en las unidades de información.", "Solo en formato PDF para garantizar que la información no sea modificada por terceros."], "a": "b", "nx": 4, "ley": "Ley 19/2013", "art": "5", "cl": "Publicidad activa: en sedes electrónicas o webs, de forma clara, estructurada, entendible y preferiblemente reutilizable.", "mn": "«Publicidad activa: en la WEB, clara y reutilizable».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a5"}, {"q": "Señale la respuesta correcta. Conforme al artículo 15 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, si la información solicitada contuviera datos personales que revelen la ideología:", "o": ["El acceso únicamente se podrá autorizar en caso de que se contase con el consentimiento expreso y por escrito del afectado, a menos que dicho afectado hubiese hecho manifiestamente públicos los datos con anterioridad a que se solicitase el acceso.", "El acceso únicamente se podrá autorizar en caso de que se contase con el consentimiento expreso y por escrito del afectado, sin excepción.", "El acceso únicamente se podrá autorizar en caso de que se contase con el consentimiento expreso y por escrito o verbal del afectado.", "El acceso se podrá autorizar en caso de que se cuente con el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley."], "a": "a", "nx": 4, "ley": "Ley 19/2013", "art": "15", "cl": "Protección de datos en el acceso: datos especialmente protegidos (ideología, afiliación sindical, religión, creencias) solo con consentimiento expreso y por escrito si se hubieran hecho públicos por el afectado; los demás (salud, origen racial, vida sexual, infracciones) con consentimiento expreso o habilitación legal.", "mn": "«Ideas y fe: consentimiento POR ESCRITO»; salud y origen: consentimiento expreso o ley.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a15"}, {"q": "Según el artículo 13 de la Ley 19/2013, ¿qué se define específicamente como \"información pública\"?", "o": ["Solo los documentos administrativos que hayan sido archivados tras la finalización de un procedimiento.", "Los contenidos o documentos, en cualquier formato o soporte, que obren en poder de los sujetos obligados y que hayan sido elaborados o adquiridos en el ejercicio de sus funciones.", "Cualquier dato estadístico que se encuentre en Internet relacionado con el sector público.", "Únicamente las disposiciones normativas, directrices e instrucciones de relevancia jurídica."], "a": "b", "nx": 4, "ley": "Ley 19/2013", "art": "13", "cl": "Información pública: contenidos o documentos, en cualquier formato o soporte, en poder de los sujetos obligados, elaborados o adquiridos en el ejercicio de sus funciones.", "mn": "«Pública = lo que TIENE la Administración, sea cual sea el soporte».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a13"}, {"q": "Conforme al artículo 6 y 7 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, señale la respuesta incorrecta:", "o": ["El tratamiento de los datos personales de un menor de edad únicamente podrá fundarse en su consentimiento cuando sea mayor de dieciséis años.", "Se entiende por consentimiento del afectado toda manifestación de voluntad libre, específica, informada e inequívoca por la que este acepta, ya sea mediante una declaración o una clara acción afirmativa, el tratamiento de datos personales que le conciernen.", "Cuando se pretenda fundar el tratamiento de los datos en el consentimiento del afectado para una pluralidad de finalidades será preciso que conste de manera específica e inequívoca que dicho consentimiento se otorga para todas ellas.", "No podrá supeditarse la ejecución del contrato a que el afectado consienta el tratamiento de los datos personales para finalidades que no guarden relación con el mantenimiento, desarrollo o control de la relación contractual."], "a": "a", "nx": 4, "ley": "LOPDGDD", "art": "6", "cl": "Consentimiento: manifestación de voluntad libre, específica, informada e inequívoca, mediante declaración o clara acción afirmativa.", "mn": "«LEII»: Libre, Específica, Informada, Inequívoca.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a6"}, {"q": "Señale la respuesta correcta. Conforme al artículo 14 de la Ley Orgánica 3/2007 de 22 de marzo, para la igualdad efectiva de mujeres y hombres son los criterios generales de actuación de los poderes públicos:", "o": ["El compromiso con la efectividad del derecho constitucional de igualdad entre mujeres y hombres.", "Se fomentará el uso de un lenguaje no sexista en el ámbito administrativo.", "La participación equilibrada de mujeres y hombres en las candidaturas electorales y en la toma de decisiones.", "Todas las respuestas son correctas."], "a": "d", "nx": 4, "ley": "LO 3/2007", "art": "14", "cl": "Lista 1–12.", "mn": "Criterios de los poderes públicos (12): compromiso con la igualdad, integración en políticas, colaboración entre AA. PP., participación equilibrada, erradicación de la violencia de género, atención a colectivos vulnerables, protección de la maternidad, conciliación y corresponsabilidad, lenguaje no sexista… Truco: «los 12 mandamientos de la igualdad».", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115#a14"}, {"q": "Según el artículo 15 de la Ley Orgánica 3/2007 de 22 de marzo, para la igualdad efectiva de mujeres y hombres, ¿cómo deben integrar las Administraciones Públicas el principio de transversalidad de la igualdad de trato?", "o": ["Únicamente a través de la creación de unidades de igualdad en cada ministerio.", "Mediante la contratación de personal especializado en género en todos los departamentos.", "Integrándolo de forma activa en la adopción y ejecución de sus disposiciones normativas, en la definición y presupuestación de políticas públicas y en el desarrollo de sus actividades.", "Aplicándolo solo en aquellas políticas que afecten directamente a colectivos de mujeres."], "a": "c", "nx": 4, "ley": "LO 3/2007", "art": "15", "cl": "Informará con carácter transversal.", "mn": "TRANSVERSALIDAD («mainstreaming»): la igualdad informa de forma transversal toda la actuación pública; se integra activamente en normas, presupuestos y políticas en TODOS los ámbitos.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115#a15"}, {"q": "Según el artículo 227.2 del Real Decreto 2568/1986, de 28 de noviembre, por el que se aprueba el Reglamento de Organización, Funcionamiento y Régimen Jurídico de las Entidades Locales, a las sesiones de las comisiones informativas:", "o": ["No podrá convocarse, a los solos efectos de escuchar su parecer o recibir su informe respecto a un tema concreto, a representantes de las asociaciones o entidades a que se refiere el artículo 72 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local.", "Podrá convocarse, a los solos efectos de escuchar su parecer o recibir su informe respecto a un tema concreto, a representantes de las asociaciones o entidades a que se refiere el artículo 72 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local.", "Podrá convocarse, con carácter vinculante, a representantes de las asociaciones o entidades a que se refiere el artículo 72 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local.", "Todas las anteriores son falsas."], "a": "b", "nx": 4, "ley": "ROF", "art": "227", "cl": "", "mn": "", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art227"}, {"q": "Según establece el artículo 80.1 de la LPACAP, en la instrucción del procedimiento administrativo y salvo disposición expresa en contrario, los informes tendrán el carácter de:", "o": ["Preceptivos y vinculantes para la resolución del asunto.", "Facultativos y vinculantes.", "Facultativos y no vinculantes.", "Preceptivos y no vinculantes."], "a": "c", "nx": 4, "ley": "LPAC", "art": "80", "cl": "Facultativos y no vinculantes salvo disposición. Electrónicos. Plazo de 10 días. Si no se emite: se pueden proseguir las actuaciones salvo informe preceptivo, en cuyo caso se puede suspender (22.1.d).", "mn": "Informes «F-NV-10»: Facultativos, No Vinculantes, 10 días. Si no llega un informe PRECEPTIVO, se puede suspender el plazo de resolver (máximo 3 meses, art. 22).", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a80"}, {"q": "De acuerdo con el artículo 169.6 del texto refundido de la Ley Reguladora de las Haciendas Locales, si al iniciarse el ejercicio económico no hubiese entrado en vigor el presupuesto correspondiente:", "o": ["Se considerará automáticamente prorrogado el presupuesto del ejercicio anterior, con sus créditos definitivos, sin perjuicio de las modificaciones legalmente previstas y hasta la entrada en vigor del nuevo presupuesto.", "Se considerará automáticamente prorrogado el presupuesto del ejercicio anterior, con sus créditos iniciales, sin perjuicio de las modificaciones legalmente previstas y hasta el 31 de diciembre.", "Se considerará automáticamente prorrogado el presupuesto del ejercicio anterior, con sus créditos definitivos, sin perjuicio de las modificaciones legalmente previstas y desde el 1 de enero del ejercicio actual.", "Se considerará automáticamente prorrogado el presupuesto del ejercicio anterior, con sus créditos iniciales, sin perjuicio de las modificaciones legalmente previstas y hasta la entrada en vigor del nuevo presupuesto."], "a": "d", "nx": 4, "ley": "TRLRHL", "art": "169", "cl": "15 días; 1 mes para resolver; antes del 31/12; prórroga automática.", "mn": "Presupuesto «15-1M-31D»: exposición pública de 15 días previo anuncio en el BOP; sin reclamaciones queda aprobado; si las hay, el Pleno tiene 1 MES para resolverlas; aprobación definitiva antes del 31 de diciembre; si no, se prorroga automáticamente el anterior.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a169"}, {"q": "Conforme al artículo 1 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, cual es el objeto de la Ley?", "o": ["Regular la transparencia de la actividad pública y el derecho de acceso a la información pública.", "Adaptar el ordenamiento jurídico español al Reglamento (UE) 2016/679 y completar sus disposiciones, y garantizar los derechos digitales de la ciudadanía conforme al mandato del artículo 18.4 de la Constitución.", "Establecer un derecho fundamental a la protección de datos aplicable por igual a personas físicas y personas jurídicas.", "Regular exclusivamente el ejercicio del derecho al honor y a la intimidad, sin referencia al Reglamento (UE) 2016/679."], "a": "b", "nx": 4, "ley": "LOPDGDD", "art": "1", "cl": "Objeto: adaptar el ordenamiento al RGPD y garantizar los derechos digitales de la ciudadanía (art. 18.4 CE).", "mn": "Doble objeto: «adaptar al RGPD + derechos digitales». El derecho fundamental viene del 18.4 CE.", "donde": "Calp", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a1"}, {"q": "La solicitud de información presentada por el interesado el 15 de diciembre de 2025:", "o": ["Suspende el plazo máximo para resolver.", "Obliga a dictar resolución en el plazo de diez días. Document signat electrònicament des de la plataforma esPublico Gestiona | Pàgina 5 de 21", "Constituye el ejercicio de un derecho reconocido a los interesados en el procedimiento.", "Determina la caducidad del procedimiento."], "a": "c", "nx": 4, "ley": "LPAC", "art": "21", "cl": "Obligación de dictar resolución expresa y notificarla. Plazo máximo el de la norma; no puede exceder de 6 meses salvo ley o Derecho UE; si no lo fija, 3 meses. Exentos: pacto o convenio y derechos sujetos solo a declaración responsable o comunicación.", "mn": "Obligación de resolver: «6-3». Máximo 6 meses salvo ley o Derecho UE; si la norma no fija plazo, 3 meses. Exentos: pacto o convenio y declaración responsable o comunicación. Se cuenta desde el acuerdo de iniciación (de oficio) o desde la entrada en el registro del órgano competente (a solicitud).", "donde": "Examen Gandia Resuelto Auxiliar, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a21"}, {"q": "El artículo 106.2 de la 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, las Administraciones Públicas de oficio, y previo dictamen favorable del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma si lo hubiere, podrán declarar la nulidad de las disposiciones administrativas en los supuestos previstos en el artículo 47.2 del mismo cuerpo legal:", "o": ["En el plazo de dos meses.", "En cualquier momento.", "En el plazo de un mes.", "En el plazo de un mes, siempre que previamente hayan sido recurridas."], "a": "b", "nx": 4, "ley": "LPAC", "art": "106", "cl": "En cualquier momento, de oficio o a solicitud, actos firmes o que no se recurrieron en plazo, previo dictamen FAVORABLE del Consejo de Estado u órgano consultivo autonómico. Disposiciones: solo de oficio. Inadmisión sin dictamen. Plazo de 6 meses: caducidad (de oficio) o desestimación (a solicitud).", "mn": "Revisión de nulos «CUALQUIER MOMENTO + dictamen FAVORABLE + 6 MESES». De oficio y no resuelto en 6 meses: caducidad; a solicitud: desestimada. Disposiciones generales nulas: solo DE OFICIO.", "donde": "Córdoba, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a106"}, {"q": "Indique la opción correcta en relación con el tenor literal del artículo 38 de la Constitución Española de 1978:", "o": ["Se reconoce la libertad de empresa en el marco de la economía de mercado. Los poderes públicos garantizan y protegen su ejercicio y la defensa de la productividad, de acuerdo con las exigencias de la economía general y, en su caso, de la negociación.", "Se garantiza la libertad de empresa en el marco de la economía de mercado. Los poderes públicos garantizan y protegen su ejercicio y la defensa de la productividad, de acuerdo con las exigencias de la economía general y, en su caso, de la negociación.", "Se reconoce la libertad de empresa en el marco de la economía de mercado. Las Administraciones Públicas garantizan y protegen su ejercicio y la defensa de la productividad, de acuerdo con la economía general y, en su caso, de la negociación.", "Ninguna es correcta."], "a": "d", "nx": 4, "ley": "CE", "art": "38", "cl": "Libertad de empresa en el marco de la economía de mercado; los poderes públicos garantizan su ejercicio y la defensa de la productividad, de acuerdo con la planificación.", "mn": "«Empresa libre + productividad + planificación».", "donde": "Córdoba, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a38"}, {"q": "El art. 17.3 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local señala que el Instituto Nacional de Estadística remitirá a los Institutos estadísticos de las comunidades autónomas u órganos competentes en la materia, y en su caso, a otras Administraciones públicas los datos relativos a los padrones en los municipios de su ámbito territorial en los que se produzcan altas o bajas de extranjeros en las mismas condiciones señaladas en el artículo 16.3 de esta ley ¿Con qué periodicidad?", "o": ["Anualmente.", "Semestralmente.", "Trimestralmente.", "Mensualmente."], "a": "c", "nx": 4, "ley": "LBRL", "art": "17", "cl": "Ayuntamiento; Diputaciones si no tienen capacidad; Consejo de Empadronamiento.", "mn": "Padrón = «lo hace el AYUNTAMIENTO, lo coordina el INE». Formación, mantenimiento, revisión y custodia: Ayuntamiento (Diputaciones si no puede). Discrepancias INE–Ayuntamiento → Consejo de Empadronamiento (adscrito al Ministerio, presidido por el Presidente del INE).", "donde": "Córdoba, Gandia", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a17"}, {"q": "Corresponde al Pleno del Ayuntamiento una de las siguientes competencias:", "o": ["Dirigir, inspeccionar e impulsar los servicios y obras municipales.", "Las contrataciones y concesiones de toda clase cuando su importe no supere el 10 por ciento de los recursos ordinarios del Presupuesto ni en cualquier caso los seis millones de euros.", "Otorgar las licencias.", "La aprobación de la plantilla de personal y de la relación de puestos de trabajo."], "a": "d", "nx": 4, "ley": "LCSP", "art": "DA 2", "cl": "Alcalde/Presidente: órgano de contratación si el valor estimado no supera el 10 % de los recursos ordinarios ni 6 millones €, incluidos plurianuales de hasta 4 años (prórrogas incluidas). Si se supera cualquiera: Pleno.", "mn": "Regla «10-6-4»: 10 % de recursos ordinarios, 6 millones, 4 años. Pasar UNO de los tres = Pleno.", "donde": "AYUNTAMIENTO DE PEGO SINRESPUESTAS, Magán, Pego C1 test respostes 10-2025, examenAdministrativoPego15101015", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"q": "La plantilla del personal de cada Corporación local deberá ser aprobada:", "o": ["Anualmente, a través del presupuesto, es decir, con ocasión de la aprobación del mismo.", "Anualmente, comprendiendo sólo los puestos de trabajo reservados a funcionarios y personal laboral.", "Comprendiendo todos los puestos de trabajo reservados a funcionarios, personal laboral y eventual, con posterioridad a la aprobación del presupuesto.", "Por el Alcalde"], "a": "a", "nx": 4, "ley": "LBRL", "art": "90", "cl": "Plantilla de personal: se aprueba anualmente con el presupuesto y comprende funcionarios, laborales y eventuales.", "mn": "«Plantilla = cada AÑO con el PRESUPUESTO».", "donde": "AYUNTAMIENTO DE PEGO SINRESPUESTAS, Magán, Pego C1 test respostes 10-2025, examenAdministrativoPego15101015", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a90"}, {"q": "El artículo 8.2 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, establece que los empleados públicos se clasifican en:", "o": ["Funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual.", "Funcionarios de carrera y personal laboral.", "Funcionarios de carrera, funcionarios interinos y personal laboral.", "Funcionarios de carrera, funcionarios interinos, personal laboral, personal eventual y personal directivo."], "a": "a", "nx": 4, "ley": "TREBEP", "art": "8", "cl": "1. Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servici", "mn": "Clases de empleados públicos «CILE»: funcionarios de Carrera, Interinos, personal Laboral (fijo, indefinido o temporal), personal Eventual. El directivo profesional NO es una clase.", "donde": "20210421 Exercici A blanc BETXI, 20210421 Exercici B blanc BETXI, Betxi", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a8"}, {"q": "La iniciativa de reforma del Estatuto de Autonomía de la Comunitat Valenciana corresponde:", "o": ["Al Consell, a una tercera parte de los miembros del Congreso, a dos Grupos Parlamentarios o a las Cortes Generales.", "Al Consell, a la mayoría de los miembros de Les Corts, a dos Grupos Parlamentarios o a las Cortes Generales.", "Al Consell, a dos tercios de los miembros de Les Corts, a dos Grupos Parlamentarios o las Cortes Generales.", "Al Consell, a una tercera parte de los miembros de Les Corts, a dos Grupos Parlamentarios o a las Cortes Generales."], "a": "d", "nx": 4, "ley": "EACV", "art": "81", "cl": "Consell, 1/3 de Les Corts, 2 grupos o Cortes Generales; 2/3; mayoría simple si solo amplía competencias.", "mn": "Reforma del EACV: iniciativa «C-1/3-2G-CG»: Consell, 1/3 de Les Corts, 2 Grupos Parlamentarios o Cortes Generales. Aprobación por 2/3 de Les Corts (simple si solo amplía competencias) + Cortes Generales mediante LO.", "donde": "20251030 Otros Respuestas examen Beniparrell 1º ejercicio ADMINISTRATIVOS, Alcoy, Alicante, Beniparrell 1º ejercicio ADMINISTRATIVOS 20251030", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235#aochentayuno"}, {"q": "Según el artículo 86 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, las Entidades Locales podrán ejercer la iniciativa pública para el desarrollo de actividades económicas, siempre que esté garantizado el cumplimiento de:", "o": ["El endeudamiento máximo permitido por el Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales", "La regla de gasto y objetivo de deuda pública en el ejercicio de sus competencias", "El objetivo de estabilidad presupuestaria y de la sostenibilidad financiera del ejercicio de sus competencias", "El objetivo de estabilidad presupuestaria y de deuda pública en el ejercicio de sus competencias"], "a": "c", "nx": 4, "ley": "LBRL", "art": "86", "cl": "Iniciativa pública económica local: solo si se garantiza la estabilidad presupuestaria y la sostenibilidad financiera.", "mn": "«Empresa municipal solo si las CUENTAS aguantan».", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a86"}, {"q": "Según el artículo 56 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público ¿Cuál de estos no es un requisito para el acceso a la función pública?", "o": ["Poseer la capacidad funcional para el desempeño de las tareas", "Tener cumplidos dieciséis años y no exceder, en su caso, de la edad máxima de jubilación forzosa", "Poseer la titulación exigida", "Tener al menos cinco años de experiencia previa en el sector público"], "a": "d", "nx": 4, "ley": "TREBEP", "art": "56", "cl": "Requisitos generales: nacionalidad española (salvo art. 57), capacidad funcional, 16 años y no exceder la edad máxima de jubilación, no haber sido separado ni inhabilitado, titulación exigida.", "mn": "«N-C-E-H-T»: Nacionalidad, Capacidad, Edad (16), Historial limpio, Titulación.", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a56"}, {"q": "Según el artículo 190 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, por la que se transponen al ordenamiento jurídico español las Directivas del Parlamento Europeo y del Consejo 2014/23/UE y 2014/24/UE, de 26 de febrero de 2014, ¿Cuál de estas no es una prerrogativa del órgano de contratación de las administraciones públicas?", "o": ["Resolver las dudas que ofrezca su cumplimiento", "Suspender la ejecución del mismo", "Libertad en la elección contratista", "Acordar la resolución del contrato y determinar los efectos de esta"], "a": "c", "nx": 4, "ley": "LCSP", "art": "190", "cl": "Prerrogativas: interpretar, resolver dudas, modificar por interés público, declarar responsabilidad, suspender y acordar la resolución.", "mn": "«IRMS-R»: Interpretar, Resolver dudas, Modificar, Suspender, Resolver. La «libre elección del contratista» NO está.", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-102"}, {"q": "¿Cuál de estos no es un procedimiento de adjudicación de contratación, regulado en la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, por la que se transponen al ordenamiento jurídico español las Directivas del Parlamento Europeo y del Consejo 2014/23/UE y 2014/24/UE, de 26 de febrero de 2014?", "o": ["Adjudicación directa", "Procedimiento abierto", "Licitación con negociación", "Diálogo competitivo"], "a": "a", "nx": 4, "ley": "LCSP", "art": "DF 5", "cl": "", "mn": "", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"q": "El artículo 8 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público determina:", "o": ["La competencia es renunciable y se ejercerá por aquellos órganos administrativos que la tengan atribuida como propia o por las Administraciones Públicas a cuya circunscripción territorial pertenezcan, previa comunicación de la correspondiente resolución administrativa", "La competencia es irrenunciable y se ejercerá por los órganos administrativos que la tengan atribuida como propia, salvo los casos de delegación o avocación, cuando se efectúen en los términos previstos en esta u otras leyes", "La competencia es renunciable y se ejercerá por aquellos órganos administrativos que la tengan atribuida como propia o por las Administraciones Públicas a cuya circunscripción territorial pertenezcan, sin necesidad de comunicación de la correspondiente resolución administrativa", "Ninguna respuesta es correcta"], "a": "b", "nx": 4, "ley": "LRJSP", "art": "8", "cl": "Irrenunciable; la ejercen los órganos que la tienen atribuida como propia salvo delegación o avocación. Delegación, encomienda, delegación de firma y suplencia no alteran la titularidad. Desconcentración. Si no se especifica el órgano: el inferior competente por materia y territorio; si hay varios, el superior jerárquico común.", "mn": "Competencia IRRENUNCIABLE. «DEL-EN-FIR-SU» (delegación, encomienda, firma y suplencia) no cambian el TITULAR. La DESCONCENTRACIÓN sí traslada la titularidad. Norma que no dice el órgano: el INFERIOR competente por materia y territorio.", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a8"}, {"q": "La formación, mantenimiento, revisión y custodia del Padrón municipal corresponde:", "o": ["Al Instituto Nacional de Estadística, previo informe del Consejo de Empadronamiento", "Al Ayuntamiento", "A la Persona que ejerza la Presidencia del Instituto Nacional de Estadística previo Informe del Consejo de Empadronamiento", "A la persona que ejerza la Presidencia del Instituto Nacional de Estadística previo informe de las Diputaciones Provinciales o entidades equivalentes, Cabildos y Consejos insulares"], "a": "b", "nx": 4, "ley": "LBRL", "art": "17", "cl": "Ayuntamiento; Diputaciones si no tienen capacidad; Consejo de Empadronamiento.", "mn": "Padrón = «lo hace el AYUNTAMIENTO, lo coordina el INE». Formación, mantenimiento, revisión y custodia: Ayuntamiento (Diputaciones si no puede). Discrepancias INE–Ayuntamiento → Consejo de Empadronamiento (adscrito al Ministerio, presidido por el Presidente del INE).", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a17"}, {"q": "La potestad reglamentaria de las Entidades locales en materia tributaria se ejercerá a través de:", "o": ["Las ordenanzas fiscales reguladoras de sus tributos propios y de Ordenanzas generales de gestión, recaudación e inspección", "El Reglamento Orgánico Municipal", "El Re diputados (la LOREG fija 350); circunscripción = provincia; Ceuta y Melilla 1 diputado cada una; representación proporcional; mandato de 4 años.", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a68"}, {"q": "Están obligados a relacionarse electrónicamente con las Administraciones Públicas:", "o": ["Quienes representen a un interesado, en cualquier caso", "Quienes ejerzan una actividad profesional para la que no se requiera colegiación obligatoria y no se trate de actuaciones derivadas del ejercicio de su actividad profesional", "Las entidades sin personalidad jurídica", "Para la interposición de cualquier recurso administrativo, están obligados a relacionarse electrónicamente con las Administraciones Públicas todos los ciudadanos"], "a": "c", "nx": 4, "ley": "LPAC", "art": "14", "cl": "Personas físicas eligen (y pueden cambiar). Obligados: personas jurídicas, entidades sin personalidad, profesionales colegiados en su actividad, representantes de obligados y empleados públicos por razón de su condición.", "mn": "Obligados (14.2) «PEPRE-RE-EM»: Personas jurídicas, Entidades sin personalidad, PRofesionales COLEGIADOS (notarios y registradores incluidos), REpresentantes de un obligado, EMpleados públicos (por su condición). Las personas físicas ELIGEN y pueden cambiar en cualquier momento.", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a14"}, {"q": "Según el artículo 43 de la LPACAP 39/2015, ¿cuándo se entiende rechazada la notificación electrónica?", "o": ["Pasados diez días naturales desde su puesta a disposición sin que se acceda a su contenido", "Pasados diez días hábiles desde su puesta a disposición sin que se acceda a su contenido", "Pasados quince días naturales desde su puesta a disposición sin que se acceda a su contenido", "Pasados quince días hábiles desde su puesta a disposición sin que se acceda a su contenido"], "a": "a", "nx": 4, "ley": "LPAC", "art": "43", "cl": "Por comparecencia en la sede o en la dirección electrónica habilitada única. Practicada al acceder a su contenido. Rechazada a los 10 días NATURALES sin acceder. El aviso no es requisito de validez.", "mn": "Notificación electrónica: se practica por comparecencia en la sede o en la DEHú. Se entiende practicada al ACCEDER. Rechazada a los 10 días NATURALES sin acceso. El aviso al correo es informativo: su falta NO invalida la notificación.", "donde": "Alicante, Crevillent", "fallo": 0, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a43"}], "tot": {"A": 411, "E": 134, "B": 50}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let known = {}; try { known = JSON.parse(localStorage.getItem("mis-examenes-se") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("mis-examenes-se", JSON.stringify(known)); } catch (e) {} };
const n = D.tot.A + D.tot.E + D.tot.B;
$("#tot").innerHTML = `<span>${D.examenes.length} exámenes</span><span><b class="ok">${D.tot.A}</b> bien</span><span><b class="bad">${D.tot.E}</b> mal</span><span><b class="bl">${D.tot.B}</b> en blanco</span><span>al ${esc(D.hoy)}</span>`;

function vista(v){ for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.v === v);
  for (const s of ["res","fal","rep","pra"]) $("#v-"+s).hidden = s !== v; window.scrollTo({top:0}); }
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) vista(b.dataset.v); });

// Resultados
const maxF = Math.max(1, ...D.porLey.map(l => l.fallos));
$("#v-res").innerHTML = `<h2>Nota de cada examen</h2>
<div class="tbl"><table><thead><tr><th>Fecha</th><th>Examen</th><th>Bien</th><th>Mal</th><th>Blanco</th><th>Nota</th></tr></thead><tbody>
${D.examenes.map(e => `<tr><td class="mono">${esc(e.f)}</td><td>${esc(e.t)} ${e.nuevo ? '<span class="pill new">nuevo</span>' : ""}</td><td class="n">${e.A}</td><td class="n">${e.E}</td><td class="n">${e.B}</td>
<td class="n"><span class="pill ${e.nota >= 5 ? "ok" : "bad"}">${e.nota.toFixed(2)}</span></td></tr>`).join("")}
</tbody></table></div>
<h2>Dónde te equivocas más</h2>
<div class="tbl"><table><thead><tr><th>Ley</th><th>Fallos</th><th>% fallo</th><th></th></tr></thead><tbody>
${D.porLey.map(l => `<tr><td>${esc(l.ley)}</td><td class="n">${l.fallos}</td><td class="n">${Math.round(l.fallos / Math.max(1, l.total) * 100)} %</td>
<td style="width:30%"><div class="bar"><i style="width:${l.fallos / maxF * 100}%"></i></div></td></tr>`).join("")}
</tbody></table></div>
<p class="muted">Nota calculada con la fórmula habitual: (aciertos − errores/3) ÷ preguntas × 10. Las de reserva no cuentan.</p>`;

// Mis fallos (fichas)
function fichas(){
  const q = $("#qf").value.trim().toLowerCase(), pend = $("#pend").getAttribute("aria-pressed") === "true";
  const L = D.fichas.map((f, i) => ({...f, k: `${f.ex}|${f.n}`})).filter(f => (!pend || !known[f.k]) && (!q || `${f.ex} ${f.ley} ${f.art} ${f.e} ${f.mn}`.toLowerCase().includes(q)))
    .sort((a, b) => b.veces - a.veces);
  $("#fichas").innerHTML = L.map(f => `<article class="card${known[f.k] ? " known" : ""}">
    <div class="head"><span class="mono">${f.art ? "Art. " + esc(f.art) + " · " : ""}${esc(f.ley)}</span>
      ${f.veces > 1 ? `<span class="pill bad">fallado ${f.veces} veces</span>` : ""}<span class="muted">${esc(f.ex)} · P${f.n} · marcaste ${esc(f.mia)}, era ${esc(f.a)}</span></div>
    ${f.e ? `<p class="ex ans">${esc(f.e)}</p>` : ""}
    ${f.mn ? `<p class="mn ans"><mark>${esc(f.mn)}</mark></p>` : ""}
    <div class="acts">${f.url ? `<a class="boe" href="${esc(f.url)}" target="_blank" rel="noopener">📖 Ver ${f.art ? "art. " + esc(f.art) : "la ley"} en el BOE ↗</a>` : ""}<button class="know" data-k="${esc(f.k)}" aria-pressed="${!!known[f.k]}">${known[f.k] ? "✔ Lo sé" : "Marcar «lo sé»"}</button></div></article>`).join("")
    || `<p class="empty">No hay fallos con ese filtro.</p>`;
}
$("#qf").addEventListener("input", fichas);
$("#repaso").addEventListener("click", e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); document.body.classList.toggle("hide-ans", on); });
$("#pend").addEventListener("click", e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); fichas(); });
$("#fichas").addEventListener("click", e => {
  const k = e.target.closest(".know"); if (k){ const id = k.dataset.k; if (known[id]) delete known[id]; else known[id] = 1; save(); fichas(); return; }
  const a = e.target.closest(".ans"); if (a && document.body.classList.contains("hide-ans")) a.classList.toggle("show");
});
fichas();

// Más repetidas
const R = D.repes || [];
$("#lr").innerHTML = `<option value="">Todas las leyes</option>` + [...new Set(R.map(r => r.ley))].sort().map(l => `<option>${esc(l)}</option>`).join("");
function repes(){
  const q = $("#qr").value.trim().toLowerCase(), l = $("#lr").value, sf = $("#solofall").getAttribute("aria-pressed") === "true", oc = $("#ocultar").getAttribute("aria-pressed") === "true";
  const L = R.filter(r => (!l || r.ley === l) && (!sf || r.fallo) && (!q || `${r.q} ${r.ley} ${r.art} ${r.mn} ${r.cl}`.toLowerCase().includes(q)));
  $("#repes").innerHTML = L.slice(0, 150).map((r, i) => `<article class="card">
    <div class="head"><span class="mono">Art. ${esc(r.art)} · ${esc(r.ley)}</span><span class="pill ok">${r.nx} exámenes</span>${r.fallo ? `<span class="pill bad">🔴 lo has fallado ${r.fallo} ${r.fallo > 1 ? "veces" : "vez"}</span>` : ""}</div>
    <p class="q">${esc(r.q)}</p>
    <div class="opts">${r.o.map((o, k) => `<div class="opt${!oc && "abcd"[k] === r.a ? " right" : ""}" data-l="${"abcd"[k]}"><b>${"abcd"[k]})</b>${esc(o)}</div>`).join("")}</div>
    <div class="sol" ${oc ? "hidden" : ""}>${r.cl ? `<p class="cl"><b>Lo que hay que clavar:</b> ${esc(r.cl)}</p>` : ""}${r.mn ? `<p class="mn"><mark>💡 ${esc(r.mn)}</mark></p>` : ""}${r.donde ? `<p class="muted">Ha caído en: ${esc(r.donde)}</p>` : ""}${r.url ? `<a class="boe" href="${esc(r.url)}" target="_blank" rel="noopener">📖 Ver ${r.art ? "art. " + esc(r.art) : "la ley"} en el BOE ↗</a>` : ""}</div>
    ${oc ? `<button class="know ver" data-a="${r.a}">Ver respuesta</button>` : ""}</article>`).join("") || `<p class="empty">No hay preguntas con ese filtro.</p>`;
}
$("#qr").addEventListener("input", repes); $("#lr").addEventListener("change", repes);
for (const id of ["#solofall", "#ocultar"]) $(id).addEventListener("click", e => { e.currentTarget.setAttribute("aria-pressed", e.currentTarget.getAttribute("aria-pressed") !== "true"); repes(); });
$("#repes").addEventListener("click", e => { const b = e.target.closest(".ver"); if (!b) return; const c = b.closest(".card");
  for (const o of c.querySelectorAll(".opt")) if (o.dataset.l === b.dataset.a) o.classList.add("right"); c.querySelector(".sol").hidden = false; b.remove(); });
repes();

// Practicar: primero las que fallaste
const P = [...D.prac].sort((a, b) => (b.res === "Mal") - (a.res === "Mal") || Math.random() - .5);
let i = 0, hechas = 0, bien = 0;
function pregunta(){
  if (!P.length){ $("#v-pra").innerHTML = `<p class="empty">Aún no hay preguntas con texto legible.</p>`; return; }
  const p = P[i % P.length];
  $("#v-pra").innerHTML = `<p class="muted">${hechas} contestadas · ${bien} bien · ${P.length} preguntas de tus exámenes (primero las que fallaste). El texto sale de las fotos: puede tener alguna errata.</p>
  <article class="card"><div class="head"><span class="muted">${esc(p.ex)} · P${p.n}</span>${p.res === "Mal" ? `<span class="pill bad">la fallaste (marcaste ${esc(p.mia)})</span>` : ""}</div>
  <p class="q">${esc(p.q)}</p><div class="opts">${p.o.map((o, k) => `<button class="opt" data-l="${"abcd"[k]}"><b>${"abcd"[k]})</b>${esc(o)}</button>`).join("")}</div>
  <div id="sol" hidden></div></article>
  <div class="tools"><button class="tg" id="sig">Siguiente</button></div>`;
  $("#v-pra .opts").addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b || !$("#sol").hidden) return;
    const ok = b.dataset.l === p.a; hechas++; if (ok) bien++;
    for (const x of document.querySelectorAll(".opt")) { if (x.dataset.l === p.a) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); }
    $("#sol").hidden = false;
    $("#sol").innerHTML = `<p class="res">${ok ? "✔ Bien" : "✘ Era la " + esc(p.a) + ")"} · ${p.art ? "Art. " + esc(p.art) + " " : ""}${esc(p.ley)}</p>${p.e ? `<p class="ex">${esc(p.e)}</p>` : ""}${p.mn ? `<p class="mn"><mark>${esc(p.mn)}</mark></p>` : ""}${p.url ? `<a class="boe" href="${esc(p.url)}" target="_blank" rel="noopener">📖 Ver ${p.art ? "art. " + esc(p.art) : "la ley"} en el BOE ↗</a>` : ""}`;
  });
  $("#sig").addEventListener("click", () => { i++; pregunta(); });
}
pregunta();
</script>
