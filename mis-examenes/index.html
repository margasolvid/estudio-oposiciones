<style>
/* Layout: cuaderno de corrección: cabecera con totales, pestañas (Resultados · Mis fallos · Practicar), una columna legible */
:root{
  --bg:#f4f4f1; --paper:#ffffff; --ink:#1b1d24; --muted:#5f6472; --line:#d9dbe1;
  --accent:#2f4fb5; --accent-soft:#e3e9fb; --ok:#1f7a4d; --ok-soft:#dcf2e6; --bad:#c2253c; --bad-soft:#fbe1e5; --blank:#a26b00; --blank-soft:#fbf0d4;

}

  --bg:#101219; --paper:#171a23; --ink:#e6e8ee; --muted:#9aa0b0; --line:#2a2f3c; --accent:#8ea8ff; --accent-soft:#1f2a4d;
  --ok:#5fd39a; --ok-soft:#163525; --bad:#ff7b8c; --bad-soft:#3a1a20; --blank:#f2c25c; --blank-soft:#3a2f12; --marker:#5c5413; --marker-ink:#fff6b0; color-scheme:dark}}
:root[data-theme="dark"]{

  --ok:#5fd39a; --ok-soft:#163525; --bad:#ff7b8c; --bad-soft:#3a1a20; --blank:#f2c25c; --blank-soft:#3a2f12; --marker:#5c5413; --marker-ink:#fff6b0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 0;display:grid;gap:8px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0}
.tot{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}

main .wrap{padding-block:18px 48px;display:grid;gap:14px}
h2{font-family:var(--f-display);font-size:1.05rem;margin:6px 0 0}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.bar{height:8px;background:var(--bad-soft);border-radius:4px;overflow:hidden;min-width:60px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 200px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}

.tg[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.card.known{opacity:.55}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.mono{font-family:var(--f-mono);font-size:.85rem}
.muted{color:var(--muted);font-size:.86rem}
.cl,.ex{margin:0}
.mn{margin:0;font-weight:600}
.mn mark{background:var(--marker);color:var(--marker-ink);padding:1px 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hide-ans .ans{filter:blur(6px);cursor:pointer;user-select:none} .hide-ans .ans.show{filter:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.boe{display:inline-block;font-size:.82rem;font-weight:600;padding:5px 11px;border-radius:6px;background:var(--accent);color:var(--paper);text-decoration:none;justify-self:start}
.boe:hover{filter:brightness(1.1)}
.know{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;justify-self:start}
.know[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.q{font-weight:500;margin:0}
.opts{display:grid;gap:6px}
select.tg{appearance:auto}
div.opt{cursor:default}
.opt{font:inherit;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt b{font-family:var(--f-mono);margin-right:6px}
.res{margin:0;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.ans{transition:filter .2s}}
</style>

ct.php?id=BOE-A-1978-31229#a165"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "12", "mia": "a", "a": "c", "e": "Ley 39/2015, art. 95.1: paralizado por causa del interesado, se le advierte de que a los tres meses se producirá la caducidad. Marcaste dos meses.", "ley": "LPAC", "art": "95", "cl": "A solicitud, paralizado por causa del interesado: aviso y a los 3 meses caducidad y archivo. No caduca si es trámite no indispensable. No produce por sí sola la prescripción, pero los procedimientos caducados no la interrumpen. Se pueden conservar actos en el nuevo procedimiento.", "mn": "Caducidad por culpa del interesado: «AVISO + 3 MESES» → archivo. La caducidad no extingue la acción, pero el procedimiento caducado NO interrumpe la prescripción. No cabe si se trata de un trámite NO indispensable.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a95"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "14", "mia": "b", "a": "c", "e": "Ley 39/2015, art. 82.4: se puede prescindir de la audiencia si no figuran ni se tienen en cuenta otros hechos, alegaciones y pruebas que las del interesado. Tu opción (10 a 15 días) es el art. 82.2, no el 82.4 que cita la pregunta.", "ley": "LPAC", "art": "82", "cl": "Instruido el procedimiento e inmediatamente antes de la propuesta de resolución; plazo no inferior a 10 días ni superior a 15. Se puede prescindir si no figuran ni se tienen en cuenta otros hechos, alegaciones o pruebas que las del interesado.", "mn": "Audiencia «10-15»: entre 10 y 15 días, inmediatamente ANTES de la propuesta de resolución y antes del informe jurídico o del dictamen. Se puede prescindir si solo constan los hechos y alegaciones del propio interesado.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a82"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "18", "mia": "d", "a": "b", "e": "Ley 1/2022 CV, art. 18: se publica el índice de solvencia a corto y largo plazo; la b) dice «medio», así que es la incorrecta. Marcaste la d), que sí se publica (art. 14).", "ley": "Ley 19/2013", "art": "18", "cl": "Causas de inadmisión: información en elaboración, auxiliar o de apoyo (notas, borradores, informes internos), que requiera reelaboración, dirigida a órgano que no la tenga sin conocerse el competente, solicitudes manifiestamente repetitivas o abusivas.", "mn": "«E-A-R-Ó-R»: Elaboración, Auxiliar, Reelaboración, Órgano desconocido, Repetitiva/abusiva.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a18"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "20", "mia": "c", "a": "b", "e": "TRLRHL, art. 168.1: al presupuesto se unen memoria, liquidación anterior, anexos de personal, inversiones, beneficios fiscales y convenios con las CCAA en gasto social, e informe económico-financiero. No va el anexo de bases de subvenciones (b). Marcaste c).", "ley": "TRLRHL", "art": "168", "cl": "Lo forma el Presidente; documentación que se une.", "mn": "Formación del presupuesto: la hace el PRESIDENTE y lleva «MemLiqPerInvBenConv»: Memoria, Liquidación (y avance de 6 meses), anexos de Personal, Inversiones, Beneficios fiscales, Convenios de gasto social, más el informe económico-financiero. El Presidente lo remite, informado por la Intervención, al Pleno antes del 15 de octubre.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a168"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "21", "mia": "d", "a": "a", "e": "RD 500/1990 (arts. 73-76): los anticipos de caja fija se justifican dentro del ejercicio presupuestario en que se constituyó el anticipo. Marcaste d).", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "26", "mia": "d", "a": "c", "e": "LBRL, art. 21.1.j: aprobar los instrumentos de gestión urbanística corresponde al Alcalde. Marcaste d).", "ley": "LBRL", "art": "21", "cl": "Atribuciones 21.1; indelegables 21.3; voto de calidad; bandos.", "mn": "Alcalde: atribuciones residuales. INDELEGABLES «COPRO-JE-SE-UR-PLA»: convocar y presidir, decidir empates, jefatura de personal (separación y despido), medidas urgentes en catástrofes, PLAntillas… Delegables en la JGL o los Tenientes de Alcalde: el resto. Operaciones de crédito previstas en el Presupuesto hasta el 10 % de los recursos ordinarios (las de tesorería, hasta el 15 %).", "veces": 3, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a21"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "27", "mia": "d", "a": "a", "e": "Ley 40/2015, art. 3.2: las AAPP se relacionan a través de medios electrónicos que aseguren interoperabilidad y seguridad, protejan datos y faciliten la prestación conjunta de servicios. Marcaste «todas»; la c) es inventada y la b) es del art. 5.3.", "ley": "LRJSP", "art": "3", "cl": "Objetividad; eficacia, jerarquía, descentralización, desconcentración y coordinación; servicio efectivo, simplicidad, participación, racionalización, buena fe, confianza legítima, lealtad institucional, responsabilidad, planificación, eficacia, economía, eficiencia, cooperación. Relación electrónica entre Administraciones. Personalidad jurídica única.", "mn": "Art. 103 CE + 3.1 LRJSP «E-JE-DES-DES-CO»: Eficacia, JErarquía, DEScentralización, DESconcentración, COordinación. Las Administraciones se relacionan ENTRE SÍ siempre por medios electrónicos. Cada Administración: personalidad jurídica ÚNICA.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a3"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "28", "mia": "a", "a": "b", "e": "Ley 40/2015, art. 6.1: instrucciones y órdenes de servicio se publican en el boletín oficial que corresponda por razón de los destinatarios o de los efectos, sin perjuicio de la Ley 19/2013. Marcaste la a) (boletín provincial, Ley 39/2015).", "ley": "LRJSP", "art": "6", "cl": "Dirigen la actividad de los órganos dependientes; publicación cuando proceda. Su incumplimiento no afecta por sí solo a la validez de los actos, sin perjuicio de responsabilidad disciplinaria.", "mn": "Incumplir una instrucción: el acto sigue siendo VÁLIDO, pero el funcionario puede tener responsabilidad DISCIPLINARIA.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a6"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "35", "mia": "a", "a": "b", "e": "LCSP, art. 36.3: los contratos basados en un acuerdo marco y los de un sistema dinámico se perfeccionan con su adjudicación. Marcaste formalización (regla general del 36.1).", "ley": "LCSP", "art": "36", "cl": "Perfección: los contratos se perfeccionan con su FORMALIZACIÓN (salvo menores y basados en acuerdo marco/sistema dinámico, que se perfeccionan con la adjudicación).", "mn": "«Sin firma no hay contrato»: se perfecciona al formalizar. Los menores, al adjudicar.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a3-8"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "36", "mia": "a", "a": "c", "e": "LCSP, art. 44.2.d: se recurren las modificaciones basadas en el incumplimiento de los arts. 204 y 205. La c) dice «cumplimiento», por eso no es recurrible. Marcaste la a).", "ley": "LCSP", "art": "44", "cl": "1. Serán susceptibles de recurso especial en materia de contratación, los actos y decisiones relacionados en e", "mn": "Recurso especial: obras > 3 M€; suministros y servicios > 100.000 €; concesiones > 3 M€. Es potestativo y gratuito.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a4-6"}, {"ex": "1.er ejercicio, 7 plazas de auxiliar administrativo,", "f": "2025", "n": "37", "mia": "a", "a": "c", "e": "LCSP, art. 50.1: el plazo es de 15 días hábiles; contra la adjudicación, desde el día siguiente a su notificación a los licitadores admitidos (c). La a) dice «naturales». Marcaste la a). En blanco y avisos", "ley": "LCSP", "art": "50", "cl": "Recurso especial: 15 días hábiles; contra la adjudicación, desde el día siguiente a su notificación.", "mn": "«Recurso especial = 15 hábiles».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a5-2"}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "4", "mia": "a", "a": "d", "e": "LBRL 49.b: información pública y audiencia por un plazo mínimo de 30 días. Marcaste 10.", "ley": "LBRL", "art": "49", "cl": "Inicial Pleno + 30 días + definitiva Pleno; sin reclamaciones, automática.", "mn": "Ordenanzas «I-30-D»: aprobación Inicial por el Pleno, información pública 30 días MÍNIMO, aprobación Definitiva por el Pleno. Si no hay reclamaciones, el acuerdo provisional pasa a definitivo automáticamente. Entran en vigor tras publicar el texto íntegro en el BOP y transcurrir 15 días hábiles (art. 70.2 y 65.2).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a49"}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "9", "mia": "a", "a": "b", "e": "Fases del procedimiento: iniciación, ordenación, instrucción, finalización y ejecución. A tu a) le faltaba la finalización.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "12", "mia": "a", "a": "b", "e": "TREBEP 61.6: sistemas selectivos de funcionarios = oposición y concurso-oposición; el concurso, solo por ley y excepcionalmente. Marcaste solo el concurso-oposición.", "ley": "TREBEP", "art": "61", "cl": "Sistemas selectivos: oposición, concurso-oposición y, excepcionalmente, concurso (solo por ley). Procesos abiertos, libre concurrencia, conexión entre pruebas y funciones. Personal laboral fijo: los mismos sistemas.", "mn": "«O, C-O, y C solo con ley». El concurso puro es la excepción.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a61"}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "16", "mia": "c", "a": "d", "e": "TRLOTUP 240: parcelación 1 mes, obras mayores 2 meses, intervención 3 meses; según el corrector, la incorrecta es la d) (resto de supuestos). Marcaste la c), que es correcta.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "21", "mia": "b", "a": "d", "e": "LBRL 20.1.b: la JGL existe en municipios de más de 5.000 habitantes y en los de menos si lo dice el reglamento orgánico o lo acuerda el Pleno. Por eso «solo en más de 5.000» es falsa y la respuesta es d).", "ley": "LBRL", "art": "20", "cl": "Alcalde, Tenientes y Pleno en todos; JGL en más de 5.000 o si se acuerda.", "mn": "Existen en todos los municipios: Alcalde, Tenientes de Alcalde, Pleno y Comisión Especial de Cuentas. JGL en los de >5.000 (o si lo decide el ROM o el Pleno).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a20"}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "22", "mia": "d", "a": "b", "e": "LBRL 21.1.g: el Alcalde aprueba la oferta de empleo y las bases y efectúa las convocatorias (b). La plantilla la aprueba el Pleno. Marcaste «todas falsas».", "ley": "LBRL", "art": "21", "cl": "Atribuciones 21.1; indelegables 21.3; voto de calidad; bandos.", "mn": "Alcalde: atribuciones residuales. INDELEGABLES «COPRO-JE-SE-UR-PLA»: convocar y presidir, decidir empates, jefatura de personal (separación y despido), medidas urgentes en catástrofes, PLAntillas… Delegables en la JGL o los Tenientes de Alcalde: el resto. Operaciones de crédito previstas en el Presupuesto hasta el 10 % de los recursos ordinarios (las de tesorería, hasta el 15 %).", "veces": 3, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a21"}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "25", "mia": "d", "a": "a", "e": "Ley 39/2015, art. 125: contra actos firmes, recurso extraordinario de revisión ante el órgano que los dictó. Marcaste la d), que no existe.", "ley": "LPAC", "art": "125", "cl": "Contra actos firmes, ante el mismo órgano: error de hecho que resulte de documentos del expediente (4 años desde la notificación); documentos de valor esencial; documentos o testimonios declarados falsos por sentencia firme; prevaricación, cohecho, violencia u otra conducta punible por sentencia firme (3 meses).", "mn": "Recurso extraordinario de revisión «E-D-F-P»: Error de hecho (4 años), Documentos esenciales nuevos, Falsedad declarada en sentencia, Prevaricación o cohecho declarados en sentencia (en estos tres, 3 meses desde el conocimiento o la firmeza). Solo contra actos FIRMES y ante el mismo órgano.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a125"}, {"ex": "Auxiliar administrativo, Alfafar,", "f": "2025-12-13", "n": "26", "mia": "d", "a": "c", "e": "Ley 39/2015, art. 115.1: debe constar el órgano al que se dirige y su código de identificación, no «de verificación»: la c) es la incorrecta. Marcaste el domicilio, que sí debe constar. En blanco y avisos", "ley": "LPAC", "art": "115", "cl": "Contenido mínimo; el error en la calificación no impide su tramitación si se deduce su carácter. Vicios no alegables por quien los causó.", "mn": "Error en el nombre del recurso: NO importa si se deduce su verdadero carácter. Quien causó el vicio NO puede alegarlo.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a115"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026", "n": "1", "mia": "d", "a": "a", "e": "Art. 46.2.b LBRL: las sesiones extraordinarias se convocan con al menos dos días hábiles de antelación (salvo las urgentes). Marcaste 24 horas.", "ley": "LBRL", "art": "46", "cl": "Mensual (+20.000), bimensual (5.001–20.000), trimestral (hasta 5.000); extraordinaria 1/4, máx. 3 al año, 15 días hábiles; convocatoria 2 días hábiles; quórum 1/3, mín. 3.", "mn": "Plenos ordinarios «1-2-3»: >20.000 hab. y Diputaciones cada MES; 5.001-20.000 cada DOS meses; ≤5.000 cada TRES. Extraordinaria: Presidente o 1/4 del número legal (máx. 3 solicitudes por concejal y año), en 15 días hábiles. Convocatoria con 2 días HÁBILES. Quórum: 1/3 del número legal, nunca menos de 3, con Presidente y Secretario. Votación ordinaria por regla general.", "veces": 4, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a46"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026", "n": "2", "mia": "d", "a": "c", "e": "Art. 46.2.c LBRL: el Pleno se constituye con un tercio del número legal de miembros, nunca menos de tres, y con el Presidente y el Secretario. Ya lo fallaste en Dénia.", "ley": "LBRL", "art": "46", "cl": "Mensual (+20.000), bimensual (5.001–20.000), trimestral (hasta 5.000); extraordinaria 1/4, máx. 3 al año, 15 días hábiles; convocatoria 2 días hábiles; quórum 1/3, mín. 3.", "mn": "Plenos ordinarios «1-2-3»: >20.000 hab. y Diputaciones cada MES; 5.001-20.000 cada DOS meses; ≤5.000 cada TRES. Extraordinaria: Presidente o 1/4 del número legal (máx. 3 solicitudes por concejal y año), en 15 días hábiles. Convocatoria con 2 días HÁBILES. Quórum: 1/3 del número legal, nunca menos de 3, con Presidente y Secretario. Votación ordinaria por regla general.", "veces": 4, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a46"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026", "n": "7", "mia": "d", "a": "c", "e": "Art. 95.2 TREBEP: es falta muy grave la obstaculización al ejercicio de las libertades públicas y derechos sindicales. El abuso de autoridad y la grave perturbación del servicio son faltas graves. Lo de las incompatibilidades solo es muy grave cuando sí da lugar a una situación de incompatibilidad.", "ley": "TREBEP", "art": "95", "cl": "1. Las faltas disciplinarias pueden ser muy graves, graves y leves.", "mn": "Faltas muy graves: la lista es larga; las clave son discriminación y acoso, abandono del servicio, acuerdos manifiestamente ilegales, publicación de secretos, notoria falta de rendimiento, desobediencia abierta, incompatibilidad, impedir derechos sindicales y huelga. Las graves y leves las fija la ley de desarrollo o el convenio.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a95"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026", "n": "9", "mia": "c", "a": "a", "e": "Art. 116.4.c LCSP: hay que justificar los criterios de adjudicación. Las causas de resolución no están en la lista. Es la segunda vez que fallas el 116.4.", "ley": "LCSP", "art": "116", "cl": "1. La celebración de contratos por parte de las Administraciones Públicas requerirá la previa tramitación del ", "mn": "Expediente de contratación: lo inicia el órgano de contratación motivando la necesidad. Incluye los pliegos, el certificado de crédito, la fiscalización y la justificación del procedimiento, la clasificación, la solvencia, los criterios y el valor estimado. En servicios, informe de insuficiencia de medios.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-28"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026", "n": "14", "mia": "a", "a": "c", "e": "Art. 85 ter LBRL: las sociedades mercantiles locales se rigen por el derecho privado, salvo en materia presupuestaria, contable, de control financiero, de control de eficacia y de contratación. Marcaste la opción incompleta.", "ley": "LBRL", "art": "85", "cl": "Directa (4) e indirecta.", "mn": "Gestión directa = «GO-EE-SM»: Gestión por la propia entidad, Organismo autónomo, Entidad pública empresarial, Sociedad mercantil 100 % pública. EPE y SM solo si son más sostenibles y eficientes (memoria justificativa). Indirecta = modalidades del contrato de concesión (LCSP). Nunca indirecta ni por sociedad privada si hay ejercicio de autoridad.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a85"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026", "n": "31", "mia": "a", "a": "c", "e": "Art. 14.1 de la Ley 19/2013: la protección de datos no está en el 14.1, sino en el art.", "ley": "Ley 19/2013", "art": "14", "cl": "Doce límites al acceso: seguridad nacional, defensa, relaciones exteriores, seguridad pública, ilícitos penales/administrativos/disciplinarios, igualdad de partes en procesos judiciales, funciones de vigilancia/inspección/control, intereses económicos y comerciales, política económica y monetaria, secreto profesional y propiedad intelectual/industrial, confidencialidad en la toma de decisiones, medio ambiente. Aplicación justificada y proporcionada (test del daño).", "mn": "«Los 12 apóstoles del secreto»: empiezan por las 4 de seguridad (Nacional, Defensa, Exteriores, Pública) y acaban en el medio ambiente. Siempre justificado y proporcionado.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a14"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026", "n": "34", "mia": "b", "a": "d", "e": "Art. 102.4 TRLRHL: el ICIO se devenga al iniciarse la construcción, aunque no se haya obtenido la licencia. No al solicitarla. Reserva (R1-R5): todas bien (b, b, c, d, d).", "ley": "TRLRHL", "art": "102", "cl": "Coste de ejecución material; máx. 4 %; devengo al iniciar la obra.", "mn": "ICIO «CRE-4-INI»: la base es el Coste Real y Efectivo, es decir, la ejecución material (sin IVA, tasas, honorarios ni beneficio industrial); tipo máximo del 4 %; se devenga al INICIARSE la obra, aunque no haya licencia.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a102"}, {"ex": "Auxiliar administrativo/a (23", "f": "2026", "n": "13", "mia": "d", "a": "b", "e": "Art. 168 CE: la revisión total, o la parcial que afecte al Título Preliminar, al Capítulo II, Sección 1.ª del Título I, o al Título II, se aprueba en principio por mayoría de dos tercios de cada Cámara. Los tres quintos son para la reforma ordinaria del art. 167.", "ley": "CE", "art": "168", "cl": "Título Preliminar, Sección 1.ª Cap. II Tít. I y Tít. II; 2/3, disolución, referéndum obligatorio.", "mn": "Reforma agravada «2/3 + DISOLUCIÓN + 2/3 + REFERÉNDUM obligatorio»: revisión total, Título Preliminar, Sección 1.ª del Capítulo II del Título I (arts. 15-29) o Título II (la Corona).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a168"}, {"ex": "Auxiliar administrativo/a (23", "f": "2026", "n": "21", "mia": "b", "a": "c", "e": "Art. 22 TREBEP: las retribuciones de los funcionarios de carrera se clasifican en básicas y complementarias. Sueldo, trienios y pagas extraordinarias son el contenido de las básicas.", "ley": "TREBEP", "art": "22", "cl": "Retribuciones básicas (sueldo, trienios, pagas extraordinarias en su parte básica) y complementarias (puesto, carrera, desempeño, servicios extraordinarios). Dos pagas extraordinarias al año.", "mn": "Básicas = «lo que eres» (grupo y antigüedad: sueldo + trienios). Complementarias = «lo que haces y cómo» (puesto, carrera, rendimiento, extras).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a22"}, {"ex": "Auxiliar administrativo/a (23", "f": "2026", "n": "30", "mia": "d", "a": "b", "e": "Art. 2 TRLRHL: la b) recoge los recursos de las entidades locales (tributos propios, participaciones, subvenciones, precios públicos e ingresos de derecho público y privado), no la d).", "ley": "TRLRHL", "art": "2", "cl": "Lista a)–h): patrimonio, tributos, participaciones, subvenciones, precios públicos, crédito, multas…", "mn": "Recursos de las haciendas locales «PA-TRI-PAR-SUB-PRE-CRE-MUL-DEMÁS»: PAtrimonio, TRIbutos propios y recargos, PARticipaciones, SUBvenciones, PREcios públicos, CRÉditos, MULtas y demás prestaciones de Derecho público.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a2"}, {"ex": "Conserje/Ordenanza (4", "f": "2026", "n": "6", "mia": "d", "a": "c", "e": "", "ley": "CE", "art": "149", "cl": "Lista exclusiva; cláusula residual; prevalencia y supletoriedad (149.3).", "mn": "Competencias exclusivas del Estado: 32 materias. Trucos: lo «básico» y la «legislación» suelen ser del Estado (legislación laboral, mercantil, penal, procesal, civil con matices) y la «ejecución» de la CA. Las cláusulas residuales del 149.3 favorecen al Estado.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a149"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "8", "mia": "b", "a": "a", "e": "LBRL 18.1.b: participar en la gestión municipal es un derecho de los vecinos.", "ley": "LBRL", "art": "18", "cl": "Lista 18.1 a)–h).", "mn": "Derechos y deberes de los vecinos: elector y elegible; participar; usar los servicios y aprovechamientos comunales; CONTRIBUIR (deber); ser informado; pedir CONSULTA popular; exigir el servicio obligatorio; iniciativa popular.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a18"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "10", "mia": "b", "a": "d", "e": "LBRL 26.1.d: en municipios de más de 50.000 habitantes, la pavimentación y el alumbrado (servicios de todos los municipios) y el transporte urbano son mínimos: todas son correctas.", "ley": "LBRL", "art": "26", "cl": "Todos / más de 5.000 / más de 20.000 / más de 50.000. Muy preguntado.", "mn": "Servicios mínimos en 4 escalones: TODOS (alumbrado, cementerio, recogida de residuos, limpieza viaria, agua, alcantarillado, acceso, pavimentación); >5.000 «PaBiTra» (parque, biblioteca, tratamiento de residuos); >20.000 «ProSoInDe» (protección civil, servicios sociales, incendios, deportes); >50.000 «TraMa» (transporte urbano, medio ambiente urbano). La Diputación coordina en municipios de <20.000.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a26"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "13", "mia": "c", "a": "d", "e": "Ley 39/2015, art. 52.4: si falta una autorización, la convalida el órgano competente (no el superior). Los actos nulos no se convalidan.", "ley": "LPAC", "art": "52", "cl": "La Administración puede convalidar los actos ANULABLES subsanando los vicios. Efecto desde la fecha de la convalidación (salvo retroactividad del 39.3). Incompetencia no determinante de nulidad: la convalida el superior jerárquico; falta de autorización: otorgándola.", "mn": "Convalidación: solo actos ANULABLES. Produce efecto desde su fecha (salvo la retroactividad del 39.3). Incompetencia no determinante de nulidad: la convalida el superior jerárquico. Falta de autorización: se convalida otorgándola.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a52"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "15", "mia": "b", "a": "c", "e": "Ley 39/2015: las resoluciones que declaran la caducidad sí son recurribles (art. 95). Los acuerdos de ampliación de plazos no lo son (art. 32.3).", "ley": "LPAC", "art": "95", "cl": "A solicitud, paralizado por causa del interesado: aviso y a los 3 meses caducidad y archivo. No caduca si es trámite no indispensable. No produce por sí sola la prescripción, pero los procedimientos caducados no la interrumpen. Se pueden conservar actos en el nuevo procedimiento.", "mn": "Caducidad por culpa del interesado: «AVISO + 3 MESES» → archivo. La caducidad no extingue la acción, pero el procedimiento caducado NO interrumpe la prescripción. No cabe si se trata de un trámite NO indispensable.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a95"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "16", "mia": "b", "a": "d", "e": "Ley 39/2015, art. 118.1: son documentos nuevos los no recogidos en el expediente originario. Los aportados antes de la resolución no se tienen en cuenta en el recurso.", "ley": "LPAC", "art": "118", "cl": "Hechos o documentos nuevos: alegaciones entre 10 y 15 días. No se tienen en cuenta los que pudo aportar antes. Otros interesados: traslado del recurso.", "mn": "Audiencia en recursos: solo si hay hechos NUEVOS, 10-15 días. El recurso, los informes y las propuestas NO son documentos nuevos.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a118"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "17", "mia": "d", "a": "b", "e": "Ley 39/2015, art. 26.2: el documento electrónico debe incorporar una referencia temporal, no espacial.", "ley": "LPAC", "art": "26", "cl": "Documento público administrativo: emitido válidamente por órganos de la AP, por escrito y por medios electrónicos salvo que su naturaleza exija otra forma. Requisitos de validez: identificación del documento en el expediente, metadatos, firmas electrónicas, referencia temporal.", "mn": "Documento válido = «IMFR»: Identificador, Metadatos, Firma, Referencia temporal (fecha).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a26"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "20", "mia": "c", "a": "b", "e": "Ley 39/2015, art.", "ley": "LPAC", "art": "74", "cl": "No suspenden la tramitación, incluso las de nulidad de actuaciones, salvo la recusación.", "mn": "Incidentes NO suspenden. Única excepción: la RECUSACIÓN.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a74"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "21", "mia": "a", "a": "d", "e": "Ley 39/2015, art. 10.2: son válidos la firma electrónica cualificada o avanzada y el sello electrónico: a) y b).", "ley": "LPAC", "art": "10", "cl": "Firma de los interesados: firma electrónica cualificada y avanzada basada en certificados cualificados, sello electrónico y cualquier otro sistema que se considere válido.", "mn": "«Firma: cualificada, avanzada y SELLO».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a10"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "23", "mia": "b", "a": "c", "e": "Ley 39/2015, art. 69.3: solo la comunicación puede presentarse después de iniciar la actividad, si la ley lo prevé.", "ley": "LPAC", "art": "69", "cl": "Declaración responsable: el interesado manifiesta bajo su responsabilidad que cumple los requisitos y dispone de documentación. Comunicación: pone en conocimiento datos. Permiten el ejercicio desde su presentación. Inexactitud esencial: impide continuar.", "mn": "Declaración responsable = «CUMPLO y lo TENGO»; Comunicación = «te AVISO». Ambas habilitan desde el día de su PRESENTACIÓN. Falsedad o inexactitud ESENCIAL: cese de la actividad y posible imposibilidad de pedir lo mismo durante el tiempo que fije la ley.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a69"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "25", "mia": "c", "a": "d", "e": "Ley 39/2015, art. 107.2: la lesividad no puede declararse pasados 4 años desde que se dictó el acto.", "ley": "LPAC", "art": "107", "cl": "Actos favorables anulables: declaración de lesividad para impugnarlos en el contencioso. Dentro de 4 años; audiencia; 6 meses o caducidad. No recurrible. Entidades locales: el Pleno o el órgano colegiado superior.", "mn": "Lesividad «4-6-NR»: solo para actos FAVORABLES y ANULABLES. Plazo de 4 años desde que se dictó; caducidad a los 6 meses desde la iniciación; la declaración No es Recurrible. Exige audiencia previa. En entidades locales la declara el PLENO (o el órgano colegiado superior).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a107"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "27", "mia": "b", "a": "d", "e": "LO 3/2007, art.", "ley": "LO 3/2007", "art": "", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "32", "mia": "b", "a": "d", "e": "TRLRHL, art. 17.4: las ordenanzas se aplican tras la publicación íntegra del texto definitivo en el BOP: ninguna de las opciones es correcta.", "ley": "TRLRHL", "art": "17", "cl": "30 días mínimo; BOP y, si más de 10.000 hab., diario; sin reclamaciones, definitivo.", "mn": "Ordenanzas fiscales: exposición 30 días mínimo en el tablón; anuncio SIEMPRE en el BOP; además en un diario si la población es >10.000 habitantes (y las Diputaciones). Sin reclamaciones, provisional = definitivo. Ayuntamientos de >20.000 habitantes editan el texto íntegro en el primer cuatrimestre.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a17"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "40", "mia": "a", "a": "c", "e": "TREBEP, art.", "ley": "TREBEP", "art": "", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "41", "mia": "a", "a": "d", "e": "la publicidad discriminatoria es publicidad ilícita.", "ley": "LPAP", "art": "15", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2003-20254#a15"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "42", "mia": "d", "a": "c", "e": "RBEL, art.", "ley": "RBEL", "art": "44", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-17958#art44"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "43", "mia": "a", "a": "b", "e": "LPAP, art. 92.3: las autorizaciones demaniales duran como máximo 4 años, prórrogas incluidas. Los 75 años son de las concesiones.", "ley": "LPAP", "art": "92", "cl": "Autorizaciones de uso del dominio público: duración máxima de 4 años, prórrogas incluidas. Las concesiones, hasta 75 años.", "mn": "«Autorización 4, concesión 75».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2003-20254#a92"}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "44", "mia": "a", "a": "b", "e": "las potestades son investigación, deslinde, recuperación de oficio y desahucio administrativo. La expropiación no está.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo/a, Ajuntament", "f": "2026", "n": "50", "mia": "d", "a": "b", "e": "RD 887/2006, art.", "ley": "RD 887/2006 (Reglamento Subvenciones)", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "2", "mia": "c", "a": "b", "e": "CE 9.3: garantiza la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas. La b) omite «sancionadoras», por eso es la incorrecta. Marcaste la c) (seguridad jurídica, que sí está).", "ley": "CE", "art": "9", "cl": "7 principios: legalidad, jerarquía, publicidad, irretroactividad, seguridad jurídica, responsabilidad, interdicción de la arbitrariedad.", "mn": "9.3 = «LE-JE-PU-IRRE-SE-RE-IN» (7 principios): LEgalidad, JErarquía normativa, PUblicidad de las normas, IRREtroactividad de las sancionadoras no favorables o restrictivas, SEguridad jurídica, REsponsabilidad e INterdicción de la arbitrariedad de los poderes públicos. Ojo: la «eficacia» NO está (es del art. 103).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a9"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "6", "mia": "a", "a": "b", "e": "CE 22.1: «Se reconoce el derecho de asociación». Marcaste «se garantiza».", "ley": "CE", "art": "22", "cl": "Asociaciones inscritas sólo a efectos de publicidad; prohibidas secretas y paramilitares; disolución sólo por resolución judicial motivada.", "mn": "«Inscribir = publicidad; disolver = juez». Prohibidas: SECRETAS y PARAMILITARES. Las que persigan fines o usen medios delictivos son ilegales.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a22"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "11", "mia": "c", "a": "b", "e": "TRLRHL 184: fases del gasto = autorización, disposición o compromiso, reconocimiento de la obligación y ordenación del pago. La retención de crédito no es fase. Marcaste la c).", "ley": "TRLRHL", "art": "184", "cl": "A-D-O-P.", "mn": "Fases del gasto «A-D-O-P» = «Ana Dice Oye Paga»: Autorización, Disposición (compromiso), reconocimiento de la Obligación y ordenación del Pago. Se pueden acumular (AD, ADO).", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a184"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "13", "mia": "a", "a": "c", "e": "Ley 40/2015, art. 54: la AGE actúa conforme al art. 3 y a los principios de desconcentración funcional y territorial. Marcaste descentralización territorial.", "ley": "LRJSP", "art": "54", "cl": "La AGE actúa conforme a los principios del art. 3 y a los de desconcentración funcional y territorial.", "mn": "«AGE = DESconcentra», nunca descentraliza.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a54"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "14", "mia": "d", "a": "c", "e": "Ley 39/2015, art. 52.3: si el vicio es incompetencia no determinante de nulidad, convalida el órgano competente superior jerárquico. La d) es la conservación (art. 51) y la a) habla de actos nulos (solo se convalidan los anulables).", "ley": "LPAC", "art": "52", "cl": "La Administración puede convalidar los actos ANULABLES subsanando los vicios. Efecto desde la fecha de la convalidación (salvo retroactividad del 39.3). Incompetencia no determinante de nulidad: la convalida el superior jerárquico; falta de autorización: otorgándola.", "mn": "Convalidación: solo actos ANULABLES. Produce efecto desde su fecha (salvo la retroactividad del 39.3). Incompetencia no determinante de nulidad: la convalida el superior jerárquico. Falta de autorización: se convalida otorgándola.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a52"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "16", "mia": "b", "a": "a", "e": "Ley 39/2015, art. 48.2: el defecto de forma solo anula en determinados casos (falta de requisitos formales indispensables o indefensión). Marcaste «en cualquier caso».", "ley": "LPAC", "art": "48", "cl": "Cualquier infracción del ordenamiento, incluso la desviación de poder. Defecto de forma: solo si falta un requisito indispensable para el fin o causa indefensión. Fuera de plazo: solo si lo impone la naturaleza del término.", "mn": "Anulabilidad: cualquier infracción, INCLUIDA la desviación de poder. El defecto de forma solo si impide el fin o causa indefensión. La actuación fuera de plazo solo si lo impone la naturaleza del plazo.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a48"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "17", "mia": "a", "a": "b", "e": "LBRL 6.1: eficacia, descentralización, desconcentración y coordinación, sin «jerarquía». Marcaste la a) (jerarquía + cooperación).", "ley": "LBRL", "art": "6", "cl": "Las entidades locales sirven con objetividad los intereses públicos con eficacia, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley.", "mn": "«E-D-D-C» (Eficacia, Descentralización, Desconcentración, Coordinación). En la lista NO está la jerarquía (eso es el art. 103 CE y el 3 de la Ley 40/2015).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a6"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "21", "mia": "a", "a": "d", "e": "LBRL 124.4.i: el Alcalde de gran población ejerce la superior dirección del personal (d). Plantear conflictos de competencia es del Pleno (123.1); retribuciones y potestad sancionadora, de la Junta de Gobierno (127.1). Marcaste la a).", "ley": "LBRL", "art": "124", "cl": "Municipios de gran población: el Alcalde ostenta la máxima representación, es responsable de su gestión política ante el Pleno y tiene tratamiento de Excelencia. Lista de atribuciones del 124.4.", "mn": "Alcalde «grande» = «Excelencia»: ciudad grande, tratamiento grande. Responde ante el Pleno, no ante la Junta.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a124"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "23", "mia": "a", "a": "c", "e": "LBRL 128.2: la presidencia del distrito corresponde en todo caso a un concejal (c). Marcaste la a).", "ley": "LBRL", "art": "128", "cl": "Distritos (gran población): la presidencia corresponde en todo caso a un concejal.", "mn": "«Distrito = siempre un CONCEJAL al mando».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a128"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "24", "mia": "d", "a": "b", "e": "LBRL 127.2: la JGL puede delegar, entre otras, la concesión de licencias; no la RPT ni el proyecto de presupuesto. Marcaste la d). En la hoja pusiste «no contesto»: si la dejas en blanco no resta.", "ley": "LBRL", "art": "127", "cl": "Atribuciones: aprobar proyectos de ordenanzas y presupuesto, licencias, contratación, personal…", "mn": "La JGL de gran población APRUEBA PROYECTOS (los aprueba el Pleno después) y GESTIONA: licencias, contratos, personal, patrimonio.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a127"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "26", "mia": "a/c", "a": "b", "e": "Ley 4/2021 / TREBEP 64: la renuncia no inhabilita para volver a ingresar, así que la b) es la falsa. Rodeaste a) y c). Ojo: la a) también es falsa, porque la inhabilitación especial solo hace perder los cargos que diga la sentencia (TREBEP 66). Si tu respuesta era la a), la pregunta es impugnable.", "ley": "Ley 4/2021 CV", "art": "", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "27", "mia": "b", "a": "a", "e": "Si la misión es iniciativa de su Administración y con retribución a su cargo, sigue en servicio activo; servicios especiales es cuando paga el organismo de destino. Marcaste servicios especiales.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "29", "mia": "d", "a": "c", "e": "Ley 4/2021, art. 174: por falta grave cabe la prohibición de ocupar puestos de jefatura hasta 2 años (c), según la plantilla. Marcaste el demérito.", "ley": "Ley 4/2021 CV", "art": "174", "cl": "Sanciones: faltas muy graves (separación del servicio o revocación del interino, suspensión firme de funciones, traslado forzoso…), graves y leves (apercibimiento).", "mn": "«Leve = APERCIBIMIENTO; muy grave = SEPARACIÓN».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880#a1-86"}, {"ex": "Auxiliar administrativo, turno libre (convocatoria n.º", "f": "2026-01-10", "n": "30", "mia": "b", "a": "a", "e": "Ley 4/2021, art. 175: la prescripción de las sanciones se cuenta desde la firmeza de la resolución, no desde que se dicta: la a) es la falsa. Marcaste la b), que es verdadera.", "ley": "Ley 4/2021 CV", "art": "175", "cl": "La prescripción de las sanciones empieza a contar desde la firmeza de la resolución sancionadora.", "mn": "«La sanción prescribe desde que es FIRME, no desde que se dicta».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2021-8880#a1-87"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "1", "mia": "d", "a": "c", "e": "CONTAR solo cuenta números, y las fechas son números: 4 + 2 = 6.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "2", "mia": "c", "a": "a", "e": "De D5 a F8 hay +2 columnas y +3 filas: $B$3 no cambia, C$2 → E$2 y $A5 → $A8.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "3", "mia": "a", "a": "d", "e": "La inspección final no es un principio de la Calidad Total, que se basa en la prevención y la mejora continua.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "6", "mia": "a", "a": "d", "e": "Art. 112 del ROM de Mutxamel: dos días hábiles de antelación.", "ley": "ROM municipal", "art": "112", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "7", "mia": "a", "a": "c", "e": "Art. 48.a del TREBEP: el cuñado es familiar de 2.º grado y la intervención sin hospitalización requiere reposo, así que corresponden 4 días hábiles en la misma localidad.", "ley": "TREBEP", "art": "48", "cl": "Accidente/enfermedad grave, hospitalización o intervención con reposo de familiar de 1.er grado (o conviviente): 5 días hábiles; 2.º grado: 4. Fallecimiento 1.er grado: 3 días (misma localidad) / 5 (distinta); 2.º grado: 2 / 4. Traslado de domicilio: 1 día. Exámenes: el día. Asuntos particulares: 6 días. Matrimonio o pareja de hecho: 15 días.", "mn": "Desde 2025: «Enfermo 5-4, muerto 3-5 / 2-4». Mudanza 1, asuntos propios 6, boda 15 (quincena de novios).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a48"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "8", "mia": "a", "a": "c", "e": "Art. 25 del TREBEP: el personal interino no percibe las retribuciones vinculadas a la carrera profesional.", "ley": "TREBEP", "art": "25", "cl": "Funcionarios interinos: perciben las retribuciones básicas y las complementarias del puesto, pero no las vinculadas a la carrera profesional (y los trienios, sí).", "mn": "«Interino cobra el PUESTO, no la CARRERA».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a25"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "9", "mia": "a", "a": "b", "e": "Art. 63 del TREBEP: es causa de pérdida la nacionalidad, salvo adquisición simultánea de otra de la UE. La renuncia sí puede no aceptarse si hay un expediente disciplinario abierto (art. 64).", "ley": "TREBEP", "art": "63", "cl": "Pérdida de la condición de funcionario de carrera: renuncia, pérdida de la nacionalidad, jubilación total, separación del servicio firme, inhabilitación absoluta o especial firme.", "mn": "«RE-NA-JU-SE-IN»: REnuncia, NAcionalidad, JUbilación, SEparación, INhabilitación. «Rena juse in».", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a63"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "10", "mia": "c", "a": "b", "e": "Art. 68 del TREBEP: la rehabilitación procede por pérdida de la nacionalidad o por jubilación por incapacidad permanente, no por jubilación voluntaria.", "ley": "TREBEP", "art": "68", "cl": "Rehabilitación: en caso de pérdida de la nacionalidad o de jubilación por incapacidad permanente, cuando desaparece la causa objetiva.", "mn": "«Rehabilita: NACIONALIDAD recuperada o INCAPACIDAD curada».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a68"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "11", "mia": "b", "a": "a", "e": "", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "12", "mia": "b", "a": "c", "e": "", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "13", "mia": "c", "a": "a", "e": "Art. 31.2 de la CE: el gasto público responde a criterios de eficiencia y economía.", "ley": "CE", "art": "31", "cl": "Todos contribuyen según su capacidad económica; sistema tributario justo, igualdad y progresividad, nunca confiscatorio.", "mn": "«Todos (no sólo españoles) pagan según CAPACIDAD; justo, IGUAL, PROGRESIVO y NO confiscatorio». Prestaciones públicas sólo con arreglo a la ley.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a31"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "15", "mia": "a", "a": "c", "e": "Les Corts presentan ante la Mesa del Congreso proposiciones de ley, no proyectos (art. 22 del Estatuto).", "ley": "EACV", "art": "22", "cl": "Potestad legislativa, presupuestos, control del Consell, elección del President, designación de senadores…", "mn": "Les Corts «LEGISLAN, PRESUPUESTAN, CONTROLAN y ELIGEN» (al President y a los senadores autonómicos).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235#aveintidos"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "17", "mia": "a", "a": "c", "e": "Art. 22.4 de la LBRL: el ejercicio de acciones judiciales es delegable. Las otras opciones son atribuciones indelegables.", "ley": "LBRL", "art": "22", "cl": "Atribuciones 22.2; delegables e indelegables 22.4.", "mn": "Pleno = todos los Concejales, presidido por el Alcalde. Atribuciones «CONTROL-ORGANIZACIÓN-NORMAS-DINERO»: control de los órganos de gobierno, alteración del término, bandera, ordenanzas y reglamentos, presupuesto, plantilla y RPT, acciones judiciales en sus materias, cuestión de confianza. Indelegables las del 22.4 (salvo las delegables en el Alcalde y la JGL).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a22"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "18", "mia": "b", "a": "c", "e": "Art. 80 de la LBRL: los bienes patrimoniales se rigen por su legislación específica y, en su defecto, por el derecho privado.", "ley": "LBRL", "art": "80", "cl": "Dominio público y comunales: inalienables, inembargables, imprescriptibles.", "mn": "Dominio público y comunales: «las 3 I»: Inalienables, Inembargables, Imprescriptibles (y no sujetos a tributo). Los patrimoniales se rigen por su legislación específica y, en su defecto, por el Derecho privado.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a80"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "22", "mia": "c", "a": "d", "e": "Art. 85 de la Ley 39/2015: si la persona infractora reconoce su responsabilidad, se puede resolver imponiendo la sanción. La c) es falsa porque solo se puede renunciar a los derechos cuando no esté prohibido.", "ley": "LPAC", "art": "85", "cl": "Reconocimiento de responsabilidad y pago voluntario antes de la resolución. Si la sanción es solo pecuniaria: reducciones de al menos el 20% cada una, acumulables, condicionadas al desistimiento o renuncia de recursos administrativos.", "mn": "«Reconoce y paga = 20 + 20»: dos reducciones de AL MENOS el 20% cada una, ACUMULABLES, si la sanción es solo pecuniaria. Condición: renunciar a recurrir en vía administrativa.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a85"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "23", "mia": "d", "a": "a", "e": "Art. 124 de la Ley 39/2015: la reposición se interpone en 1 mes y después solo cabe el contencioso. La lesividad caduca a los 6 meses, no a los 3.", "ley": "LPAC", "art": "124", "cl": "Acto expreso: 1 mes; si no es expreso, en cualquier momento desde el día siguiente al silencio. Resolver y notificar: 1 mes. No cabe nuevo recurso de reposición contra su resolución.", "mn": "Reposición «1-1»: 1 MES para interponer, 1 MES para resolver. Nada de reposición sobre reposición.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a124"}, {"ex": "Auxiliar administrativo/a,", "f": "2026-06-18", "n": "27", "mia": "d", "a": "a", "e": "Art. 4.7 de la Ley 31/1995: la definición incluye expresamente las características generales de los locales e instalaciones.", "ley": "LPRL", "art": "4", "cl": "Prevención, riesgo laboral, daños, riesgo grave e inminente.", "mn": "Definiciones «PRE-RIE-DA-GRI»: PREvención (actividades en todas las fases); RIEsgo laboral (posibilidad de daño; gravedad = probabilidad + severidad); DAños (enfermedades, patologías, lesiones); riesgo Grave e Inminente (probable en un futuro inmediato con daño grave).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292#a4"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "2", "mia": "a", "a": "b", "e": "Preámbulo del Estatuto: la tradición del Reino de Valencia se encuentra con «la concepción moderna del País Valenciano».", "ley": "EACV", "art": "", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "6", "mia": "b", "a": "c", "e": "LBRL 21.3: convocar y presidir el Pleno y la Junta de Gobierno es indelegable. La oferta de empleo, las bases de selección y los instrumentos de gestión urbanística sí se delegan.", "ley": "LBRL", "art": "21", "cl": "Atribuciones 21.1; indelegables 21.3; voto de calidad; bandos.", "mn": "Alcalde: atribuciones residuales. INDELEGABLES «COPRO-JE-SE-UR-PLA»: convocar y presidir, decidir empates, jefatura de personal (separación y despido), medidas urgentes en catástrofes, PLAntillas… Delegables en la JGL o los Tenientes de Alcalde: el resto. Operaciones de crédito previstas en el Presupuesto hasta el 10 % de los recursos ordinarios (las de tesorería, hasta el 15 %).", "veces": 3, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a21"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "7", "mia": "a", "a": "d", "e": "LBRL", "ley": "LBRL", "art": "", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "13", "mia": "c", "a": "d", "e": "Ley 40/2015, arts. 25-31: los principios sancionadores son legalidad, irretroactividad, tipicidad, responsabilidad, proporcionalidad, prescripción y no concurrencia. Ni «buena fe» ni «transparencia».", "ley": "LRJSP", "art": "25", "cl": "Potestad sancionadora reconocida por norma con rango de ley; la ejercen los órganos con atribución expresa (ley o reglamento). Se extiende a la potestad disciplinaria. No se aplica a contratistas ni a relaciones patrimoniales.", "mn": "Potestad sancionadora: reconocida por LEY; atribuida a órganos por ley o REGLAMENTO. Aplicable a lo DISCIPLINARIO del personal; NO a contratistas ni a relaciones patrimoniales. Entes locales: Título XI LBRL.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a25"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "15", "mia": "b", "a": "a", "e": "Ley valenciana 9/2003, art.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "22", "mia": "b", "a": "c", "e": "TREBEP", "ley": "TREBEP", "art": "37", "cl": "Materias objeto de negociación (retribuciones, OEP, provisión, carrera, planes de previsión social, jornada, permisos, vacaciones...) y materias excluidas (potestades de organización, regulación del ejercicio de derechos de los ciudadanos, procedimiento de formación de actos y disposiciones, retribuciones de altos cargos, poderes de dirección...).", "mn": "Se negocia lo que toca «bolsillo y reloj» del empleado (dinero, jornada, vacaciones, permisos, carrera). NO se negocia la «organización»: cómo se organiza la casa ni los derechos del ciudadano.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a37"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "26", "mia": "d", "a": "c", "e": "las instalaciones deportivas son para municipios de más de 5.000 habitantes, el transporte urbano y el medio ambiente urbano para más de 50.000. Ninguna opción vale para todos los de menos de 50.000.", "ley": "TRLRHL", "art": "17", "cl": "30 días mínimo; BOP y, si más de 10.000 hab., diario; sin reclamaciones, definitivo.", "mn": "Ordenanzas fiscales: exposición 30 días mínimo en el tablón; anuncio SIEMPRE en el BOP; además en un diario si la población es >10.000 habitantes (y las Diputaciones). Sin reclamaciones, provisional = definitivo. Ayuntamientos de >20.000 habitantes editan el texto íntegro en el primer cuatrimestre.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a17"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "27", "mia": "b", "a": "d", "e": "TRLRHL 20.3: la tasa de zonas de bajas emisiones grava la circulación de vehículos que superen los límites establecidos.", "ley": "TRLRHL", "art": "20", "cl": "Dominio público + servicio no voluntario o no prestado por el sector privado.", "mn": "Tasa = «DO o SE no voluntario»: utilización privativa o aprovechamiento especial del DOminio público, o prestación de un SErvicio/actividad en régimen de Derecho público que no sea de solicitud voluntaria o que no presta el sector privado.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a20"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "28", "mia": "b", "a": "d", "e": "TRLRHL 31.3: el coste presupuestado de las contribuciones especiales tiene carácter de mera previsión.", "ley": "TRLRHL", "art": "31", "cl": "Base máxima: 90 % del coste.", "mn": "Contribuciones especiales: base imponible MÁXIMA del 90 % del coste (estudios y proyectos, obras, terrenos, indemnizaciones, intereses); el coste es una mera previsión. Se reparte según metros lineales de fachada, superficie, volumen o valor catastral.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a31"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "29", "mia": "d", "a": "c", "e": "TRLRHL 44.2: si el precio público queda por debajo del coste, hay que consignar en el presupuesto la diferencia.", "ley": "TRLRHL", "art": "44", "cl": "Precios públicos: deben cubrir como mínimo el coste del servicio; si por razones sociales se fijan por debajo, hay que consignar la diferencia en el presupuesto.", "mn": "«Precio bajo coste = la diferencia la paga el PRESUPUESTO».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a44"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "32", "mia": "c", "a": "b", "e": "TRLRHL", "ley": "TRLRHL", "art": "13", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a13"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "33", "mia": "a", "a": "b", "e": "TRLRHL 180.2: las limitaciones a las transferencias no afectan a los programas de imprevistos y funciones no clasificadas.", "ley": "TRLRHL", "art": "180", "cl": "No a créditos ampliables ni extraordinarios.", "mn": "Transferencias: «NO AMPLÍO, NO EXTRAORDINO, NO REPITO». No afectan a créditos ampliables ni extraordinarios; no minoran créditos suplementados o ampliados ni incrementan los que han sido objeto de minoración (salvo personal ni programas de imprevistos).", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a180"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "35", "mia": "c", "a": "b", "e": "TRLRHL 185.2: el reconocimiento de obligaciones corresponde al Presidente.", "ley": "TRLRHL", "art": "185", "cl": "Gestión del gasto: el reconocimiento de obligaciones corresponde al Presidente (al Pleno, sin dotación presupuestaria u operaciones especiales de crédito).", "mn": "«Reconoce el PRESIDENTE; el Pleno, solo lo extraordinario».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a185"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "38", "mia": "c", "a": "b", "e": "TRLRHL 212.1: el Presidente rinde la cuenta general antes del 15 de mayo.", "ley": "TRLRHL", "art": "212", "cl": "15 mayo, 1 junio, 15 días, 1 octubre.", "mn": "Cuenta general «15-M, 1-J, 15+8, 1-O»: rinde el Presidente antes del 15 de MAYO; Comisión Especial de Cuentas antes del 1 de JUNIO; exposición pública 15 días + 8 para reclamaciones; Pleno antes del 1 de OCTUBRE; al Tribunal de Cuentas antes del 15 de octubre.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a212"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "39", "mia": "c", "a": "d", "e": "LCSP DA 2.ª: en las entidades locales, los pliegos generales los aprueba el Pleno.", "ley": "LCSP", "art": "", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "41", "mia": "d", "a": "b", "e": "LCSP 107.2: garantía complementaria de hasta el 5 % (sin IVA), con un total máximo del 10 %.", "ley": "LCSP", "art": "107", "cl": "Garantía definitiva: 5 % del precio de adjudicación (sin IVA). Garantía complementaria: hasta otro 5 %, con un total máximo del 10 %.", "mn": "«5 + 5 = máximo 10».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-19"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "42", "mia": "d", "a": "c", "e": "LCSP 111.2: la devolución de la garantía se acuerda en 2 meses desde el fin del plazo de garantía.", "ley": "LCSP", "art": "111", "cl": "Devolución de la garantía: se acuerda en dos meses desde el fin del plazo de garantía.", "mn": "«Garantía: 2 meses para devolverla».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-23"}, {"ex": "Administrativo/a (19 plazas),", "f": "2026-07-01", "n": "44", "mia": "d", "a": "c", "e": "planes plurianuales de formación (no anuales).", "ley": "LPAC", "art": "47", "cl": "Lesionen derechos susceptibles de amparo; órgano manifiestamente incompetente por materia o territorio; contenido imposible; constitutivos de infracción penal; prescindiendo total y absolutamente del procedimiento o de las normas de órganos colegiados; facultades sin requisitos esenciales; otros por ley. Disposiciones nulas (47.2).", "mn": "Nulidad = «DOCE PEO»: Derechos de amparo · Órgano manifiestamente incompetente por MATERIA o TERRITORIO (¡jerarquía NO, eso es anulable!) · Contenido imposible · Delito · Prescindir TOTAL y absolutamente del procedimiento · Facultades sin requisitos Esenciales · Otros por Ley. Las disposiciones (47.2) también son nulas si vulneran la CE, leyes o normas superiores, regulan materias reservadas a ley o establecen retroactividad sancionadora desfavorable.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a47"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "8", "mia": "?", "a": "c", "e": "Ley 19/2013, art. 18.1.c: se inadmite la información para cuya divulgación sea necesaria una acción previa de reelaboración. Las otras opciones son límites del art. 14 (se deniegan, no se inadmiten).", "ley": "Ley 19/2013", "art": "18", "cl": "Causas de inadmisión: información en elaboración, auxiliar o de apoyo (notas, borradores, informes internos), que requiera reelaboración, dirigida a órgano que no la tenga sin conocerse el competente, solicitudes manifiestamente repetitivas o abusivas.", "mn": "«E-A-R-Ó-R»: Elaboración, Auxiliar, Reelaboración, Órgano desconocido, Repetitiva/abusiva.", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a18"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "10", "mia": "?", "a": "c", "e": "RBEL, art. 8.4: la alteración automática se produce con la aprobación definitiva de los planes de ordenación urbana y de los proyectos de obras y servicios, la adscripción de bienes patrimoniales por más de 25 años y la usucapión de un bien destinado a uso o servicio público.", "ley": "RBEL", "art": "8", "cl": "Alteración de la calificación jurídica de los bienes: expediente con información pública de un mes; es automática con la aprobación definitiva de los planes de ordenación urbana y de proyectos de obras y servicios.", "mn": "«El PLAN o el PROYECTO cambian el bien solos».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-17958#art8"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "11", "mia": "?", "a": "a", "e": "LCSP, art. 117.1: la resolución que aprueba el expediente de contratación implica también la aprobación del gasto (fase A).", "ley": "LCSP", "art": "117", "cl": "La aprobación del expediente de contratación implica la aprobación del gasto (salvo cuando la norma exija aprobación separada).", "mn": "«Apruebo expediente = apruebo GASTO».", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-29"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "12", "mia": "?", "a": "a", "e": "La estructura de los presupuestos locales la aprueba la Orden EHA/3565/2008, de 3 de diciembre.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "13", "mia": "?", "a": "d", "e": "TRLRHL, art. 177.4: se financian con remanente líquido de tesorería, nuevos o mayores ingresos y anulaciones o bajas de créditos (y operaciones de crédito para inversiones). La venta de bienes patrimoniales no está en la lista.", "ley": "TRLRHL", "art": "177", "cl": "Informe de Intervención; Pleno; mismos trámites que el presupuesto.", "mn": "Crédito extraordinario (NO existe crédito) y suplemento (crédito INSUFICIENTE): lo incoa el Presidente, informa la Intervención y aprueba el PLENO con los trámites del presupuesto.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a177"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "14", "mia": "?", "a": "b", "e": "TRLRHL, art. 48 bis: todas las operaciones financieras están sujetas al principio de prudencia financiera.", "ley": "TRLRHL", "art": "48 bis", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a48bis"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "15", "mia": "?", "a": "b", "e": "TRLRHL, art. 184.1: las fases son A-D-O-P: autorización, disposición, reconocimiento de la obligación y ordenación del pago. El pago material no es una fase.", "ley": "TRLRHL", "art": "184", "cl": "A-D-O-P.", "mn": "Fases del gasto «A-D-O-P» = «Ana Dice Oye Paga»: Autorización, Disposición (compromiso), reconocimiento de la Obligación y ordenación del Pago. Se pueden acumular (AD, ADO).", "veces": 2, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a184"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "17", "mia": "?", "a": "a", "e": "LBRL, art. 27.3: el medio ambiente urbano es competencia propia del municipio (art. 25.2.b), no una competencia delegable. Las otras tres sí están en la lista del 27.3.", "ley": "LBRL", "art": "27", "cl": "El Estado y las CCAA pueden delegar competencias en los municipios; mínimo 5 años; con financiación.", "mn": "Delegación «5-F»: duración mínima de 5 AÑOS y siempre con FINANCIACIÓN suficiente. La Administración que delega conserva la dirección y el control.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a27"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "19", "mia": "?", "a": "d", "e": "Ley 39/2015, art.", "ley": "LPAC", "art": "", "cl": "", "mn": "", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "20", "mia": "?", "a": "a", "e": "Ley 39/2015, art. 40.2: la notificación se cursa en 10 días desde que se dicta el acto.", "ley": "LPAC", "art": "40", "cl": "Se notifican las resoluciones y actos que afecten a derechos e intereses, en 10 días desde que se dictan, con texto íntegro, si pone fin a la vía administrativa, recursos, órgano y plazo. Notificación defectuosa: efectos desde que el interesado se da por enterado. Basta el intento con texto íntegro para cumplir el plazo máximo.", "mn": "Notificación «10 días»: se cursa dentro de los 10 días desde que se dicta el acto. Contiene el texto íntegro, si pone fin a la vía administrativa, los recursos, el órgano y el plazo. Notificación defectuosa = efectos desde que el interesado se da por enterado. Para cumplir el plazo de resolver basta el INTENTO de notificación debidamente acreditado.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a40"}, {"ex": "Administrativo/a, Ajuntament", "f": "2026-07-13", "n": "25", "mia": "?", "a": "d", "e": "TRLOTUP, art.", "ley": "Sin ley identificada", "art": "", "cl": "", "mn": "", "veces": 1, "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica d", "f": "2026-09", "n": 4, "mia": "a", "a": "d", "e": "RGPD art. 5.1.c: minimización de datos (adecuados, pertinentes y limitados a lo necesario). Pedir datos «por si acaso» la vulnera. Marcaste exactitud.", "ley": "LOPDGDD", "art": "5", "cl": "Deber de confidencialidad de responsables, encargados y quienes intervengan; se mantiene aunque haya finalizado la relación.", "mn": "«Secreto que NO caduca»: sigue tras terminar la relación.", "veces": 1, "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673#a5"}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica d", "f": "2026-09", "n": 14, "mia": "d", "a": "b", "e": "Art. 68.4 Ley 39/2015: si un obligado a relacionarse electrónicamente presenta en papel, se le requiere la subsanación y vale la fecha de la subsanación. Marcaste «transformar de oficio».", "ley": "LPAC", "art": "68", "cl": "10 días para subsanar; si no, desistido previa resolución. Ampliable hasta 5 días más (no en selectivos ni concurrencia competitiva). Presentación presencial de obligados: subsanar por vía electrónica.", "mn": "Subs dministraciones Públicas, ¿qué actuación procede llevar a cabo por la Administración?", "o": ["Admitir la solicitud en soporte papel sin ninguna cortapisa por ser la primera vez que la entidad efectúa una presentación de estas características ante dicho organismo", "Requerir a la sociedad interesada para que subsane el defecto mediante la presentación electrónica, considerándose como fecha de presentación aquella en la que efectivamente se haya realizado dicha subsanación", "Proceder al archivo inmediato de la solicitud presentada sin necesidad de requerir al interesado ni conceder plazo alguno para enmendar el medio de presentación empleado", "Transformar de oficio la solicitud al formato digital de manera automática, conservando en todo caso y de forma retroactiva la fecha inicial en que se presentó el documento en papel"], "a": "b", "mia": "d", "res": "Mal", "e": "Art. 68.4 Ley 39/2015: si un obligado a relacionarse electrónicamente presenta en papel, se le requiere la subsanación y vale la fecha de la subsanación. Marcaste «transformar de oficio».", "ley": "LPAC", "art": "68", "mn": "Subsanación: «10 + 5» días (los 5 de ampliación NO en selectivos ni concurrencia competitiva). Si no se subsana = DESISTIDO, previa resolución. Si un obligado presenta en papel: se le requiere subsanar electrónicamente y la fecha válida es la de la subsanación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a68"}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 15, "q": "Según la Ley 39/2015, de Procedimiento Administrativo Común, si se notifica un acto un lunes con un plazo de diez días hábiles y sin regla especial, ¿cómo comienza su cómputo?", "o": ["Se inicia de forma simultánea en la misma jornada del lunes en que se practica la notificación", "Q Se inicia a partir del día siguiente al de la notificación, excluyendo sábados, domingos y festivos", "Se inicia obligatoriamente el primer día natural del mes siguiente al de recibir la notificación", "Se inicia a partir del segundo día hábil posterior al acto, computando los sábados como días hábiles"], "a": "b", "mia": "b", "res": "Bien", "e": "", "ley": "LPAC", "art": "", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 16, "q": "¿Cuál de los siguientes actos debe ser motivado, con sucinta referencia de hechos y fundamentos de derecho?", "o": ["Todo acto de mero trámite, sin excepción", "EI acto que limite derechos subjetivos o intereses legítimos", "Únicamente las comunicaciones internas", "Solo los actos favorables solicitados por el interesado. dicta una resolución prescindiendo total y absolutamente del procedimiento legalmente establecido. EI acto conforme al procedjamiento a'd7mjnisntrafivo colmtún de las administraciones públicas es: A) Válido mientras no se recurra. Nulo de pleno derecho. C) Meramente irregular sin efectos sobre su validez. D) Anulable solo si se dicta fuera de plazo"], "a": "b", "mia": "b", "res": "Bien", "e": "", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 19, "q": "Una resolución administrativa no pone fin a la vía administrativa y ha sido dictada por un órgano que cuenta con un superior jerárquico. Conforme a la legislación vigente, ¿qué recurso administrativo ordinario procede interponer contra dicha resolución?", "o": ["Un recurso potestativo de reposición que debe interponerse preceptivamente ante el mismo órgano administrativo que dictó el acto recurrido", "Un recurso de alzada ante el órgano superior jerárquico competente, el cual puede presentarse tanto ante eI órgano que dictó el acto impugnado como ante el propio órgano competente para resolver", "Un recurso extraordinario de revisiÓn que puede fundamentarse en cualquier motivo o alegación jurídica planteada por el interesado", "Ningún tipo de recurso administrativo en esta fase, debiendo acudir directamente a la vía jurisdiccional contencioso-administrativa"], "a": "b", "mia": "-", "res": "Blanco", "e": "Arts. 121-122 Ley 39/2015: alzada ante el superior; se puede presentar ante el que dictó el acto o ante el competente.", "ley": "LPAC", "art": "", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565"}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 20, "q": "Según el artículo 18 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, ¿cuándo se considera que existe un contrato mixto?", "o": ["Cuando un contrato tenga un valor estimado superior a los umbrales establecidos para los contratos sujetos a regulación armonizada", "Cuando un contrato tenga por objeto exclusivamente prestaciones correspondientes a diferentes tipos de contratos de servicios", "Cuando las prestaciones de un contrato correspondan a diferentes clases de contratos de obras, suministros o servicios", "Cuando intervengan en ei contrato dos o más Administraciones Públicas"], "a": "c", "mia": "-", "res": "Blanco", "e": "Art. 18.1 LCSP: contrato mixto = prestaciones de otro u otros contratos de distinta clase.", "ley": "LCSP", "art": "18", "mn": "«Manda la principal»: el contrato mixto se rige por la prestación de MÁS valor.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-10"}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 21, "q": "La UPV contrata la adquisiciÓn de cien ordenadores ya fabricados, sin que la prestación principal consista en desarrollar un Programa a medida. ¿Qué clase de contrato es?", "o": ["Contrato de obras", "Contrato de suministro", "Concesión de servicios", "Contrato privado de patrocinio"], "a": "b", "mia": "b", "res": "Bien", "e": "", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex
