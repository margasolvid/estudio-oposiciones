co del destinatario para cifrar ei mensaje. D) Debe solicitar al destinatario su clave privada"], "a": "d", "mia": "d", "res": "Bien", "e": "", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 103, "q": "se envía un mensaje de correo electrónico cifrado mediante —Ybcertificados (S/MIME), utilizando un par de claves propio para cada destinatario, a dos destinatarios diferentes. ¿Qué condiciÓn debe cumplirse para que ambos puedan acceder al contenido?", "o": ["Ambos deben compartir una misma clave privada", "EI remitente debe publicar su clave privada", "Ambos destinatarios deben estar incluidos en CCO", "EI contenido debe estar protegido de forma que cada destinatario autorizado pueda descifrarlo con su propia clave privada"], "a": "d", "mia": "-", "res": "Blanco", "e": "S/MIME: cada destinatario descifra con su propia clave privada.", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 104, "q": "En un documento extenso todos los títulos principales deben mantener exactamente el mismo formato. Posteriormente se decide modificar simultáneamente el tipo y tamaño de letra de todos ellos. ¿Cuál es la forma más adecuada?", "o": ["Aplicar un mismo estilo a los títulos Y modificar posteriormente la definición de dicho estilo", "Modificar cada título manualmente", "Insertar saltos de página delante de todos los títulos", "Convertir los títulos en imágenes"], "a": "a", "mia": "-", "res": "Blanco", "e": "Estilos de Word: modificar la definición del estilo.", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 105, "q": "Un documento debe presentar todas sus páginas en orientación vertical, excepto una página que contiene una tabla muy an  cuando la puntuación obtenida es igual o superior a 50 puntos. Se desea introducir en C2 una fórmula que pueda copiarse hacia abajo y muestre «APTO)) si la puntuación es 50 y «NO APTO» en caso contrario. ¿Cuál es la fórmula correcta?", "o": ["1 2 3 4 Aspirante Ana Carlos Elena Puntuación 67 49 50 Resultado", "APTO\")", "APTO\")", "APTO\")"], "a": "a", "mia": "a", "res": "Bien", "e": "", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 113, "q": "Una unidad importa a Excel un archivo CSV. Entre sus campos figura el código de expediente, que debe conservarse exactamente como aparece en origen. Tras una importación incorrecta se pierden los ceros iniciales. ¿Qué tratamiento resulta más adecuado durante la importación?", "o": ["Código expediente 00125 00087 00004 01230 Importe 850 € 1.240 € 375 € 2.100 €", "Importar necesariamente la columna como número entero", "Importarla como fecha", "Importarla como porcentaje y aplicar después formato personalizado. D Importar la columna como texto o mediante un tipo de dato que preserve literalmente los códigos"], "a": "d", "mia": "d", "res": "Bien", "e": "", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 114, "q": "Durante una reunión online realizada mediante Microsoft Teams, se desea que una persona pueda compartir su pantalla Y presentar contenido, mientras que el resto de participantes tenga permisos más limitados. ¿Cuál de las siguientes actuaciones resulta más adecuada?", "o": ["signar roles diferenciados en la reunión, como presentador y asistente", "Proporcionar a todos las credenciales del organizador", "Convertir todos los documentos a PDF", "Utilizar el campo CCO"], "a": "a", "mia": "a", "res": "Bien", "e": "", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1 (2025/P/FC/C/4), Universitat Politècnica de València", "f": "2026-09", "n": 115, "q": "DUrante una reuniÓn online mediante Microsoft Teams, varios miembros de un equipo de trabajo necesitan revisar COnjuntamente un mismo documento de Microsoft 365, evitando generar diferentes copias del archivo. ¿cuál de las siguientes opciones resulta más adecuada?", "o": ["Enviar una copia independiente a cada participante Y fUSionarlas posteriormente", "B compartir un único archivo con los permisos adecuados Y trabajar sobre el recurso común cuando sea compatible con coautoría•", "convertir todas las páginas en imágenes y enviarlas por el chat", "Bloquear el documento para impedir cualquier edición"], "a": "b", "mia": "b", "res": "Bien", "e": "", "ley": "Sin ley identificada", "art": "", "mn": "", "url": ""}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 1, "q": "Cuál de los siguientes principios constitucionales no se halla consagrado en el artículo 9.3 de la Constitución Española de 1978:", "o": ["principio de seguridad jurídica.", "principio de jerarquía normativa.", "principio de prohibición de la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales.", "principio de protección del medio ambiente."], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 9.3 CE", "ley": "CE", "art": "9", "mn": "9.3 = «LE-JE-PU-IRRE-SE-RE-IN» (7 principios): LEgalidad, JErarquía normativa, PUblicidad de las normas, IRREtroactividad de las sancionadoras no favorables o restrictivas, SEguridad jurídica, REsponsabilidad e INterdicción de la arbitrariedad de los poderes públicos. Ojo: la «eficacia» NO está (es del art. 103).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a9"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 2, "q": "Indique cuál de las siguientes afirmaciones es correcta:", "o": ["De conformidad con el artículo 53.2 de la Constitución Española de 1978, Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de preferencia y sumariedad y, en su caso, a través del recurso de amparo ante el Tribunal Constitucional. Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30.", "De conformidad con el artículo 53.2 de la Constitución Española de 1978, Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de inmediatez y sumariedad y, en su caso, a través del recurso de amparo ante el Tribunal Constitucional. Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30.", "De conformidad con el artículo 53.2 de la Constitución Española de 1978, Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de preferencia y sumariedad y, en su caso, a través del recurso de amparo ante el Tribunal Constitucional. Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 35.", "De conformidad con el artículo 51.2 de la Constitución Española de 1978, Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de preferencia y sumariedad y, en su caso, a través del recurso de amparo ante el Tribunal Constitucional. Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 35."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 53.2 CE", "ley": "CE", "art": "53", "mn": "Garantías «53.1 ley-contenido esencial; 53.2 preferente, sumario y amparo (art. 14, Sección 1.ª y objeción del art. 30); 53.3 principios rectores que informan la legislación y solo se alegan conforme a sus leyes».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a53"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 3, "q": "Qué artículo dedica la Constitución Española de 1978 consagra el principio de igualdad y no discriminación por razón de nacimiento, raza, sexo, religión opinión o cualquier otra condición o circunstancia personal o social?", "o": ["Artículo 14.", "Artículo 53.", "Artículo 54.", "Artículo 55."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 14 CE", "ley": "CE", "art": "14", "mn": "Igualdad ante la ley, sin discriminación por «NARASEREOP»: NAcimiento, RAza, SExo, RElig., OPinión o cualquier otra condición o circunstancia personal o social. Es amparable.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a14"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 4, "q": "De conformidad con la Constitución Española de 1978, los municipios:", "o": ["Carecen de personalidad jurídica propia.", "Gozan de autonomía para la gestión de sus respectivos intereses y tienen personalidad jurídica plena.", "Dependen jerárquicamente de la Diputación Provincial.", "Solo tienen autonomía cuando su población supera los 5.000 habitantes."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 140 CE", "ley": "CE", "art": "140", "mn": "Municipio: autonomía garantizada y personalidad jurídica PLENA (la provincia, PROPIA: art. 141). Concejales elegidos por sufragio universal, igual, libre, directo y secreto; el Alcalde, por los concejales o por los vecinos. La ley regula el concejo abierto.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a140"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 5, "q": "Según la Ley 7/1985, de 2 de abril, de Bases del Régimen Local son elementos del municipio:", "o": ["El territorio, la población y la organización.", "El alcalde, el pleno y la junta de gobierno local.", "El territorio, el presupuesto y el padrón.", "La población, la provincia y la comunidad autónoma."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 11.2 LRBRL", "ley": "LBRL", "art": "11", "mn": "Municipio = entidad local básica de la organización territorial del Estado. Elementos «TPO»: Territorio, Población y Organización. Personalidad jurídica y plena capacidad.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a11"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 6, "q": "Según la Ley 39/2015, de 1 de octubre, de Procedimiento Administrativo Común de las Administraciones Públicas, cuando un plazo administrativo se señale por días sin indicar que estos son naturales, se entiende que son:", "o": ["Naturales, incluidos sábados, domingos y festivos.", "Hábiles, excluyéndose únicamente los domingos.", "Hábiles, excluyéndose sábados, domingos y festivos.", "Naturales, excluyéndose únicamente los festivos nacionales."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 30.2 LPACAP", "ley": "LPAC", "art": "30", "mn": "Plazos: horas hábiles (máximo 24 h; si es más, se expresan en días). Días = HÁBILES, sin sábados, domingos ni festivos. Se cuentan desde el día SIGUIENTE. Meses y años, de fecha a fecha; si no hay día equivalente, el último del mes. Si el último día es inhábil, se prorroga al primer hábil siguiente. Si un día es hábil donde reside el interesado e inhábil en la sede del órgano (o al revés), es INHÁBIL en todo caso.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a30"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 7, "q": "Según la Ley 39/2015, de 1 de octubre, de Procedimiento Administrativo Común de las Administraciones Públicas, si una solicitud de iniciación no reúne los requisitos exigidos, el plazo general que debe concederse para subsanarla es de:", "o": ["Cinco días.", "Diez días.", "Quince días.", "Un mes."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 68.1 LPACAP", "ley": "LPAC", "art": "68", "mn": "Subsanación: «10 + 5» días (los 5 de ampliación NO en selectivos ni concurrencia competitiva). Si no se subsana = DESISTIDO, previa resolución. Si un obligado presenta en papel: se le requiere subsanar electrónicamente y la fecha válida es la de la subsanación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a68"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 8, "q": "Tiene la consideración de contrato menor de servicios, conforme a la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público, aquel cuyo valor estimado sea:", "o": ["Inferior a 15.000 euros.", "Igual o inferior a 15.000 euros.", "Inferior a 40.000 euros.", "Igual o inferior a 40.000 euros."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 118 LCSP", "ley": "LCSP", "art": "118", "mn": "«40 la obra, 15 lo demás»: piensa «40 ladrillos, 15 cajas». El expediente menor es «NAF»: Necesidad, Aprobación del gasto, Factura. (Duración ≤ 1 año sin prórroga está en el art. 29.8).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-30"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 9, "q": "Según el Estatuto Básico del Empleado Público, el personal eventual realiza únicamente funciones expresamente calificadas como:", "o": ["Técnicas y permanentes.", "De autoridad pública.", "De confianza o asesoramiento especial.", "De inspección y sanción."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 12.1 TREBEP", "ley": "TREBEP", "art": "12", "mn": "Personal eventual: confianza o asesoramiento especial, nombramiento y cese LIBRES, cesa al cesar la autoridad, NO es mérito para el acceso ni la promoción, y se le aplica el régimen de los funcionarios de carrera en lo adecuado.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a12"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 10, "q": "De conformidad con el artículo 35 de la Ley 39/2015, de 1 de octubre, de Procedimiento Administrativo Común de las Administraciones Públicas, serán motivados, con sucinta referencia de hechos y fundamentos de derecho:", "o": ["Los actos que limiten derechos subjetivos o intereses legítimos.", "Los actos que se dicten en el ejercicio de potestades regladas.", "Los actos que acepten pruebas propuestas por los interesados.", "los actos de trámite no cualificados."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 35 LPACAP", "ley": "LPAC", "art": "35", "mn": "Motivación: «LiReSeSuUrPruTerPro…» → Limiten derechos · Resuelvan revisión de oficio, recursos y arbitraje · Se Separen del criterio precedente · Suspensión y medidas provisionales · Urgencia, ampliación y actuaciones complementarias · Rechacen Pruebas · Terminación por imposibilidad y desistimiento de la Administración · Propuestas en procedimientos sancionadores y de responsabilidad · potestades discrecionales.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a35"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 11, "q": "A efectos del cómputo de un plazo fijado en días hábiles, un interesado presenta electrónicamente un documento en un día inhábil. Salvo que una norma permita expresamente la recepción en día inhábil, la Ley 39/2015 dispone que:", "o": ["Se entenderá presentado a las 00:00 horas del mismo día inhábil.", "Se entenderá presentado en la primera hora del primer día hábil siguiente, respetándose el orden de presentación efectiva entre los documentos presentados en el día inhábil.", "Se entenderá presentado al finalizar el primer día hábil siguiente.", "Se entenderá presentado fuera de plazo."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 31.2.b LPACAP", "ley": "LPAC", "art": "31", "mn": "Registro electrónico 24/7: lo presentado en día INHÁBIL se entiende presentado a la PRIMERA HORA del primer día HÁBIL siguiente. Los plazos para la Administración se cuentan desde la fecha y hora de entrada en SU registro electrónico.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a31"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 12, "q": "Si un plazo administrativo se fija en meses y en el mes de vencimiento no hubiera día equivalente a aquel en que comienza el cómputo, el plazo expirará:", "o": ["El primer día hábil del mes siguiente.", "El día inmediatamente anterior al último día del mes.", "El último día del mes.", "A los treinta días naturales desde el inicio del cómputo."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 30.4 LPACAP", "ley": "LPAC", "art": "30", "mn": "Plazos: horas hábiles (máximo 24 h; si es más, se expresan en días). Días = HÁBILES, sin sábados, domingos ni festivos. Se cuentan desde el día SIGUIENTE. Meses y años, de fecha a fecha; si no hay día equivalente, el último del mes. Si el último día es inhábil, se prorroga al primer hábil siguiente. Si un día es hábil donde reside el interesado e inhábil en la sede del órgano (o al revés), es INHÁBIL en todo caso.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a30"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 13, "q": "Cuando una notificación electrónica sea obligatoria y el interesado no acceda a su contenido, se entenderá rechazada cuando hayan transcurrido desde su puesta a disposición:", "o": ["Dieciocho días hábiles.", "Diez días naturales.", "Quince días naturales.", "Un mes."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 43.2 LPACAP", "ley": "LPAC", "art": "43", "mn": "Notificación electrónica: se practica por comparecencia en la sede o en la DEHú. Se entiende practicada al ACCEDER. Rechazada a los 10 días NATURALES sin acceso. El aviso al correo es informativo: su falta NO invalida la notificación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a43"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 14, "q": "La Administración ha puesto correctamente a disposición una notificación electrónica, pero no ha enviado el aviso complementario al correo electrónico comunicado por el interesado. Conforme a la Ley 39/2015:", "o": ["La notificación es nula de pleno derecho.", "La notificación es anulable y debe repetirse.", "La falta del aviso impide que empiece a computarse cualquier plazo.", "La falta del aviso no impide que la notificación sea considerada plenamente válida."], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 41.6 LPACAP", "ley": "LPAC", "art": "41", "mn": "Notificaciones: preferentemente electrónicas. En papel solo con comparecencia espontánea en la oficina de asistencia o con entrega directa por un empleado público. Medios de pago (cheques) NUNCA por vía electrónica. Rechazo = se tiene por efectuada. Si se notifica por varios cauces vale la PRIMERA.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a41"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 15, "q": "Conforme a la Ley 40/2015, la actuación de una autoridad en la que concurra un motivo de abstención:", "o": ["Determina siempre la nulidad de pleno derecho del acto.", "Determina siempre la anulabilidad del acto.", "No implica necesariamente, y en todo caso, la invalidez de los actos en que haya intervenido.", "Solo es relevante si el interesado formuló recusación antes de dictarse el acto."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 23.4 LRJSP", "ley": "LRJSP", "art": "23", "mn": "Abstención «IN-PA-AM-PE-SE»: INterés personal · PArentesco (consanguinidad 4.º, afinidad 2.º) · AMistad íntima o enemistad manifiesta · PErito o testigo · SErvicio o servicios profesionales en los últimos 2 AÑOS. Actuar con causa de abstención NO invalida necesariamente el acto, pero genera responsabilidad.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a23"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 16, "q": "Con carácter general, el Pleno de una corporación local se constituye válidamente cuando asisten:", "o": ["La mayoría absoluta del número legal de miembros, sin más requisitos.", "Un tercio del número legal de miembros, que nunca podrá ser inferior a tres, debiendo asistir además el Presidente y el Secretario o quienes legalmente les sustituyan, y mantenerse el quórum durante toda la sesión.", "Una cuarta parte del número legal de miembros, con un mínimo de dos.", "La mitad más uno de los concejales presentes al inicio de la sesión."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 46.2.c LRBRL", "ley": "LBRL", "art": "46", "mn": "Plenos ordinarios «1-2-3»: >20.000 hab. y Diputaciones cada MES; 5.001-20.000 cada DOS meses; ≤5.000 cada TRES. Extraordinaria: Presidente o 1/4 del número legal (máx. 3 solicitudes por concejal y año), en 15 días hábiles. Convocatoria con 2 días HÁBILES. Quórum: 1/3 del número legal, nunca menos de 3, con Presidente y Secretario. Votación ordinaria por regla general.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a46"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 17, "q": "Según la Ley 7/1985, en los ayuntamientos de municipios con una población entre 5.001 y 20.000 habitantes, el Pleno celebrará sesión ordinaria como mínimo:", "o": ["Cada mes.", "Cada dos meses.", "Cada tres meses.", "Cada seis meses."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 46.2.a LRBRL", "ley": "LBRL", "art": "46", "mn": "Plenos ordinarios «1-2-3»: >20.000 hab. y Diputaciones cada MES; 5.001-20.000 cada DOS meses; ≤5.000 cada TRES. Extraordinaria: Presidente o 1/4 del número legal (máx. 3 solicitudes por concejal y año), en 15 días hábiles. Convocatoria con 2 días HÁBILES. Quórum: 1/3 del número legal, nunca menos de 3, con Presidente y Secretario. Votación ordinaria por regla general.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a46"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 18, "q": "Si uno de los límites al derecho de acceso a la información pública afecta solo a una parte de la información solicitada, la Ley 19/2013 establece, con carácter general, que:", "o": ["Debe denegarse íntegramente el acceso.", "Debe concederse acceso parcial, omitiendo la información afectada por el límite, salvo que resulte una información distorsionada o carente de sentido, e indicando al solicitante qué parte se ha omitido.", "Debe suspenderse el procedimiento hasta que desaparezca el límite.", "Solo puede concederse acceso si existe consentimiento de todos los terceros afectados."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 16 de la Ley 19/2013, de transparencia, acceso a la información pública y buen gobierno.", "ley": "Ley 19/2013", "art": "16", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2013-12887#a16"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 19, "q": "En un contrato de servicios, para calcular el valor estimado conforme a la Ley 9/2017:", "o": ["Se incluye el IVA y se excluyen las prórrogas.", "Se excluye el IVA y, entre otros conceptos, deben tenerse en cuenta las eventuales prórrogas y opciones.", "Se incluye el IVA, pero solo se computan las modificaciones ya aprobadas.", "Se excluye el IVA y también las eventuales prórrogas, porque estas forman parte únicamente del precio final."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 101.1.a y 101.2 LCSP", "ley": "LCSP", "art": "101", "mn": "Valor ESTIMADO = «sin IVA y con TODO lo posible» (prórrogas + modificaciones previstas). Presupuesto base (art. 100) = «CON IVA».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-13"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 20, "q": "¿Cuál de las siguientes NO es una causa legal para formular reclamación contra el presupuesto general de una entidad local durante su exposición pública?", "o": ["Que su elaboración y aprobación no se hayan ajustado a los trámites establecidos en la ley.", "Que se haya omitido crédito necesario para obligaciones exigibles a la entidad local.", "Que exista manifiesta insuficiencia de los ingresos en relación con los gastos presupuestados.", "La discrepancia con las prioridades políticas de gasto elegidas por la corporación."], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 170.2 TRLRHL.", "ley": "TRLRHL", "art": "170", "mn": "Reclamaciones contra el presupuesto «TRA-OMI-INSU»: solo por TRAmitación incorrecta, OMIsión de créditos para obligaciones exigibles o INSUficiencia manifiesta de ingresos o gastos. Interesados: habitantes, directamente afectados y entidades representativas.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a170"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 21, "q": "El nombramiento de un funcionario interino por exceso o acumulación de tareas puede tener, conforme al TREBEP, una duración máxima de:", "o": ["Seis meses dentro de un período de doce meses.", "Nueve meses dentro de un período de dieciocho meses.", "Doce meses dentro de un período de veinticuatro meses.", "Tres años, ampliables por doce meses más."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art. 10.1.d TREBEP", "ley": "TREBEP", "art": "10", "mn": "Interinos «V-S-P-E»: Vacante (máximo 3 años), Sustitución, Programas (3 años + 12 meses), Exceso o acumulación de tareas (9 meses dentro de 18).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a10"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 22, "q": "¿Cuál de los siguientes constituye un impuesto que los ayuntamientos deben exigir obligatoriamente de acuerdo con el Real Decreto Legislativo 2/2004, de 5 de marzo, por el que se aprueba el texto refundido de la Ley Reguladora de las Haciendas Locales.?", "o": ["Impuesto sobre el incremento de valor de los terrenos de naturaleza urbana.", "Impuesto sobre construcciones, instalaciones y obras.", "Impuesto sobre el valor añadido.", "Impuesto sobre actividades económicas."], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 59 TRLRHL", "ley": "TRLRHL", "art": "59", "mn": "Obligatorios «IBI-IAE-IVTM» (los 3 de siempre: la casa, el negocio y el coche). Potestativos «ICIO e IIVTNU» (las obras y la plusvalía). Los potestativos se establecen por ordenanza fiscal.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a59"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 24, "q": "De acuerdo con el artículo 28 del Decreto Legislativo 1/2021, de 18 de junio, del Consell de aprobación del texto refundido de la Ley de ordenación del territorio, urbanismo y paisaje, los instrumentos de planeamiento clasifican el suelo en:", "o": ["Suelo urbano, suelo rústico y suelo protegido.", "Suelo urbano, suelo urbanizable y suelo no urbanizable.", "Suelo consolidado y suelo no consolidado.", "Suelo urbanizado y suelo rural."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 28 TRLOTUP", "ley": "TRLOTUP", "art": "28", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=DOGV-r-2021-90283#a2-10"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 25, "q": "De acuerdo con el estatuto jurídico de la propiedad del suelo previsto en el Real Decreto Legislativo 7/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley de Suelo y Rehabilitación Urbana, son situaciones básicas del suelo:", "o": ["el suelo en situación rural y el suelo en situación de urbanizado.", "el suelo en situación de no urbanizable y el suelo en situación de urbano.", "el suelo en situación de urbano y el suelo en situación de rústico.", "el Decreto Legislativo 7/2015 no prevé las situaciones básicas en las que puede encontrarse el suelo."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Arts 11 y ss TRLSRU", "ley": "trlsru", "art": "11", "mn": "", "url": ""}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 26, "q": "De conformidad con el artículo 5.1 de la Ley 40/2015 de 1 de octubre de Régimen Jurídico del Sector Público:", "o": ["Tendrán la consideración de órganos administrativos las unidades administrativas a las que se les atribuyan funciones que tengan efectos jurídicos frente a terceros, o cuya actuación tenga carácter facultativo.", "Tendrán la consideración de órganos administrativos las unidades administrativas a las que se les atribuyan funciones que puedan tener efectos jurídicos frente a terceros, o cuya actuación tenga carácter preceptivo.", "Tendrán la consideración de órganos administrativos las unidades administrativas a las que se les atribuyan funciones que tengan efectos jurídicos frente a terceros, o cuya actuación tenga carácter preceptivo.", "Tendrán la consideración de órganos administrativos todas las unidades administrativas existentes en las Administraciones Públicas."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 5.1 LRJSP", "ley": "LRJSP", "art": "5", "mn": "Crear un órgano «IN-FU-CRE»: INtegración y dependencia jerárquica · FUnciones y competencias · CRÉditos. Prohibido duplicar órganos sin suprimir o restringir el existente.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566#a5"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 27, "q": "De acuerdo con el artículo 65.1 de la Ley 9/2017, de 8 noviembre, de Contratos del Sector Público, para poder contratar con el sector público las personas naturales o jurídicas deberán, entre otros requisitos:", "o": ["Estar necesariamente clasificadas como contratistas.", "Tener plena capacidad de obrar, no estar incursas en prohibición de contratar y acreditar la solvencia exigible.", "Tener domicilio social en España y no presentar pérdidas.", "Ser titulares de una autorización administrativa previa para contratar."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 65.1 LCSP", "ley": "LCSP", "art": "65", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a6-7"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 28, "q": "Con carácter general, la garantía definitiva que debe constituir el licitador que haya presentado la mejor oferta en un contrato celebrado por una Administración Pública asciende a:", "o": ["El 3 % del presupuesto base de licitación, IVA incluido.", "El 5 % del precio final ofertado, excluido el IVA.", "El 5 % del precio final ofertado, incluido el IVA.", "El 10 % del presupuesto base de licitación, excluido el IVA."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 107.1 LCSP", "ley": "LCSP", "art": "107", "mn": "«5 + 5 = máximo 10».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-19"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 29, "q": "Según la Ley 33/2003, del Patrimonio de las Administraciones Públicas, los bienes y derechos que integran el patrimonio de las Administraciones Públicas se clasifican, por razón de su régimen jurídico, en:", "o": ["Bienes muebles e inmuebles.", "Bienes artísticos y privados.", "Bienes de dominio público o demaniales y bienes de dominio privado o patrimoniales.", "Bienes afectos al servicio público y bienes inventariables."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 4 LPAP", "ley": "LPAP", "art": "4", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2003-20254#a4"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 30, "q": "Según el TREBEP, para el acceso a los cuerpos o escalas del Subgrupo C1 se exige estar en posesión del título de:", "o": ["Graduado en Educación Secundaria Obligatoria.", "Técnico Superior.", "Bachiller o Técnico.", "Bachiller."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 76 TREBEP", "ley": "TREBEP", "art": "76", "mn": "«Universidad-A, FP superior-B, Bachiller-C1, ESO-C2, sin título-AP».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a76"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 31, "q": "¿En qué artículos de nuestra CE se recogen los derechos fundamentales y de las libertades públicas?", "o": ["En los artículos 14 a 29", "En los artículos 15 a 30", "En los artículos 16 a 29", "En los artículos 15 a 29"], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: CE Título I Capítulo II Sección 1ª (14-29)", "ley": "CE", "art": "", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 32, "q": "En relación a los límites a la extensión de la nulidad o anulabilidad de los actos, según lo determinado en el artículo 49 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:", "o": ["La nulidad o anulabilidad en parte del acto administrativo implicará la de las partes del mismo independientes de aquélla", "La nulidad o anulabilidad de un acto no implicará la de los sucesivos en el procedimiento que sean independientes del primero", "La nulidad o anulabilidad de un acto implicará la de los sucesivos en el procedimiento en todo caso", "Ninguna es correcta"], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 49 LPACAP", "ley": "LPAC", "art": "49", "mn": "«La manzana podrida no pudre el cesto»: la nulidad no se extiende a los actos o partes INDEPENDIENTES.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a49"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 33, "q": "Según el artículo 52.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la Administración Pública podrá convalidar un acto cuyo vicio consista en incompetencia no determinante de nulidad:", "o": ["Por el órgano competente cuando sea superior jerárquico del que dictó el acto viciado", "Por el órgano competente cuando sea funcionalmente distinto del que dictó el acto viciado", "Por el órgano competente cuando sea territorialmente distinto del que dictó el acto viciado", "En ninguno de los anteriores casos"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 52.3 LPACAP", "ley": "LPAC", "art": "52", "mn": "Convalidación: solo actos ANULABLES. Produce efecto desde su fecha (salvo la retroactividad del 39.3). Incompetencia no determinante de nulidad: la convalida el superior jerárquico. Falta de autorización: se convalida otorgándola.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a52"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 34, "q": "Señala la respuesta incorrecta respecto a la información pública según lo establecido en el artículo 83.3 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:", "o": ["La incomparecencia en este trámite podrá impedir a los interesados interponer los recursos procedentes contra la resolución definitiva del procedimiento", "El órgano al que corresponda la resolución del procedimiento, cuando la naturaleza de este lo requiera, podrá acordar un periodo de información pública", "Conforme a lo dispuesto en las leyes, las Administraciones Públicas podrán establecer otras formas, medios y cauces de participación de las personas, directamente o a través de las organizaciones y asociaciones reconocidas por la ley en el procedimiento en el que se dictan los actos administrativos", "La comparecencia en el trámite de información pública no otorga, por sí misma, la condición de interesado"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 83.3 LPACAP", "ley": "LPAC", "art": "83", "mn": "Información pública: «20 días como MÍNIMO». Quien alega NO es interesado por ello, pero tiene derecho a una respuesta RAZONADA (puede ser común).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a83"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 35, "q": "Según el artículo 86 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, la terminación convencional implica:", "o": ["Las Administraciones Públicas podrán celebrar acuerdos, pactos, convenios o contratos con personas tanto de Derecho público como privado, siempre que no sean contrarios al ordenamiento jurídico ni versen sobre materias no susceptibles de transacción", "En los casos de procedimientos de responsabilidad patrimonial, el acuerdo alcanzado entre las partes deberá fijar la cuantía y modo de indemnización", "Requerirán en todo caso la aprobación expresa del Consejo de Ministros u órgano equivalente de las Comunidades Autónomas, los acuerdos que versen sobre materias de la competencia directa de dicho órgano", "Todas son correctas"], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 86 LPACAP", "ley": "LPAC", "art": "86", "mn": "Pacto: posible si no es contrario al ordenamiento ni sobre materias NO transigibles. No altera competencias. En responsabilidad patrimonial fija cuantía y modo de indemnizar (art. 34 LRJSP).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a86"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 36, "q": "Señala la respuesta incorrecta respecto de la caducidad según el artículo 95 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:", "o": ["La caducidad no producirá por sí sola la prescripción de las acciones del particular o de la administración, pero los procedimientos caducados interrumpirán el plazo de prescripción", "No podrá acordarse la caducidad por la simple inactividad del interesado en la cumplimentación de trámites, siempre que no sean indispensables para dictar resolución", "Podrá no ser aplicable la caducidad en el supuesto de que la cuestión suscitada afecte a interés general, o fuera conveniente sustanciarla para su definición y esclarecimiento", "En los casos en los que sea posible la iniciación de un nuevo procedimiento por no haberse producido la prescripción, podrán incorporarse a este los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 95 LPACAP", "ley": "LPAC", "art": "95", "mn": "Caducidad por culpa del interesado: «AVISO + 3 MESES» → archivo. La caducidad no extingue la acción, pero el procedimiento caducado NO interrumpe la prescripción. No cabe si se trata de un trámite NO indispensable.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a95"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 37, "q": "Según lo establecido en el artículo 25.2 de la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local, el municipio ejercerá en todo caso como competencia propia, en los términos de la legislación del Estado y de las Comunidades Autónomas, en la/s siguiente/s materia/s:", "o": ["Medio ambiente urbano: en particular, parques y jardines públicos, gestión de los residuos sólidos urbanos y protección contra la contaminación acústica, lumínica y atmosférica en las zonas urbanas", "Protección del medio ambiente", "Promoción y participación en comunidades ciudadanas de energía y comunidades de energías renovables que permitan contribuir a la obtención de beneficios medioambientales, económicos o sociales en los municipios donde operan", "Las respuestas a) y c) son correctas"], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 25.2 LRBRL", "ley": "LBRL", "art": "25", "mn": "Competencias propias (25.2): ¡las de cada día en el pueblo! Urbanismo, medio ambiente urbano, agua, infraestructura viaria, policía local, tráfico, protección civil, residuos, cementerios, mercados, transporte urbano, cultura, deporte, turismo, ferias, servicios sociales (atención inmediata), vigilancia de la escolaridad. Siempre determinadas por LEY.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a25"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 38, "q": "Según lo determinado en el artículo 26.1 de la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local, los municipios deberán prestar el servicio de prevención y extinción de incendios:", "o": ["En todos los municipios", "En los de más de 5.000 habitantes", "En los de más de 10.000 habitantes", "En los de más de 20.000 habitantes"], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 26 LRBRL", "ley": "LBRL", "art": "26", "mn": "Servicios mínimos en 4 escalones: TODOS (alumbrado, cementerio, recogida de residuos, limpieza viaria, agua, alcantarillado, acceso, pavimentación); >5.000 «PaBiTra» (parque, biblioteca, tratamiento de residuos); >20.000 «ProSoInDe» (protección civil, servicios sociales, incendios, deportes); >50.000 «TraMa» (transporte urbano, medio ambiente urbano). La Diputación coordina en municipios de <20.000.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a26"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 39, "q": "De los siguientes, son contratos privados los contratos celebrados por una Administración Pública que tengan por objeto:", "o": ["La suscripción a revistas, publicaciones periódicas o bases de datos", "La concesión de servicios públicos", "Los contratos de colaboración entre el sector público y el sector privado", "Las respuestas a) y c) son correctas"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 21.1.a) LCSP", "ley": "LCSP", "art": "21", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a2-3"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 40, "q": "Según el artículo 92 del Reglamento orgánico municipal del Ayuntamiento de Enguera relativo a la representación de los grupos municipales:", "o": ["Los grupos políticos municipales actuarán representados por su portavoz", "El portavoz del grupo podrá dar la palabra a un miembro de su partido político, aunque no sea concejal, siempre que realice indicación al respecto", "Podrá existir un portavoz suplente primero y un portavoz suplente segundo", "Las respuestas a) y c) son correctas"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 92 ROM", "ley": "rom_enguera", "art": "92", "mn": "", "url": ""}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 41, "q": "- ¿Qué artículo de la Constitución Española de 1978 consagra el principio de suficiencia financiera de las Haciendas Locales?", "o": ["Artículo 137", "Artículo 141", "Artículo 142", "Artículos 117 a 120."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 142 CE", "ley": "CE", "art": "142", "mn": "Haciendas locales: medios SUFICIENTES; se nutren FUNDAMENTALMENTE de tributos propios y de la participación en los del Estado y de las CCAA.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229#a142"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 42, "q": "- ¿Qué recurso cabe contra la aprobación definitiva de una ordenanza fiscal municipal?", "o": ["Recurso contencioso - administrativo", "Recurso potestativo de reposición y recurso contencioso - administrativo", "Recurso de reposición", "Reclamación económica administrativa"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 112.3 LPACAP", "ley": "LPAC", "art": "112", "mn": "Recursos: alzada o reposición contra resoluciones y actos de trámite cualificados («DIIP»: Deciden el fondo, Imposibilitan continuar, Indefensión, Perjuicio irreparable). Contra disposiciones generales NO cabe recurso administrativo.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a112"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 43, "q": "- Los miembros de la Corporación Local que no tengan dedicación exclusiva ni dedicación parcial:", "o": ["No podrán percibir asistencias por la concurrencia efectiva a las sesiones de los órganos colegiados de la Corporación de que formen parte.", "Los miembros de la Corporación, siempre tienen obligación de tener dedicación exclusiva.", "Percibirán asistencias por la concurrencia efectiva a las sesiones de los órganos colegiados de la Corporación de que formen parte, en la cuantía señalada por el Pleno de la misma.", "Ninguna de las anteriores"], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 75.3", "ley": "Sin ley identificada", "art": "75", "mn": "", "url": ""}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 44, "q": "- De conformidad con el artículo 20 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases de Régimen Local, indique cual de los siguientes constituye órgano u órganos de existencia obligatoria en todo Ayuntamiento:", "o": ["Los tenientes de Alcalde.", "La comisión especial de reclamaciones y sugerencias.", "La comisión informativa de urbanismo.", "La junta de portavoces."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 20 LRBRL", "ley": "LBRL", "art": "20", "mn": "Existen en todos los municipios: Alcalde, Tenientes de Alcalde, Pleno y Comisión Especial de Cuentas. JGL en los de >5.000 (o si lo decide el ROM o el Pleno).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a20"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 45, "q": "- Señale cuál de los siguientes recursos de la hacienda local carece de naturaleza tributaria:", "o": ["Precios públicos", "Impuestos", "Tasas", "Contribuciones especiales"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: TRLRHL dedica capítulo distinto a los precios públicos y a los tributos.", "ley": "TRLRHL", "art": "", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 46, "q": "La gestión e inspección tributaria del impuesto sobre vehículos de tracción mecánica, corresponde a:", "o": ["Al municipio que conste en el permiso de circulación del vehículo", "Al del municipio en el que esté empadronado el conductor del vehículo", "Al municipio de residencia del sujeto pasivo del impuesto", "Ninguna de las anteriores"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 97 TRLTHL", "ley": "TRLRHL", "art": "97", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a97"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 47, "q": "Según el artículo 53 de la Ley 39/2015, de 1 de octubre, de Procedimiento Administrativo Común de las Administraciones Públicas, es o son derechos del interesado el procedimiento administrativo:", "o": ["Identificar a las autoridades y al personal al servicio de las Administraciones Públicas bajo cuya responsabilidad se tramiten los procedimientos", "Cumplir las obligaciones de pago a través de los medios electrónicos previstos en el artículo 98.2.", "Obtener información y orientación acerca de los requisitos jurídicos o técnicos que las disposiciones vigentes impongan a los proyectos, actuaciones o solicitudes que se propongan realizar.", "Todos los anteriores son derechos del interesado."], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 53 LPACAP", "ley": "LPAC", "art": "53", "mn": "Interesado «CO-ID-NO-AL-AS-PA»: COnocer el estado · IDentificar autoridades · NO aportar lo ya entregado · ALegar antes de la audiencia · ASesor · PAgar electrónicamente. En sancionadores, además: saber de qué le acusan y PRESUNCIÓN de inocencia («no existencia de responsabilidad»).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a53"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 48, "q": "- Para la aprobación de los presupuestos municipales se requiere:", "o": ["La mayoría simple de los miembros presentes en la sesión correspondiente del Pleno", "La mayoría absoluta de los miembros en la sesión correspondiente del Pleno", "El voto favorable de la Alcaldía más dos tercios de los concejales presentes en la sesión plenaria correspondiente.", "Unanimidad de todos los miembros presentes en la sesión plenaria correspondiente."], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 22.2.e) LRBRL, 47.1 LRBRL y no está previsto en el 47.2 LRBRL", "ley": "LBRL", "art": "22", "mn": "Pleno = todos los Concejales, presidido por el Alcalde. Atribuciones «CONTROL-ORGANIZACIÓN-NORMAS-DINERO»: control de los órganos de gobierno, alteración del término, bandera, ordenanzas y reglamentos, presupuesto, plantilla y RPT, acciones judiciales en sus materias, cuestión de confianza. Indelegables las del 22.4 (salvo las delegables en el Alcalde y la JGL).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a22"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 49, "q": "- El período de exposición al público de los presupuestos municipales tras su aprobación inicial por el Pleno es de:", "o": ["10 días", "1 mes", "Se aprobará el periodo por resolución de la alcaldía.", "15 días"], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 169 TRLRHL", "ley": "TRLRHL", "art": "169", "mn": "Presupuesto «15-1M-31D»: exposición pública de 15 días previo anuncio en el BOP; sin reclamaciones queda aprobado; si las hay, el Pleno tiene 1 MES para resolverlas; aprobación definitiva antes del 31 de diciembre; si no, se prorroga automáticamente el anterior.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a169"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 50, "q": "- No es un anexo que se une al Presupuesto General municipal:", "o": ["Los planes y programas de inversión y financiación que, para un plazo de cuatro años, podrán formular los municipios y demás entidades locales de ámbito supramunicipal.", "El estado de previsión de movimientos y situación de la deuda comprensiva del detalle de operaciones de crédito o de endeudamiento pendientes de reembolso al principio del ejercicio, de las nuevas operaciones previstas a realizar a lo largo del ejercicio y del volumen de endeudamiento al cierre del ejercicio económico, con distinción de operaciones a corto plazo, operaciones a largo plazo, de recurrencia al mercado de capitales y realizadas en divisas o similares, así como de las amortizaciones que se prevén realizar durante el mismo ejercicio.", "El estado de consolidación del presupuesto de la propia entidad con el de todos los presupuestos y estados de previsión de sus organismos autónomos y sociedades mercantiles", "El saldo de las cuentas bancarias municipales a fecha 30 de septiembre del ejercicio inmediato anterior. PREGUNTAS DE RESERVA: Éstas únicamente operarán y puntuarán si prosperase la impugnación de alguna de las 50 preguntas anteriores."], "a": "d", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 166.1 TRLRHL", "ley": "TRLRHL", "art": "166", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a166"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 51, "q": "Interpuesto un recurso administrativo contra un acto cuya ejecución no ha sido suspendida, el interesado solicita expresamente la suspensión. Si transcurre un mes desde que la solicitud de suspensión tuvo entrada en el registro electrónico de la Administración competente para decidirla sin que el órgano competente haya dictado y notificado resolución expresa sobre dicha solicitud:", "o": ["La solicitud de suspensión se entenderá desestimada por silencio administrativo.", "La ejecución del acto impugnado se entenderá suspendida.", "Deberán transcurrir tres meses para que pueda entenderse suspendida la ejecución.", "La suspensión solo se producirá si el recurso interpuesto es de reposición."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 117.3 LPACAP", "ley": "LPAC", "art": "117", "mn": "Silencio en la solicitud de suspensión: si no hay resolución en 1 MES desde la entrada en el registro, se entiende SUSPENDIDA. Causas para suspender: perjuicio IRREPARABLE o causa de NULIDAD del 47.1.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a117"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 52, "q": "En un contrato administrativo cuyo precio se formula en función de precios unitarios, ¿sobre qué magnitud debe fijarse el importe de la garantía definitiva?", "o": ["Sobre el precio final ofertado por el licitador, IVA incluido.", "Sobre el precio final ofertado por el licitador, IVA excluido.", "Sobre el presupuesto base de licitación, IVA excluido.", "Sobre el valor estimado del contrato."], "a": "c", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 107.3 LCSP", "ley": "LCSP", "art": "107", "mn": "«5 + 5 = máximo 10».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902#a1-19"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 53, "q": "Un funcionario interino ha sido nombrado para ocupar una plaza vacante conforme al artículo 10.1.a TREBEP. Antes de que transcurran tres años desde su nombramiento se publica la correspondiente convocatoria para cubrir la plaza, y el proceso selectivo se resuelve dentro de los plazos establecidos en el artículo 70 TREBEP. Al cumplirse los tres años desde el nombramiento:", "o": ["El funcionario interino debe cesar necesariamente ese mismo día.", "Puede permanecer excepcionalmente en la plaza hasta la resolución de la convocatoria, sin que su cese posterior origine derecho a compensación económica.", "Puede permanecer indefinidamente hasta que la plaza sea efectivamente ocupada por un funcionario de carrera, con derecho a indemnización al cesar.", "Solo puede permanecer seis meses adicionales desde el cumplimiento de los tres años."], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 10.4 TREBEP", "ley": "TREBEP", "art": "10", "mn": "Interinos «V-S-P-E»: Vacante (máximo 3 años), Sustitución, Programas (3 años + 12 meses), Exceso o acumulación de tareas (9 meses dentro de 18).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a10"}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 54, "q": "Según lo determinado en el artículo 124.6 del Reglamento orgánico municipal del Ayuntamiento de Enguera relativo a la regulación del turno de ruegos y preguntas en los Plenos:", "o": ["En el punto dedicado a los ruegos y preguntas se podrá abrir debate", "En el punto dedicado a los ruegos y preguntas no se abrirá debate en ningún caso", "El punto dedicado a los ruegos y preguntas podrá ser utilizado para formular propuestas o mociones", "Las respuestas a) y c) son correctas"], "a": "b", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 124.6 ROM", "ley": "rom_enguera", "art": "124", "mn": "", "url": ""}, {"ex": "Administrativo C1, Ayuntamiento de Enguera (28/09/2026)", "f": "2026-09-28", "n": 55, "q": "Según el artículo 104.5 del texto refundido de la Ley Reguladora de las Haciendas Locales, el supuesto de no sujeción para las transmisiones en las que no se haya producido un incremento de valor:", "o": ["Se aplica a instancia del interesado", "Se aplica de oficio por el interesado", "Se aplica de oficio por la entidad gestora del impuesto", "No se aplica, la transmisión tributa conforme a las reglas de determinación objetiva de la Base Imponible, y se aprueba por resolución de alcaldía previo informe de los servicios técnicos municipales. PLANTILLA DE RESPUESTAS EJERCICIO TEÓRICO TURNO LIBRE Pregunta Respuesta correcta Fundamento legal 1 D Art 9.3 CE 2 A Art 53.2 CE 3 A Art 14 CE 4 B Art 140 CE 5 A Art 11.2 LRBRL 6 C Art 30.2 LPACAP 7 B Art 68.1 LPACAP 8 A Art 118 LCSP 9 C Art 12.1 TREBEP 10 A Art 35 LPACAP 11 B Art. 31.2.b LPACAP 12 C Art. 30.4 LPACAP 13 B Art. 43.2 LPACAP 14 D Art. 41.6 LPACAP 15 C Art. 23.4 LRJSP 16 B Art. 46.2.c LRBRL 17 B Art. 46.2.a LRBRL 18 B Art. 16 de la Ley 19/2013, de transparencia, acceso a la información pública y buen gobierno. 19 B Art. 101.1.a y 101.2 LCSP 20 D Art. 170.2 TRLRHL. 21 B Art. 10.1.d TREBEP 22 D Art 59 TRLRHL 23 B Artículo 34.4 TRLOTUP, respecto del Plan General Estructural, dispone expresamente que este incluirá «documentación con eficacia normativa». Asimismo, la doctrina jurisprudencial reconoce dicha naturaleza reglamentaria (Jurisprudencia consolidada TS (STS núm. 133/2023, de 6 de febrero (rec. 1337/2022, ECLI:ES:TS:2023:290) (STS 490/2022, de 27 de abril) 24 B Art 28 TRLOTUP"], "a": "a", "mia": "?", "res": "Sin marcar", "e": "Plantilla del tribunal: Art 104.5 TRLRHL A los efectos de comunicaciones y otras incidencias, el tribunal tiene su sede en el Ayuntamiento de Enguera, C/ Doctor Albiñana, 1. El Secretario del Tribunal. DOCUMENTO FIRMADO ELECTRÓNICAMENTE", "ley": "TRLRHL", "art": "104", "mn": "Plusvalía (IIVTNU): impuesto DIRECTO; grava el incremento de valor de terrenos URBANOS por transmisión de la propiedad o de derechos reales de GOCE limitativos del dominio. No sujetos: los terrenos rústicos y las aportaciones o adjudicaciones entre cónyuges a la sociedad conyugal.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a104"}, {"ex": "Auxiliar administrativo C2, Ayuntamiento de Pilar de la Horadada (27/1", "f": "2026-10-27", "n": 1, "q": "En la Ley 39/2015, ¿qué artículo regula la obligación de resolver?", "o": ["CéjEl 21", "EI 22", "EI 23", "EI 24"], "a": "a", "mia": "a", "res": "Bien", "e": "Art. 21 Ley 39/2015: obligación de resolver.", "ley": "LPAC", "art": "21", "mn": "Obligación de resolver: «6-3». Máximo 6 meses salvo ley o Derecho UE; si la norma no fija plazo, 3 meses. Exentos: pacto o convenio y declaración responsable o comunicación. Se cuenta desde el acuerdo de iniciación (de oficio) o desde la entrada en el registro del órgano competente (a solicitud).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a21"}, {"ex": "Auxiliar administrativo C2, Ayuntamiento de Pilar de la Horadada (27/1", "f": "2026-10-27", "n": 3, "q": "EI plazo máximo en eI que debe notificarse la resolución expresa en un procedimientc administrativo será:", "o": ["Siempre de 3 meses", "I fijado por la norma reguladora del correspondiente procedimiento", "Siempre de 6 meses", "Siempre de 2 meses"], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 21.2 Ley 39/2015: el fijado por la norma reguladora (máximo 6 meses salvo ley; si no lo fija, 3 meses).", "ley": "LPAC", "art": "21", "mn": "Obligación de resolver: «6-3». Máximo 6 meses salvo ley o Derecho UE; si la norma no fija plazo, 3 meses. Exentos: pacto o convenio y declaración responsable o comunicación. Se cuenta desde el acuerdo de iniciación (de oficio) o desde la entrada en el registro del órgano competente (a solicitud).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a21"}, {"ex": "Auxiliar administrativo C2, Ayuntamiento de Pilar de la Horadada (27/1", "f": "2026-10-27", "n": 5, "q": "D. Antonio ha presentado un escrito ante eI Ayuntamiento de Pilar de la Horadada, en eI", "o": ["presentaba recurso frente a un acuerdo municipal por eI que se Ie denegaba la concesión de un vado de entrada y salida de vehículos. Sin embargo, por error, ha calificado eI recurso como recurso de alzada y no como recurso de reposición. Frente a este error:", "La Administración le requerirá rectificación del error, otorgándole un plazo de 10 días hábiles para ello", "EI Ayuntamiento tramitará el recurso como recurso de reposición, pues del escrito presentado se deduce su verdadero carácter", "EI Ayuntamiento archivará sin más trámite el escrito presentado y el acto adquirirá firmeza. d) Ninguna de las respuestas anteriores es correcta"], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 115.2 Ley 39/2015: el error en la calificación no impide la tramitación si se deduce su verdadero carácter.", "ley": "LPAC", "art": "115", "mn": "Error en el nombre del recurso: NO importa si se deduce su verdadero carácter. Quien causó el vicio NO puede alegarlo.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a115"}, {"ex": "Auxiliar administrativo C2, Ayuntamiento de Pilar de la Horadada (27/1", "f": "2026-10-27", "n": 6, "q": "El plazo para la in rposición del recurso de alzada:", "o": ["Será de Odos eses, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos", "Será de un mes, si el acto no fuera expreso. Transcurrido dicho plazo sin haberse interpuesto eI recurso, la resolución será firme a todos los efectos", "Será de un mes, si eI acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto eI recurso, la resolución será firme a todos los efectos", "Será de dos meses, si el acto no fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos"], "a": "c", "mia": "c", "res": "Bien", "e": "Art. 122.1 Ley 39/2015: alzada, un mes si el acto es expreso.", "ley": "LPAC", "art": "122", "mn": "Alzada «1-3»: 1 MES para interponer (sin plazo si no hay acto expreso), 3 MESES para resolver. Tras la alzada, solo el EXTRAORDINARIO de revisión.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a122"}, {"ex": "Auxiliar administrativo C2, Ayuntamiento de Pilar de la Horadada (27/1", "f": "2026-10-27", "n": 7, "q": "Según eI TREBEP, los empleados públicos se clasifican en:", "o": ["Funcionarios de carrera, funcionarios interinos, personal laboral, personal indefinido no fijo y personal eventual", "uncionarios de carrera, funcionarios interinos, personal laboral, ya sea fijo, por tiempo indefinido o temporal y personal eventual", "Funcionarios y personal laboral,", "Funcionarios de carrera y funcionarios interinos"], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 8.2 TREBEP: carrera, interinos, laboral (fijo, indefinido o temporal) y eventual.", "ley": "TREBEP", "art": "8", "mn": aciones respecto al teletrabajo NO es correcta?", "o": ["Se considera teletrabajo aquella modalidad de prestación de servicios a distancia en la que el contenido competencial del puesto de trabajo puede desarrollarse, siempre que las necesidades del servicio lo permitan, fuera de las dependencias de la Administración, mediante el uso de tecnologías de la información y comunicación.", "El personal laboral al servicio de las Administraciones Públicas se regirá, en materia de teletrabajo, por lo previsto en el presente Estatuto y por sus normas de desarrollo.", "La prestación del servicio mediante teletrabajo no habrá de ser expresamente autorizada, será compatible con la modalidad presencial y tendrá, con carácter general, naturaleza voluntaria y reversible salvo excepciones debidamente justificadas.", "El personal que preste sus servicios mediante teletrabajo tendrá los mismos deberes y derechos, individuales y colectivos, recogidos en el presente Estatuto que el resto del personal que preste sus servicios en modalidad presencial, incluyendo la normativa de prevención de riesgos laborales que resulte aplicable, salvo aquellos que sean inherentes a la realización de la prestación del servicio de manera presencial."], "a": "c", "mia": "c", "res": "Bien", "e": "Art. 47 bis.2 TREBEP: la prestación mediante teletrabajo HABRÁ DE SER EXPRESAMENTE AUTORIZADA. Trampa: el «no».", "ley": "TREBEP", "art": "47 bis", "mn": "", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719#a4-2"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 3, "q": "Respecto a la alteración de los términos municipales (creación, supresión o fusión de municipios), ¿cuál es un requisito indispensable exigido por la LBRL?", "o": ["Debe ser aprobada en todo caso por una Ley Orgánica de las Cortes Generales.", "Requiere únicamente el acuerdo unánime de los alcaldes de los municipios afectados, sin intervención autonómica.", "La creación de nuevos municipios solo podrá realizarse sobre la base de núcleos de población territorialmente diferenciados, de al menos 5.000 habitantes.", "Los municipios resultantes deben ser financieramente sostenibles, contar con recursos suficientes y no suponer disminución en la calidad de los servicios que venían siendo prestados."], "a": "d", "mia": "d", "res": "Bien", "e": "Art. 13.2 LBRL. Ojo: la opción c) también recoge un requisito del art. 13.2 (núcleos diferenciados de al menos 5.000 habitantes) pero solo para la CREACIÓN; la d) es la que vale para toda alteración. Pregunta impugnable.", "ley": "LBRL", "art": "13", "mn": "«4.000, no 5.000»: para segregar y crear municipio hacen falta núcleos de población territorialmente diferenciados de al menos 4.000 habitantes. Truco: 4 patas = un municipio que se sostiene. Además, el nuevo y el de origen deben ser financieramente sostenibles, sin merma de la calidad del servicio.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a13"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 4, "q": "En relación con el Padrón municipal y la gestión de sus datos, ¿cuál de las siguientes afirmaciones es correcta de acuerdo con el artículo 16 de la Ley de Bases del Régimen Local?", "o": ["Los datos del Padrón municipal relativos al domicilio de los ciudadanos son confidenciales y no pueden ser cedidos a ninguna otra Administración Pública sin el consentimiento expreso del afectado.", "Los datos obligatorios del Padrón municipal se cederán a otras Administraciones Públicas que lo soliciten sin consentimiento previo del afectado solamente cuando les sean necesarios para el ejercicio de sus respectivas competencias, y exclusivamente para asuntos en los que la residencia o el domicilio sean datos relevantes.", "La inscripción en el Padrón municipal de los extranjeros no comunitarios sin autorización de residencia permanente caduca por imperativo legal a los tres años, salvo que procedan a su renovación.", "El Padrón municipal se renueva obligatoriamente de forma integral mediante un censo general cada cinco años por acuerdo del Pleno."], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 16.3 LBRL. Trampa c): son DOS años (art. 16.1 párrafo 2.º), no tres.", "ley": "LBRL", "art": "16", "mn": "Padrón: prueba de residencia y domicilio. Extranjeros no comunitarios sin residencia de larga duración: renovación cada 2 AÑOS.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392#a16"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 5, "q": "La aplicación a un procedimiento de la tramitación de urgencia supondrá la reducción a la mitad de los plazos establecidos para el procedimiento ordinario, salvo los relativos a:", "o": ["La emisión de informes y la presentación de solicitudes.", "La notificación y la presentación de recursos.", "La presentación de solicitudes y la presentación de recursos.", "La publicación y la emisión de informes."], "a": "c", "mia": "c", "res": "Bien", "e": "Art. 33.1 LPAC: salvo los relativos a la presentación de solicitudes y recursos.", "ley": "LPAC", "art": "33", "mn": "Urgencia = MITAD de plazos, pero «SoRe» no se tocan: SOlicitudes y REcursos. No recurrible.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a33"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 6, "q": "De conformidad con el art. 68 de la Ley 39/2015, de 1 de octubre, el plazo de 10 días para subsanar una solicitud, cuando la aportación de los documentos requeridos presente dificultades especiales, podrá ser ampliado prudencialmente:", "o": ["Hasta 10 días en cualquier caso, previa resolución motivada del órgano competente.", "Hasta 5 días siempre que no se trate de procedimientos selectivos, de concurrencia competitiva, o de responsabilidad patrimonial.", "Hasta 10 días siempre que no se trate de procedimientos selectivos o de concurrencia competitiva.", "Hasta 5 días siempre que no se trate de procedimientos selectivos o de concurrencia competitiva."], "a": "d", "mia": "d", "res": "Bien", "e": "Art. 68.2 LPAC: hasta cinco días, a petición del interesado o a iniciativa del órgano, salvo procedimientos selectivos o de concurrencia competitiva. Trampa b): la responsabilidad patrimonial no está.", "ley": "LPAC", "art": "68", "mn": "Subsanación: «10 + 5» días (los 5 de ampliación NO en selectivos ni concurrencia competitiva). Si no se subsana = DESISTIDO, previa resolución. Si un obligado presenta en papel: se le requiere subsanar electrónicamente y la fecha válida es la de la subsanación.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a68"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 7, "q": "En relación con la delimitación conceptual entre tasas y precios públicos, ¿cuál de las siguientes afirmaciones es correcta?", "o": ["Procederá fijar un precio público cuando el servicio sea obligatorio por disposición legal o reglamentaria pero se preste mediante gestión indirecta por una empresa concesionaria.", "Se considerará tasa cuando la prestación del servicio en régimen de derecho público no sea de solicitud o recepción voluntaria para los administrados, o cuando no se preste o realice por el sector privado.", "Se considerará tasa cuando el servicio sea de solicitud o recepción voluntaria para los administrados y sea prestado concurrentemente por el sector privado.", "Se considerará tasa cuando la prestación del servicio en régimen de derecho público no sea de solicitud o recepción voluntaria para los administrados, y cuando no se preste o realice por el sector privado."], "a": "b", "mia": "b", "res": "Bien", "e": "Art. 20.1.B TRLRHL: basta UNA de las dos circunstancias («o»). La d) exige las dos («y»): trampa.", "ley": "TRLRHL", "art": "20", "mn": "Tasa = «DO o SE no voluntario»: utilización privativa o aprovechamiento especial del DOminio público, o prestación de un SErvicio/actividad en régimen de Derecho público que no sea de solicitud voluntaria o que no presta el sector privado.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2004-4214#a20"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 8, "q": "De conformidad con el contenido del art. 80 de la Ley 39/2015, ¿cuál es la regla general sobre la naturaleza y el plazo de emisión de informes?", "o": ["Salvo disposición en contrario, los informes serán preceptivos y vinculantes y deberán emitirse en el plazo máximo de 15 días con las salvedades establecidas en la ley.", "Salvo disposición en contrario, los informes serán facultativos y vinculantes y deberán emitirse en el plazo máximo de 10 días.", "Salvo disposición en contrario, los informes serán facultativos y no vinculantes y deberán emitirse en el plazo máximo de 10 días con las salvedades establecidas en la ley.", "Salvo disposición en contrario, los informes serán no vinculantes y preceptivos y deberán emitirse en el plazo máximo de 15 días."], "a": "c", "mia": "c", "res": "Bien", "e": "Art. 80.1 y 80.2 LPAC: facultativos y no vinculantes; 10 días.", "ley": "LPAC", "art": "80", "mn": "Informes «F-NV-10»: Facultativos, No Vinculantes, 10 días. Si no llega un informe PRECEPTIVO, se puede suspender el plazo de resolver (máximo 3 meses, art. 22).", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a80"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 9, "q": "¿Cuál de las siguientes materias es ejercida como competencia propia por los municipios?", "o": ["Inspección y sanción de los espectáculos públicos.", "Realización de actividades complementarias en los centros docentes.", "Promoción y gestión turística.", "Evaluación e información de situaciones de necesidad social."], "a": "d", "mia": "c", "res": "Mal", "e": "Art. 25.2.e) LBRL, olo se consideran actos de discriminación cuando son cometidos por un superior jerárquico en el ámbito de una relación laboral o funcionarial.", "El condicionamiento de un derecho o de una expectativa de derecho a la aceptación de una situación constitutiva de acoso sexual o de acoso por razón de sexo se considerará también acto de discriminación por razón de sexo.", "Cualquier persona podrá recabar de los tribunales la tutela del derecho a la igualdad entre mujeres y hombres, de acuerdo con lo establecido en el artículo 51.2 de la Constitución."], "a": "c", "mia": "c", "res": "Bien", "e": "Art. 7.4 LO 3/2007. Trampas: a) son NULOS (art. 10); d) es el art. 53.2 CE (art. 12).", "ley": "LO 3/2007", "art": "7", "mn": "Acoso SEXUAL = comportamiento «de naturaleza sexual». Acoso POR RAZÓN DE SEXO = comportamiento «en función del sexo». Ambos: atentan contra la dignidad, entorno intimidatorio, degradante u ofensivo. Ambos son discriminatorios.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115#a7"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 13, "q": "En relación con las funciones esenciales de la Comisión Especial de Cuentas, ¿cuál de las siguientes afirmaciones es correcta?", "o": ["Tiene atribuida la competencia exclusiva de aprobar de forma definitiva los Presupuestos Generales del Ayuntamiento.", "Puede dictar liquidaciones de tributos locales y resolver reclamaciones económico-administrativas en sustitución de la Junta de Gobierno Local.", "Le corresponde el examen, estudio e informe de todas las cuentas, presupuestarias y extrapresupuestarias, que deba aprobar el Pleno de la Corporación.", "Ejerce la potestad disciplinaria y sancionadora sobre el personal funcionario técnico de la Intervención y de la Tesorería."], "a": "c", "mia": "c", "res": "Bien", "e": "Art. 127 ROF (y art. 116 LBRL).", "ley": "ROF", "art": "127", "mn": "«Cuentas → Comisión Especial → Pleno».", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1986-33252#art127"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 14, "q": "A efectos de determinar el número de Delegados de Prevención en una empresa, ¿cómo se computarán los trabajadores vinculados por contratos de duración determinada de hasta un año según el artículo 35.3 de la Ley 31/1995?", "o": ["Se computarán según el número de días trabajados en el período de un año anterior a la designación, a razón de cada doscientos días trabajados o fracción como un trabajador más.", "Se computarán todos íntegramente como fijos de plantilla, con independencia de los días trabajados en el año anterior.", "No se computarán en ningún caso, debiendo tenerse en cuenta exclusivamente a los trabajadores con contrato indefinido.", "Se computarán a razón de cien días trabajados o fracción como un trabajador más, salvo que el convenio colectivo disponga lo contrario."], "a": "a", "mia": "a", "res": "Bien", "e": "Art. 35.3 LPRL: más de un año = fijos; hasta un año = según días trabajados el año anterior, cada 200 días o fracción = 1 trabajador más.", "ley": "LPRL", "art": "35", "mn": "Delegados de Prevención por escala «50-100: 2 · 101-500: 3 · 501-1000: 4 · 1001-2000: 5 · 2001-3000: 6 · 3001-4000: 7 · más de 4001: 8». Hasta 30 trabajadores, el Delegado de Personal; de 31 a 49, uno elegido por y entre los Delegados de Personal.", "url": "https://www.boe.es/buscar/act.php?id=BOE-A-1995-24292#a35"}, {"ex": "Auxiliar administrativo C2, Ajuntament de Benicàssim (14/11/2026, mode", "f": "2026-11-14", "n": 15, "q": "De conformidad con el art. 78 del TREBEP, la provisión de puestos de trabajo se realizará mediante los procedimientos de:", "o": ["Oposición y concurso-oposición.", "Concurso.", "Concurso y libre designación con convocatoria pública.", "Las respuestas a) y b) son correctas."], "a": "c", "mia": "b", "res": "Mal", "e": "Art. 78.2 TREBEP: concurso y libre designación con convocatoria pública.",
